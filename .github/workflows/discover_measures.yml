name: JUANITO — Discover Measure Names

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Discover measures
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME:        ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD:        ${{ secrets.PBI_PASSWORD }}
        run: python scripts/discover_measures.py
      - name: Commit discovered measures
        run: |
          git config user.name "JUANITO Bot"
          git config user.email "juanito@pauno.pe"
          git add data/latest/discovered_measures.json
          git diff --staged --quiet || git commit -m "discover: medidas encontradas $(date +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:main
