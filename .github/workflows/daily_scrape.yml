name: Juanito Garcia — Scraper Diario

on:
  schedule:
    # 12:00 UTC = 07:00 Lima (America/Lima UTC-5)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:  # permite ejecutar manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright anthropic requests
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scraper Power BI
        run: |
          python scripts/scrape_powerbi.py --output data/latest
        env:
          PYTHONUNBUFFERED: "1"

      - name: Verificar archivos generados
        run: |
          echo "PNGs capturados:"
          find data/latest -name "*.png" | wc -l

      - name: Commit y push datos
        run: |
          git config user.name "Juanito Garcia Bot"
          git config user.email "juanito@juanito-garcia.local"
          # Solo imágenes — NO tocar summaries.json (lo gestiona fetch_powerbi.yml)
          git add data/latest/PAUNO data/latest/AMAUTA data/latest/NEOPACK
          git diff --staged --quiet || git commit -m "fotos $(date +'%Y-%m-%d %H:%M') Lima"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
