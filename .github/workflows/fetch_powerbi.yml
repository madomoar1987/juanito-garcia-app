name: JUANITO — Fetch Power BI Data

on:
  schedule:
    # Un solo disparo, a peticion del usuario (13/09/2026).
    #
    # OJO: la hora del cron NO es la hora de ejecucion. GitHub corre las
    # tareas programadas cuando tiene capacidad, y en este repositorio el
    # retraso medido es de 3.2 a 4.7 horas (cuatro dias habiles seguidos, un
    # cron de las 12:00 UTC ejecutado a las 15:13, 15:18, 15:27 y 16:43).
    #
    # Por eso el disparo va a las 07:30 UTC — las 2:30 de Lima. Con ese
    # retraso el dato aterriza entre las 5:42 y las 7:12 de la manana, que es
    # lo que se pidio: tenerlo listo a las 7.
    #
    # Al quedar un solo horario ya no hay reintento: si una corrida falla, el
    # tablero se queda con el dato del dia anterior hasta la manana siguiente.
    # El correo de fallo avisa igual, y siempre se puede lanzar a mano.
    - cron: '30 7 * * *'
  workflow_dispatch:  # permite correr manualmente

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Power BI data
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME:        ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD:        ${{ secrets.PBI_PASSWORD }}
          PBI_WORKSPACE_ID:    ${{ secrets.PBI_WORKSPACE_ID }}
        run: python scripts/fetch_powerbi.py

      - name: Fetch serie histórica mensual (desde Ene-2025)
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME:        ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD:        ${{ secrets.PBI_PASSWORD }}
        run: python scripts/fetch_series.py
        continue-on-error: true

      # Se cruzan las cifras entre si ANTES de publicar: un total contra la
      # suma de sus partes, un ratio contra sus operandos, la misma magnitud
      # medida en dos reportes. Lo que no cuadra queda anotado dentro de los
      # datos, para que la app lo muestre junto a la cifra en vez de dejarlo
      # en un registro que nadie abre.
      #
      # No corta la corrida. Congelar el tablero por un descuadre ya costo
      # cuatro dias en setiembre, y un dato con una advertencia visible sirve
      # mas que ningun dato.
      - name: Validar coherencia de las cifras
        run: python scripts/validar_datos.py --anotar

      # Ejecuta las tarjetas capturadas del reporte —la misma consulta que
      # Power BI usa para pintar el numero en pantalla— y las compara con lo
      # que va a publicar la app. Es la validacion "contra lo que veo en Power
      # BI" sin tener que mandar capturas de pantalla cada dia.
      - name: Comparar contra las tarjetas del reporte
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME:        ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD:        ${{ secrets.PBI_PASSWORD }}
          PBI_WORKSPACE_ID:    ${{ secrets.PBI_WORKSPACE_ID }}
        run: python scripts/validar_tarjetas.py --anotar
        continue-on-error: true

      - name: Commit & push JSON files
        run: |
          git config user.name  "JUANITO Bot"
          git config user.email "juanito@pauno.pe"
          git add data/latest/summaries.json data/latest/measure_cache.json data/latest/series.json data/historico/historico.json || true
          git diff --staged --quiet && echo "sin cambios que publicar" && exit 0
          git commit -m "data: auto-update Power BI $(date -u +'%Y-%m-%d %H:%M UTC') [${{ github.event_name }}]"

          # La corrida tarda ~10 minutos. Si alguien sube algo al repositorio
          # mientras tanto, el push se rechaza y se pierde toda la extracción
          # aunque haya funcionado (pasó en la corrida 63). Se reintenta
          # trayendo lo nuevo con rebase: los datos van en archivos propios,
          # así que no hay conflicto real con cambios de código.
          REMOTO="https://x-access-token:${{ secrets.GH_PAT }}@github.com/rgarciaa78-svg/juanito-garcia-app.git"
          for intento in 1 2 3; do
            if git push "$REMOTO" HEAD:main; then
              echo "publicado en el intento $intento"
              exit 0
            fi
            echo "push rechazado — traigo los cambios remotos y reintento"
            git pull --rebase "$REMOTO" main || exit 1
          done
          echo "no se pudo publicar tras 3 intentos"
          exit 1

      # OJO con el orden: este paso va DESPUÉS de publicar, nunca antes.
      # Puesto antes, cualquier hueco abortaba la corrida sin publicar nada, y
      # como el dato viejo seguía en su sitio, la corrida siguiente fallaba
      # por lo mismo. Así se congeló el tablero del 10 al 13 de setiembre.
      #
      # Ahora el dato fresco se publica siempre, y si algo salió incompleto el
      # job igual termina en rojo y GitHub manda el correo — que es para lo
      # que servía el canario. Avisar no requiere retener el dato.
      - name: Avisar si el dato publicado salió incompleto
        run: python scripts/verificar_publicado.py

      # Cuando la extraccion muere, los pasos siguientes se saltan y el
      # traceback se queda dentro del runner: leerlo exige permisos sobre el
      # log de Actions. Este paso publica solo el archivo del error — nunca
      # los datos, que en ese momento estan a medio escribir.
      - name: Publicar el error si la corrida murio
        if: failure()
        run: |
          test -f data/latest/ultimo_error.txt || exit 0
          # La extraccion murio a medias y dejo otros archivos tocados, asi que
          # `git pull --rebase` se negaba y este paso moria con codigo 128 —
          # dejando el error dentro del runner, que es justo lo que existe para
          # evitar. Se aparta el archivo, se limpia todo lo demas, y se publica
          # solo el error.
          cp data/latest/ultimo_error.txt /tmp/ultimo_error.txt
          git checkout -- . || true
          git clean -fd data/latest || true
          cp /tmp/ultimo_error.txt data/latest/ultimo_error.txt
          git config user.name  "JUANITO Bot"
          git config user.email "juanito@pauno.pe"
          git add -f data/latest/ultimo_error.txt
          git diff --staged --quiet && exit 0
          git commit -m "error: la corrida murio $(date -u +'%Y-%m-%d %H:%M UTC')"
          REMOTO="https://x-access-token:${{ secrets.GH_PAT }}@github.com/rgarciaa78-svg/juanito-garcia-app.git"
          for i in 1 2 3; do
            git push "$REMOTO" HEAD:main && exit 0
            git pull --rebase "$REMOTO" main || true
          done
          echo "no se pudo publicar el error"
