// Determina si una tendencia es "buena" o "mala" dado el tipo de KPI
// Por defecto: sube = malo para mora/dias/vencido; sube = bueno para margen/ventas/cumplimiento
function trendClass(tendencia, label) {
  if (!tendencia) return 'flat';
  const t = tendencia.toLowerCase();
  const lbl = (label || '').toLowerCase();
  // KPIs donde "sube" es malo
  const subeBad = lbl.includes('mora') || lbl.includes('dias') || lbl.includes('cxp') ||
    lbl.includes('vencido') || lbl.includes('merma') || lbl.includes('dead') || lbl.includes('criticos');
  // KPIs donde "baja" es malo
  const bajaGood = !subeBad;
  if (t.includes('sube') || t.includes('crecien') || t.includes('aument')) return subeBad ? 'bad' : 'good';
  if (t.includes('baja') || t.includes('descend') || t.includes('dismin') || t.includes('mejor') || t.includes('reduci')) return subeBad ? 'good' : 'bad';
  return 'flat';
}
function trendArrow(tendencia, label) {
  const cls = trendClass(tendencia, label);
  const t = (tendencia || '').toLowerCase();
  const up = t.includes('sube') || t.includes('crecien') || t.includes('aument');
  const down = t.includes('baja') || t.includes('descend') || t.includes('dismin') || t.includes('mejor') || t.includes('reduci');
  const arrow = up ? '↑' : down ? '↓' : '→';
  return { arrow, cls };
}

// ── Utilidades de serie ─────────────────────────────────────
function serieDe(dsKey, medida) {
  // Dos formas de llamarla, porque conviven dos estilos en la app:
  //   serieDe('margen', '% Margen Variable')   ← KPI_SOURCE
  //   serieDe(['margen', '% Margen Variable']) ← metas.json
  // Hubo un tiempo dos funciones con este nombre y la segunda tapaba a la
  // primera: analizar() devolvía null para todos los KPIs, en silencio.
  if (Array.isArray(dsKey)) {
    medida = dsKey[1];
    dsKey = dsKey[0];
  }
  if (!SERIES || !SERIES.datasets) return null;
  const ds = SERIES.datasets[dsKey];
  if (!ds) return null;

  // Margen variable se deriva de Precio y Costo por kilo
  if (medida === '__margen_calc__') {
    const p = ds['Precio x Kilo'], c = ds['Costo x Kilo'];
    if (!p || !c) return null;
    return p.map((pv, i) => {
      const cv = c[i];
      if (pv == null || cv == null || pv === 0) return null;
      return (pv - cv) / pv;
    });
  }
  const arr = ds[medida];
  return Array.isArray(arr) ? arr : null;
}

function periodos() { return (SERIES && SERIES.periodos) || []; }

// El ultimo periodo de la serie es el mes EN CURSO y va incompleto: doce dias
// contra treinta. Compararlo de igual a igual con un mes cerrado hace leer
// una caida donde solo hay calendario.
function mesParcial() { return (SERIES && SERIES.parcial) || null; }
// Ultimo mes CERRADO. Es el que corresponde a las tarjetas de KPI, que se
// extraen con el filtro del mes completo: titular el tablero con el mes en
// curso pondria "Septiembre" encima de cifras de agosto.
function mesCerrado() {
  const ps = periodos();
  for (let i = ps.length - 1; i >= 0; i--) if (!esParcial(ps[i])) return ps[i];
  return ps[ps.length - 1] || null;
}
function esParcial(periodo) { return !!periodo && periodo === mesParcial(); }
function marcaParcial(periodo) {
  return esParcial(periodo) ? ' <i>(mes en curso, parcial)</i>' : '';
}

function idxUltimoConDato(vals) {
  for (let i = vals.length - 1; i >= 0; i--) if (vals[i] != null) return i;
  return -1;
}

/**
 * Una medida que devuelve el mismo valor en todos los meses NO responde al filtro
 * de fecha del modelo: es un total estático, no una serie. Comparar MoM o YoY sobre
 * ella daría 0.0% siempre — un análisis falso. Se detecta y se descarta.
 */
function serieEsEstatica(vals) {
  const v = vals.filter(x => x != null);
  if (v.length < 3) return true;
  // 4 cifras significativas: valores que difieren en decimales irrelevantes cuentan como iguales
  const claves = v.map(x => Number(x).toPrecision(4));
  const distintos = new Set(claves);
  if (distintos.size === 1) return true;
  // Función escalón: muy pocos valores distintos en muchos meses
  if (v.length >= 10 && distintos.size <= 3) return true;
  // Un mismo valor domina la serie → es un total que no se filtró por mes
  const conteo = {};
  claves.forEach(k => { conteo[k] = (conteo[k]||0)+1; });
  return Math.max(...Object.values(conteo)) / v.length > 0.70;
}

// Acumulado del año hasta el índice dado (inclusive)
function acumHasta(vals, ps, idx, anio) {
  let s = 0, n = 0;
  for (let i = 0; i <= idx; i++) {
    if (ps[i] && ps[i].startsWith(anio) && vals[i] != null) { s += vals[i]; n++; }
  }
  return n ? { suma: s, prom: s / n, meses: n } : null;
}

/**
 * Analiza un KPI: último valor, MoM, YoY, acumulado YTD vs año anterior.
 * Devuelve null si no hay serie.
 */
function analizar(label) {
  const src = KPI_SOURCE[label];
  if (!src) return null;
  const vals = serieDe(src.ds, src.m);
  const ps = periodos();
  if (!vals || !ps.length) return null;

  // La medida no se deja filtrar por mes → no hay serie que analizar
  if (serieEsEstatica(vals)) return { estatica: true, src, vals, ps };

  const i = idxUltimoConDato(vals);
  if (i < 0) return null;
  const actual = vals[i];
  const per = ps[i];
  const anio = per.slice(0, 4), mes = per.slice(5, 7);

  // Mes anterior
  let mom = null;
  for (let j = i - 1; j >= 0; j--) {
    if (vals[j] != null) { mom = { valor: vals[j], periodo: ps[j] }; break; }
  }

  // Mismo mes del año anterior
  const perYoY = (parseInt(anio) - 1) + '-' + mes;
  const jY = ps.indexOf(perYoY);
  const yoy = (jY >= 0 && vals[jY] != null) ? { valor: vals[jY], periodo: perYoY } : null;

  // Acumulado del año vs mismo tramo del año anterior
  const ytd = acumHasta(vals, ps, i, anio);
  let idxPrevFin = -1;
  for (let k = 0; k < ps.length; k++) {
    if (ps[k] === perYoY) { idxPrevFin = k; break; }
  }
  const ytdPrev = idxPrevFin >= 0 ? acumHasta(vals, ps, idxPrevFin, String(parseInt(anio) - 1)) : null;

  const esPct = src.fmt === 'pct';
  const agg = src.agg || (esPct ? 'avg' : 'sum');

  // Un saldo (stock) no se acumula: su "acumulado" no significa nada
  const acumAct  = agg === 'last' ? null : ytd     ? (agg === 'avg' ? ytd.prom     : ytd.suma)     : null;
  const acumPrev = agg === 'last' ? null : ytdPrev ? (agg === 'avg' ? ytdPrev.prom : ytdPrev.suma) : null;

  const delta   = (a, b) => (a == null || b == null || b === 0) ? null : (a - b) / Math.abs(b) * 100;
  const deltaPP = (a, b) => (a == null || b == null) ? null : (a - b) * 100;

  return {
    src, agg, vals, ps, idx: i, actual, periodo: per,
    mom:  mom  ? { ...mom,  var: esPct ? deltaPP(actual, mom.valor)  : delta(actual, mom.valor),  unidad: esPct?'pp':'%' } : null,
    yoy:  yoy  ? { ...yoy,  var: esPct ? deltaPP(actual, yoy.valor)  : delta(actual, yoy.valor),  unidad: esPct?'pp':'%' } : null,
    ytd:  agg === 'last' ? null : ytd,
    ytdPrev: agg === 'last' ? null : ytdPrev,
    acumActual: acumAct, acumPrev: acumPrev,
    acumVar: esPct ? deltaPP(acumAct, acumPrev) : delta(acumAct, acumPrev),
    acumUnidad: esPct ? 'pp' : '%',
    acumEtiqueta: agg === 'avg' ? 'Promedio del año' : 'Acumulado del año',
    esPct,
  };
}

// ── Formato ────────────────────────────────────────────────
function fmtValor(v, fmt) {
  if (v == null) return '—';
  if (fmt === 'pct')    return (v * 100).toFixed(1) + '%';
  if (fmt === 'money') {
    const a = Math.abs(v), s = v < 0 ? '-' : '';
    return a >= 1e6 ? `${s}S/${(a/1e6).toFixed(2)}M`
         : a >= 1e3 ? `${s}S/${(a/1e3).toFixed(0)}K`
         : `${s}S/${a.toFixed(0)}`;
  }
  if (fmt === 'money2') return 'S/' + v.toFixed(2);
  if (fmt === 'num')    return Math.round(v).toLocaleString('es-PE');
  return String(v);
}

function fmtPeriodo(p) {
  if (!p) return '';
  const M = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return M[parseInt(p.slice(5,7))] + ' ' + p.slice(2,4);
}

// ¿La variación es favorable dada la dirección deseada del KPI?
function esFavorable(varr, dir) {
  if (varr == null || dir === 'flat') return null;
  return dir === 'up' ? varr >= 0 : varr <= 0;
}

function chipVar(varr, unidad, dir, etiqueta) {
  if (varr == null) return '';
  // Variación imperceptible: decirlo con palabras es más honesto que "−0.0%"
  if (Math.abs(varr) < 0.05) {
    return `<span class="vchip flat">= sin cambio <em>${etiqueta}</em></span>`;
  }
  const fav = esFavorable(varr, dir);
  const cls = fav === null ? 'flat' : fav ? 'good' : 'bad';
  const sig = varr >= 0 ? '+' : '';
  return `<span class="vchip ${cls}">${varr > 0 ? '↑' : '↓'} ${sig}${varr.toFixed(1)}${unidad} <em>${etiqueta}</em></span>`;
}

// ── Sparkline SVG ──────────────────────────────────────────
function sparkline(vals, dir, w, h) {
  w = w || 220; h = h || 44;
  const pts = vals.map((v,i) => ({v, i})).filter(p => p.v != null);
  if (pts.length < 2) return '';
  const ys = pts.map(p => p.v);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (max === min) { max = min + Math.abs(min || 1) * 0.1; min = min - Math.abs(min || 1) * 0.1; }
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;
  const n = vals.length - 1 || 1;
  const X = i => (i / n) * (w - 4) + 2;
  const Y = v => h - 4 - ((v - min) / (max - min)) * (h - 8);

  const d = pts.map((p, k) => (k === 0 ? 'M' : 'L') + X(p.i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = d + ` L${X(pts[pts.length-1].i).toFixed(1)} ${h} L${X(pts[0].i).toFixed(1)} ${h} Z`;

  const ini = pts[0].v, fin = pts[pts.length-1].v;
  const fav = esFavorable(fin - ini, dir);
  const color = fav === null ? '#64748b' : fav ? '#16a34a' : '#c62828';
  const uid = 'sg' + Math.random().toString(36).slice(2,8);

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${uid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts[pts.length-1].i).toFixed(1)}" cy="${Y(fin).toFixed(1)}" r="2.8" fill="${color}"/>
  </svg>`;
}

// ── Origen de la variación ─────────────────────────────────
/**
 * Explica POR QUÉ se movió un KPI, bajando hasta el último componente que el
 * modelo permite abrir. Devuelve bloques: cada uno es un nivel del análisis.
 * Si un nivel no se puede abrir, dice qué medida falta para poder abrirlo.
 */
function origenVariacion(label, an) {
  if (!an || an.estatica) return null;
  const f = (l) => { const r = analizar(l); return (r && !r.estatica) ? r : null; };
  const B = [];                                   // bloques del análisis
  const add = (t, html) => B.push({ t, html });
  const pct = (x, u) => `${x>=0?'+':''}${x.toFixed(1)}${u||'%'}`;

  const ps = an.ps, i = an.idx;
  const serieDeM = (ds, m) => (SERIES.datasets[ds] || {})[m];
  const pk = serieDeM('margen','Precio x Kilo'), ck = serieDeM('margen','Costo x Kilo');
  const vt = serieDeM('margen','Ventas (S/.)');

  // Índice del mismo mes del año anterior
  const jY = an.yoy ? ps.indexOf(an.yoy.periodo) : -1;
  const jM = an.mom ? ps.indexOf(an.mom.periodo) : -1;

  // ── MARGEN VARIABLE ─────────────────────────────────────
  if (label === 'Margen variable' && pk && ck) {
    if (jY >= 0) {
      const d = descomponerMargen(pk[jY], ck[jY], pk[i], ck[i]);
      if (d) {
        add(`Contra ${fmtPeriodo(ps[jY])}`,
          `${frasePorQue(d, pk[jY], ck[jY], pk[i], ck[i])}`);
      }
    }
    if (jM >= 0) {
      const d = descomponerMargen(pk[jM], ck[jM], pk[i], ck[i]);
      if (d) {
        add(`Contra el mes anterior (${fmtPeriodo(ps[jM])})`,
          `El margen se movió ${pct(d.total,'pp')}: ` +
          `<strong>${pct(d.efCosto,'pp')} por costo</strong> y ${pct(d.efPrecio,'pp')} por precio. ` +
          `Costo/kg S/${ck[jM].toFixed(2)} → S/${ck[i].toFixed(2)} · Precio/kg S/${pk[jM].toFixed(2)} → S/${pk[i].toFixed(2)}.`);
      }
    }
    // Nivel siguiente: ¿qué compone el costo?
    add('Siguiente nivel — qué compone el costo/kg',
      `El modelo entrega el costo unitario ya consolidado. Para saber si el alza viene de ` +
      `<strong>materia prima, insumos, envases o mano de obra</strong>, el reporte de Margen debe ` +
      `publicar el costo desagregado por componente. Hoy esa apertura no existe como medida.`);
    add('Siguiente nivel — qué producto o cliente',
      `Tampoco hay dimensión de producto ni de cliente filtrable por API, así que no se puede ` +
      `identificar qué SKU o qué cuenta arrastra el margen. Se requiere exponer ` +
      `<strong>TIPO DE NEGOCIO N1 (UEN)</strong> y la dimensión de cliente.`);
    return B;
  }

  // ── VENTAS ──────────────────────────────────────────────
  if (label === 'Ventas mes' && pk && vt) {
    const kg = (j) => (vt[j]!=null && pk[j]) ? vt[j]/pk[j] : null;
    [[jY, 'Contra ' + (jY>=0?fmtPeriodo(ps[jY]):'')], [jM, 'Contra el mes anterior' + (jM>=0?` (${fmtPeriodo(ps[jM])})`:'')]]
      .forEach(([j, tit]) => {
        if (j < 0) return;
        const kA = kg(j), kB = kg(i);
        if (kA == null || kB == null) return;
        // Venta = kg × precio.  Efecto volumen a precio viejo; efecto precio con kg nuevo.
        const efVol = (kB - kA) * pk[j];
        const efPre = kB * (pk[i] - pk[j]);
        const tot = vt[i] - vt[j];
        const domina = Math.abs(efVol) >= Math.abs(efPre) ? 'volumen' : 'precio';
        add(tit,
          `La venta se movió <strong>${fmtValor(tot,'money')}</strong> (${pct((vt[i]-vt[j])/vt[j]*100)}). ` +
          `De eso, <strong>${fmtValor(efVol,'money')} es volumen</strong> ` +
          `(${(kA/1e6).toFixed(2)}M → ${(kB/1e6).toFixed(2)}M kg, ${pct((kB-kA)/kA*100)}) y ` +
          `<strong>${fmtValor(efPre,'money')} es precio</strong> ` +
          `(S/${pk[j].toFixed(2)} → S/${pk[i].toFixed(2)}, ${pct((pk[i]-pk[j])/pk[j]*100)}). ` +
          `Manda el <strong>${domina}</strong>.`);
      });
    add('Siguiente nivel — qué canal, cliente o producto',
      `El modelo entrega la venta total consolidada. Para saber qué canal, cliente o SKU explica ` +
      `el movimiento hace falta exponer esas dimensiones como tablas filtrables en el modelo de Margen.`);
    return B;
  }

  // ── PRECIO / COSTO POR KILO ─────────────────────────────
  if ((label === 'Precio/kg' || label === 'Costo/kg') && pk && ck) {
    if (jY >= 0) {
      const d = descomponerMargen(pk[jY], ck[jY], pk[i], ck[i]);
      if (d) add(`Efecto sobre el margen`,
        `Contra ${fmtPeriodo(ps[jY])}, este indicador aporta ` +
        `<strong>${pct(label==='Precio/kg' ? d.efPrecio : d.efCosto,'pp')}</strong> ` +
        `de los ${pct(d.total,'pp')} que se movió el margen variable ` +
        `(${(label==='Precio/kg' ? d.pesoPrecio : d.pesoCosto).toFixed(0)}% del total).`);
    }
    add('Siguiente nivel — apertura del unitario',
      label === 'Costo/kg'
        ? `El costo llega consolidado. Falta publicarlo abierto en <strong>materia prima, insumos, envase y mano de obra</strong> para saber qué componente lo empuja.`
        : `El precio llega como promedio ponderado. Falta abrirlo por <strong>lista, canal y descuentos</strong> para distinguir si baja por mix o por política comercial.`);
    return B;
  }

  // ── FILL RATE ───────────────────────────────────────────
  if (label === 'Fill Rate') {
    if (jY >= 0 || jM >= 0) {
      const partes = [];
      if (jY >= 0) partes.push(`contra ${fmtPeriodo(ps[jY])}: ${(an.vals[jY]*100).toFixed(1)}% → ${(an.actual*100).toFixed(1)}% (${pct(an.yoy.var,'pp')})`);
      if (jM >= 0) partes.push(`contra ${fmtPeriodo(ps[jM])}: ${(an.vals[jM]*100).toFixed(1)}% → ${(an.actual*100).toFixed(1)}% (${pct(an.mom.var,'pp')})`);
      add('Movimiento medido', partes.join(' · ') + '.');
    }
    add('Por qué no se puede abrir',
      `El fill rate es <strong>Facturación ÷ Orden de Venta</strong>. Para saber si la brecha creció ` +
      `porque entró más pedido o porque se despachó menos, hacen falta esos dos montos por mes — y ` +
      `ambas medidas (<code>ORDEN DE VENTA</code>, <code>FACTURACION</code>) devuelven hoy el acumulado ` +
      `histórico igual en todos los meses.`);
    add('Siguiente nivel — dónde está el quiebre',
      `Tampoco hay apertura por <strong>SKU, cliente ni planta</strong>, que es lo que permitiría ` +
      `decidir si falta capacidad, planificación o stock de seguridad.`);
    return B;
  }

  // ── MERMA ───────────────────────────────────────────────
  if (label === 'Merma Total') {
    const mesesAnio = ps.filter((p,k) => p.slice(0,4)===an.periodo.slice(0,4) && an.vals[k]!=null);
    if (mesesAnio.length) {
      const vals = mesesAnio.map(p => an.vals[ps.indexOf(p)]);
      const peorIdx = vals.indexOf(Math.max(...vals));
      add('Dispersión del año',
        `Rango ${(Math.min(...vals)*100).toFixed(2)}% – ${(Math.max(...vals)*100).toFixed(2)}%. ` +
        `El peor mes fue <strong>${fmtPeriodo(mesesAnio[peorIdx])}</strong> con ${(vals[peorIdx]*100).toFixed(2)}%. ` +
        `La variación entre meses es de ${((Math.max(...vals)-Math.min(...vals))*100).toFixed(2)} puntos, ` +
        `lo que sugiere una causa operativa puntual y no un nivel estructural parejo.`);
    }
    add('Por qué no se puede abrir',
      `El reporte muestra en pantalla la merma por <strong>planta (Ate / Pachacámac / Terceros)</strong> ` +
      `y por <strong>UEN (B&amp;D / TIGO / MAQUILA)</strong>, pero ninguno de esos cortes está publicado ` +
      `como medida ni existe dimensión filtrable. Sin eso no se puede decir dónde intervenir.`);
    add('Siguiente nivel — el detalle que ya existe en pantalla',
      `Las columnas <code>REAL</code>, <code>STD</code>, <code>DESVIACION</code> e ` +
      `<code>ITEM DESVIADO</code> permitirían identificar el ítem específico que se desvía del estándar. ` +
      `Tampoco están publicadas.`);
    return B;
  }

  // ── MOROSIDAD ───────────────────────────────────────────
  if (label === 'Morosidad') {
    const pv = f('CxC por vencer');
    if (pv && pv.yoy) add('Cartera relacionada',
      `La cartera por vencer varió ${pct(pv.yoy.var)} contra ${fmtPeriodo(pv.yoy.periodo)}.`);
    add('Siguiente nivel — quién debe',
      `Los <strong>tramos de vencimiento</strong> sí están en el modelo y ya se muestran en la sección III ` +
      `(<code>'DATA_FACTURACION'[O_SEGMENTO]</code>). Lo que falta es la <strong>dimensión de cliente</strong>: ` +
      `sin ella no se sabe si la mora se concentra en pocos clientes grandes —negociable— o está dispersa ` +
      `en la cartera —problema de proceso de cobranza—.`);
    return B;
  }

  // ── CxP / REFINANCIADO ──────────────────────────────────
  if (label === 'Refinanciado' || label === 'CxP Total') {
    add('Siguiente nivel — composición de la deuda',
      `Falta la apertura por <strong>tramo de vencimiento y proveedor</strong>, y los ` +
      `<strong>días de pago (DPP)</strong>. Sin eso no se puede juzgar si el refinanciamiento es ` +
      `manejable o si está desplazando presión de caja hacia adelante.`);
  }

  // ── GENÉRICO: persistencia + qué falta ──────────────────
  if (an.yoy && an.mom) {
    const t = an.yoy.var, m = an.mom.var;
    const persistente = (t > 0) === (m > 0);
    add('Naturaleza de la variación',
      persistente
        ? `Es <strong>persistente</strong>: se repite contra el mes anterior (${pct(m, an.mom.unidad)}) y contra ${fmtPeriodo(an.yoy.periodo)} (${pct(t, an.yoy.unidad)}). Responde a una causa de fondo, no a un evento del mes.`
        : `Es <strong>puntual del mes</strong>: mes anterior ${pct(m, an.mom.unidad)}, pero contra ${fmtPeriodo(an.yoy.periodo)} ${pct(t, an.yoy.unidad)}. Revisar qué ocurrió específicamente en ${fmtPeriodo(an.periodo)}.`);
  }
  if (!B.length) return null;
  add('Apertura disponible',
    `Este indicador llega al tablero como un valor consolidado. Para explicar su variación se ` +
    `requiere que el modelo publique sus componentes como medidas o dimensiones filtrables.`);
  return B;
}

// ── Render de una fila de KPI ──────────────────────────────
function filaKPI(k) {
  const label = k.label;
  const est = k.estado || '';
  const a0 = analizar(label);
  const an = (a0 && !a0.estatica) ? a0 : null;
  const src = KPI_SOURCE[label];
  const dir = src ? src.dir : 'flat';

  const chips = an
    ? [ chipVar(an.mom ? an.mom.var : null, an.mom ? an.mom.unidad : '', dir, 'MoM'),
        chipVar(an.yoy ? an.yoy.var : null, an.yoy ? an.yoy.unidad : '', dir, 'YoY'),
        chipVar(an.acumVar, an.acumUnidad, dir, 'Acum') ].join('')
    : (a0 && a0.estatica ? `<span class="vchip sinserie" title="Esta medida devuelve el mismo total en todos los meses: no se deja filtrar por fecha en el modelo de Power BI, por lo que no admite comparativo mensual ni YoY.">sin serie mensual</span>` : '');

  const spark = an ? sparkline(an.vals, dir, 96, 26) : '';
  const clickable = an ? `onclick="event.stopPropagation();abrirKPI('${label.replace(/'/g,"\\'")}')"` : '';

  return `<div class="krow ${an?'has-detail':''}" ${clickable}>
    <span class="kdot ${est}"></span>
    <span class="klabel">${label}</span>
    <span class="kspark">${spark}</span>
    <span class="kval ${est}">${k.valor}</span>
    ${k.meta ? `<span class="kchip meta">meta ${k.meta}</span>` : ''}
    <span class="kchips">${chips}</span>
    ${an ? '<span class="kmore">›</span>' : ''}
  </div>`;
}

// ── Panel de detalle de un KPI ─────────────────────────────
function abrirKPI(label) {
  const an = analizar(label);
  if (!an || an.estatica) return;
  const src = an.src, dir = src.dir, fmt = src.fmt;

  const tile = (titulo, valorRef, periodoRef, varr, unidad) => {
    const fav = esFavorable(varr, dir);
    const cls = fav === null ? 'flat' : fav ? 'good' : 'bad';
    return `<div class="dtile">
      <div class="dtile-t">${titulo}</div>
      <div class="dtile-v">${fmtValor(valorRef, fmt)}</div>
      <div class="dtile-p">${periodoRef}</div>
      <div class="dtile-d ${cls}">${varr==null?'—':(varr>=0?'+':'')+varr.toFixed(1)+unidad}</div>
    </div>`;
  };

  const origen = origenVariacion(label, an);
  const dec = KPI_DECISION[label];
  const fav = esFavorable(an.yoy ? an.yoy.var : null, dir);

  // Tabla de los últimos 12 meses con dato
  const filas = [];
  for (let i = an.vals.length - 1; i >= 0 && filas.length < 12; i--) {
    if (an.vals[i] == null) continue;
    const prev = i > 0 ? an.vals[i-1] : null;
    let d = null;
    if (prev != null && prev !== 0) d = an.esPct ? (an.vals[i]-prev)*100 : (an.vals[i]-prev)/Math.abs(prev)*100;
    const favd = esFavorable(d, dir);
    filas.push(`<tr>
      <td>${fmtPeriodo(an.ps[i])}</td>
      <td class="num">${fmtValor(an.vals[i], fmt)}</td>
      <td class="num ${d==null?'':favd?'good':'bad'}">${d==null?'—':(d>=0?'+':'')+d.toFixed(1)+(an.esPct?'pp':'%')}</td>
    </tr>`);
  }

  document.getElementById('kpi-modal-body').innerHTML = `
    <div class="dhead">
      <div>
        <div class="dhead-label">${label}</div>
        <div class="dhead-val">${fmtValor(an.actual, fmt)}</div>
        <div class="dhead-per">${fmtPeriodo(an.periodo)} · dato de Power BI</div>
      </div>
      <button class="dclose" onclick="cerrarKPI()">✕</button>
    </div>

    <div class="dchart">${sparkline(an.vals, dir, 560, 130)}
      <div class="dchart-x"><span>${fmtPeriodo(an.ps[0])}</span><span>${fmtPeriodo(an.periodo)}</span></div>
    </div>

    <div class="dsec-t">Comparativos</div>
    <div class="dtiles">
      ${tile('Mes anterior', an.mom?an.mom.valor:null, an.mom?fmtPeriodo(an.mom.periodo):'sin dato', an.mom?an.mom.var:null, an.mom?an.mom.unidad:'')}
      ${tile('Mismo mes año anterior', an.yoy?an.yoy.valor:null, an.yoy?fmtPeriodo(an.yoy.periodo):'sin dato', an.yoy?an.yoy.var:null, an.yoy?an.yoy.unidad:'')}
      ${an.agg === 'last'
        ? `<div class="dtile"><div class="dtile-t">Acumulado</div><div class="dtile-v" style="font-size:11px;font-weight:600;color:var(--text3);line-height:1.4">No aplica — es un saldo a la fecha, no un flujo del mes</div></div>`
        : tile(`${an.acumEtiqueta} anterior`, an.acumPrev, an.ytdPrev?`${an.ytdPrev.meses} meses de ${parseInt(an.periodo.slice(0,4))-1}`:'sin dato', an.acumVar, an.acumUnidad)}
    </div>

    ${an.ytd ? `<div class="dacum">
      <span class="dacum-l">${an.acumEtiqueta} ${an.periodo.slice(0,4)} (${an.ytd.meses} ${an.ytd.meses===1?'mes':'meses'})</span>
      <span class="dacum-v">${fmtValor(an.acumActual, fmt)}</span>
      ${an.acumPrev!=null?`<span class="dacum-c">vs ${fmtValor(an.acumPrev,fmt)} en igual tramo de ${parseInt(an.periodo.slice(0,4))-1}</span>`:''}
    </div>` : ''}

    ${origen && origen.length ? `<div class="dsec-t">Por qué se movió — análisis por niveles</div>
      <div class="dniveles">
        ${origen.map((b,k) => `
          <div class="dnivel">
            <div class="dnivel-n">${k+1}</div>
            <div class="dnivel-c">
              <div class="dnivel-t">${b.t}</div>
              <div class="dnivel-b">${b.html}</div>
            </div>
          </div>`).join('')}
      </div>` : ''}

    ${dec ? `<div class="dsec-t">Decisión</div>
      <div class="ddec ${fav===false?'urgente':''}">
        <div class="ddec-q">${dec.pregunta}</div>
        <div class="ddec-a">Responsable: ${dec.area}</div>
      </div>` : ''}

    <div class="dsec-t">Serie mensual</div>
    <div class="dtable-wrap">
      <table class="dtable">
        <thead><tr><th>Mes</th><th class="num">Valor</th><th class="num">Var. mes</th></tr></thead>
        <tbody>${filas.join('')}</tbody>
      </table>
    </div>
  `;
  document.getElementById('kpi-modal').classList.add('open');
}

function cerrarKPI() {
  document.getElementById('kpi-modal').classList.remove('open');
}

// ============================================================

/** Meses en que dos años tienen dato comparable, para no comparar tramos distintos. */
function mesesComparables(vals, ps, anioA, anioB) {
  const mesesA = new Set(), mesesB = new Set();
  ps.forEach((p, i) => {
    if (vals[i] == null) return;
    if (p.startsWith(anioA)) mesesA.add(p.slice(5,7));
    if (p.startsWith(anioB)) mesesB.add(p.slice(5,7));
  });
  return [...mesesA].filter(m => mesesB.has(m)).sort();
}

/**
 * Descompone el cambio de margen entre dos momentos en cuánto lo explica el precio
 * y cuánto el costo.  margen = 1 − costo/precio.
 *   efecto precio = mover el precio dejando el costo del período inicial
 *   efecto costo  = mover el costo ya con el precio nuevo
 * Los dos efectos suman exactamente el cambio total de margen.
 */
function descomponerMargen(pIni, cIni, pFin, cFin) {
  if ([pIni,cIni,pFin,cFin].some(x => x == null || x === 0)) return null;
  const efPrecio = cIni * (1/pIni - 1/pFin) * 100;
  const efCosto  = -(cFin - cIni) / pFin * 100;
  const total    = efPrecio + efCosto;
  const denom    = Math.abs(efPrecio) + Math.abs(efCosto);
  return {
    efPrecio, efCosto, total,
    pesoPrecio: denom ? Math.abs(efPrecio)/denom*100 : 0,
    pesoCosto:  denom ? Math.abs(efCosto)/denom*100  : 0,
    culpable: Math.abs(efCosto) >= Math.abs(efPrecio) ? 'costo' : 'precio',
  };
}

/** Frase lista para leer: qué explica el movimiento del margen. */
function frasePorQue(d, pIni, cIni, pFin, cFin) {
  if (!d) return '';
  const dirP = pFin >= pIni ? 'subió' : 'bajó';
  const dirC = cFin >= cIni ? 'subió' : 'bajó';
  return `<strong>Por qué:</strong> el precio/kg ${dirP} de S/${pIni.toFixed(2)} a S/${pFin.toFixed(2)} ` +
    `y el costo/kg ${dirC} de S/${cIni.toFixed(2)} a S/${cFin.toFixed(2)}. ` +
    `De los ${Math.abs(d.total).toFixed(1)}pp de variación, ` +
    `<strong>${Math.abs(d.efCosto).toFixed(1)}pp (${d.pesoCosto.toFixed(0)}%) vienen del costo</strong> ` +
    `y ${Math.abs(d.efPrecio).toFixed(1)}pp (${d.pesoPrecio.toFixed(0)}%) del precio. ` +
    (d.culpable === 'costo'
      ? 'El problema está en materia prima e insumos, no en la política comercial.'
      : 'El problema está en el precio de venta, no en el costo.');
}

function promEn(vals, ps, anio, meses) {
  const v = meses.map(m => vals[ps.indexOf(`${anio}-${m}`)]).filter(x => x != null);
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null;
}
function sumaEn(vals, ps, anio, meses) {
  const v = meses.map(m => vals[ps.indexOf(`${anio}-${m}`)]).filter(x => x != null);
  return v.length ? v.reduce((a,b)=>a+b,0) : null;
}

/**
 * Construye los hallazgos del período: qué cambió, cuánto pesa en soles
 * y qué palanca lo mueve. Solo con datos de Power BI.
 */
function diagnosticoCompleto() {
  if (!SERIES || !SERIES.datasets) return null;
  const ps = SERIES.periodos;
  const DS = SERIES.datasets;
  const M = DS.margen;
  if (!M) return null;

  const anioAct = ps[ps.length-1].slice(0,4);
  const anioAnt = String(parseInt(anioAct) - 1);
  const hallazgos = [];

  // ── 1. Puente de margen: volumen vs precio vs costo ──
  const vt = M['Ventas (S/.)'], pk = M['Precio x Kilo'], ck = M['Costo x Kilo'];
  if (vt && pk && ck) {
    const mg = pk.map((p,i) => (p==null||ck[i]==null||p===0) ? null : (p-ck[i])/p);
    const comp = mesesComparables(mg, ps, anioAnt, anioAct);
    if (comp.length) {
      const vA = sumaEn(vt,ps,anioAnt,comp), vB = sumaEn(vt,ps,anioAct,comp);
      const mA = promEn(mg,ps,anioAnt,comp), mB = promEn(mg,ps,anioAct,comp);
      const pA = promEn(pk,ps,anioAnt,comp), pB = promEn(pk,ps,anioAct,comp);
      const cA = promEn(ck,ps,anioAnt,comp), cB = promEn(ck,ps,anioAct,comp);
      const kgA = comp.map(m=>{const i=ps.indexOf(`${anioAnt}-${m}`);return vt[i]/pk[i];}).reduce((a,b)=>a+b,0);
      const kgB = comp.map(m=>{const i=ps.indexOf(`${anioAct}-${m}`);return vt[i]/pk[i];}).reduce((a,b)=>a+b,0);

      const efVol = (vB - vA) * mA;
      const efMg  = vB * (mB - mA);
      const porMes = efMg / comp.length;

      const perLbl = comp.map(m=>fmtPeriodo(anioAct+'-'+m)).join(' + ');
      const perLblAnt = comp.map(m=>fmtPeriodo(anioAnt+'-'+m)).join(' + ');
      const dMg = descomponerMargen(pA, cA, pB, cB);
      hallazgos.push({
        sev: efMg < 0 ? 'red' : 'green',
        titulo: dMg && dMg.culpable === 'costo'
          ? 'El margen cae por el costo de materia prima, no por el precio'
          : 'El margen cae por el precio de venta',
        periodo: `${perLbl} vs ${perLblAnt} · ${comp.length} ${comp.length===1?'mes':'meses'}`,
        cifra: `${(mB*100).toFixed(1)}%`,
        unidad: 'margen variable',
        sub: `${perLbl} · antes ${(mA*100).toFixed(1)}% (${(mB-mA)*100>=0?'+':''}${((mB-mA)*100).toFixed(1)}pp)`,
        cuerpo: `Solo se comparan los meses que ambos años tienen medidos: <strong>${perLbl}</strong> contra <strong>${perLblAnt}</strong>. En ese tramo el volumen subió <strong>${((kgB-kgA)/kgA*100).toFixed(1)}%</strong> (${(kgA/1e6).toFixed(2)}M → ${(kgB/1e6).toFixed(2)}M kg) y la venta <strong>${((vB-vA)/vA*100).toFixed(1)}%</strong> (${fmtValor(vA,'money')} → ${fmtValor(vB,'money')}).`,
        impacto: dMg
          ? frasePorQue(dMg, pA, cA, pB, cB) + ` En soles, el margen pasó de ${fmtValor(vA*mA,'money')} a ${fmtValor(vB*mB,'money')}.`
          : `Margen en soles: ${fmtValor(vA*mA,'money')} → ${fmtValor(vB*mB,'money')}.`,
        palanca: dMg && dMg.culpable === 'costo'
          ? `Sobre la venta de esos ${comp.length} meses, cada punto de margen equivale a ${fmtValor(vB*0.01,'money')}. Recuperar el costo/kg al nivel de ${anioAnt} (S/${cA.toFixed(2)}) devolvería ${Math.abs(dMg.efCosto).toFixed(1)}pp de margen.`
          : `Cada punto de margen equivale a ${fmtValor(vB*0.01,'money')} sobre la venta de esos ${comp.length} meses.`,
        area: dMg && dMg.culpable === 'costo' ? 'Compras + Producción' : 'Comercial',
      });
    }

    // ── 2. Deterioro sostenido del margen mes a mes ──
    const conMg = mg.map((v,i)=>({v,i})).filter(x=>x.v!=null);
    if (conMg.length >= 6) {
      const ult = conMg.slice(-6);
      const iA = ult[0].i, iB = ult[ult.length-1].i;
      const pend = (ult[ult.length-1].v - ult[0].v) * 100;
      if (Math.abs(pend) >= 1) {
        const d = descomponerMargen(pk[iA], ck[iA], pk[iB], ck[iB]);
        hallazgos.push({
          sev: pend < 0 ? 'red' : 'green',
          titulo: pend < 0
            ? (d && d.culpable === 'costo'
                ? 'La caída de margen viene del costo, no del precio'
                : 'La caída de margen viene del precio de venta')
            : 'El margen viene recuperándose',
          periodo: `${fmtPeriodo(ps[iA])} → ${fmtPeriodo(ps[iB])} · ${ult.length} meses`,
          cifra: `${pend>=0?'+':''}${pend.toFixed(1)}pp`,
          unidad: 'margen variable',
          sub: `entre ${fmtPeriodo(ps[iA])} y ${fmtPeriodo(ps[iB])}`,
          cuerpo: `Margen variable mes a mes: ${ult.map(x=>`<strong>${fmtPeriodo(ps[x.i])}</strong> ${(x.v*100).toFixed(1)}%`).join(' → ')}.`,
          impacto: d
            ? frasePorQue(d, pk[iA], ck[iA], pk[iB], ck[iB])
            : `De ${(ult[0].v*100).toFixed(1)}% a ${(ult[ult.length-1].v*100).toFixed(1)}%.`,
          palanca: pend < 0
            ? (d && d.culpable === 'costo'
                ? `El costo/kg pasó de S/${ck[iA].toFixed(2)} a S/${ck[iB].toFixed(2)} (${((ck[iB]-ck[iA])/ck[iA]*100).toFixed(1)}%). Revisar contratos de materia prima e insumos antes de tocar precios.`
                : `El precio/kg pasó de S/${pk[iA].toFixed(2)} a S/${pk[iB].toFixed(2)}. Revisar política de descuentos y mix de clientes.`)
            : 'Mantener lo que se está haciendo y documentarlo.',
          area: pend < 0 && d && d.culpable === 'costo' ? 'Compras + Producción' : 'Comercial',
        });
      }
    }
  }

  // ── 3. Ventas: acumulado del año ──
  if (vt) {
    const comp = mesesComparables(vt, ps, anioAnt, anioAct);
    if (comp.length) {
      const a = sumaEn(vt,ps,anioAnt,comp), b = sumaEn(vt,ps,anioAct,comp);
      const promA = a / comp.length, promB = b / comp.length;
      const mesesB = comp.map(m => vt[ps.indexOf(`${anioAct}-${m}`)]);
      const rangoB = `S/${(Math.min(...mesesB)/1e6).toFixed(2)}M – S/${(Math.max(...mesesB)/1e6).toFixed(2)}M`;
      const desde = fmtPeriodo(`${anioAct}-${comp[0]}`), hasta = fmtPeriodo(`${anioAct}-${comp[comp.length-1]}`);
      hallazgos.push({
        sev: b >= a ? 'green' : 'red',
        titulo: b >= a ? 'Las ventas crecen sobre el año anterior' : 'Las ventas caen frente al año anterior',
        periodo: `${desde} – ${hasta} · acumulado de ${comp.length} meses`,
        cifra: `${((b-a)/a*100>=0?'+':'')}${((b-a)/a*100).toFixed(1)}%`,
        unidad: 'venta acumulada',
        sub: `${desde}–${hasta}: ${fmtValor(b,'money')} vs ${fmtValor(a,'money')} en ${anioAnt}`,
        cuerpo: `<strong>Acumulado de ${comp.length} meses</strong> (${desde} a ${hasta}): ${fmtValor(b,'money')} en ${anioAct} contra ${fmtValor(a,'money')} en ${anioAnt} — ${fmtValor(b-a,'money')} de diferencia. <strong>Promedio mensual: ${fmtValor(promB,'money')}</strong> en ${anioAct} contra ${fmtValor(promA,'money')} en ${anioAnt}.`,
        impacto: `Rango mensual ${anioAct}: ${rangoB}. ${b >= a ? 'La demanda no es el problema del negocio hoy.' : 'La caída de ingresos exige revisar canal y cartera de clientes.'}`,
        palanca: b >= a ? 'Sostener volumen mientras se recupera margen.' : 'Identificar qué canal o cliente se perdió.',
        area: 'Comercial',
      });
    }
  }

  // ── 4. Fill Rate: servicio al cliente ──
  const fr = DS.fill_rate && DS.fill_rate['% Fill Rate'];
  if (fr) {
    const comp = mesesComparables(fr, ps, anioAnt, anioAct);
    if (comp.length) {
      const a = promEn(fr,ps,anioAnt,comp), b = promEn(fr,ps,anioAct,comp);
      const META = 0.98;
      const mesesAnio = ps.filter((p,i) => p.startsWith(anioAct) && fr[i] != null).map(p => p.slice(5,7));
      const promAnio = promEn(fr, ps, anioAct, mesesAnio);
      const peor = Math.min(...mesesAnio.map(m => fr[ps.indexOf(anioAct+'-'+m)]));
      const mejor = Math.max(...mesesAnio.map(m => fr[ps.indexOf(anioAct+'-'+m)]));
      hallazgos.push({
        sev: promAnio < META ? 'red' : 'green',
        titulo: 'El nivel de servicio está lejos de la meta',
        periodo: `Promedio ${fmtPeriodo(anioAct+'-'+mesesAnio[0])} – ${fmtPeriodo(anioAct+'-'+mesesAnio[mesesAnio.length-1])} · ${mesesAnio.length} meses`,
        cifra: `${(promAnio*100).toFixed(1)}%`,
        unidad: 'fill rate',
        sub: `promedio ${fmtPeriodo(anioAct+'-'+mesesAnio[0])}–${fmtPeriodo(anioAct+'-'+mesesAnio[mesesAnio.length-1])} · meta 98%`,
        cuerpo: `Fill rate mes a mes: ${mesesAnio.map(m=>`<strong>${fmtPeriodo(anioAct+'-'+m)}</strong> ${(fr[ps.indexOf(anioAct+'-'+m)]*100).toFixed(1)}%`).join(' · ')}. En los meses que ${anioAnt} también tiene medidos (${comp.map(m=>fmtPeriodo(anioAct+'-'+m)).join(', ')}) pasó de <strong>${(a*100).toFixed(1)}%</strong> a <strong>${(b*100).toFixed(1)}%</strong> (${((b-a)*100>=0?'+':'')}${((b-a)*100).toFixed(1)}pp).`,
        impacto: `Rango del año: entre ${(peor*100).toFixed(1)}% y ${(mejor*100).toFixed(1)}%. Ningún mes alcanzó la meta de 98%; la brecha promedio es de ${((META-promAnio)*100).toFixed(1)} puntos.`,
        palanca: 'El monto de venta perdida por mes no es legible desde el modelo (la medida devuelve el acumulado histórico). Corregirla permitiría cuantificar la brecha en soles.',
        area: 'Planeamiento + Producción',
      });
    }
  }

  // ── 5. Mermas contra meta ──
  const mm = DS.mermas && DS.mermas['% Merma Total'];
  if (mm) {
    const comp = mesesComparables(mm, ps, anioAnt, anioAct);
    // Promedio del año en curso, con todos sus meses (no solo los comparables)
    const mesesAnio = ps.filter((p,i) => p.startsWith(anioAct) && mm[i] != null).map(p => p.slice(5,7));
    const promAnio = promEn(mm, ps, anioAct, mesesAnio);
    const META = 0.02;
    if (promAnio != null) {
      const cmp = comp.length ? { a: promEn(mm,ps,anioAnt,comp), b: promEn(mm,ps,anioAct,comp) } : null;
      hallazgos.push({
        sev: promAnio > META ? 'red' : 'green',
        titulo: 'La merma más que duplica la meta',
        periodo: `Promedio ${fmtPeriodo(anioAct+'-'+mesesAnio[0])} – ${fmtPeriodo(anioAct+'-'+mesesAnio[mesesAnio.length-1])} · ${mesesAnio.length} meses`,
        cifra: `${(promAnio*100).toFixed(2)}%`,
        unidad: '% merma',
        sub: `promedio ${fmtPeriodo(anioAct+'-'+mesesAnio[0])}–${fmtPeriodo(anioAct+'-'+mesesAnio[mesesAnio.length-1])} · meta 2.00%`,
        cuerpo: cmp && cmp.a != null
          ? `Mes a mes del año: ${mesesAnio.map(m=>`${fmtPeriodo(anioAct+'-'+m)} ${(mm[ps.indexOf(anioAct+'-'+m)]*100).toFixed(2)}%`).join(' · ')}. En los meses comparables con ${anioAnt} (${comp.map(m=>fmtPeriodo(anioAct+'-'+m)).join(', ')}) pasó de ${(cmp.a*100).toFixed(2)}% a ${(cmp.b*100).toFixed(2)}%.`
          : `Promedio del año en ${(promAnio*100).toFixed(2)}%, sobre el 2% objetivo en todos los meses medidos.`,
        impacto: `Ningún mes de ${anioAct} bajó de ${(Math.min(...mesesAnio.map(m=>mm[ps.indexOf(anioAct+'-'+m)]))*100).toFixed(2)}%. La brecha contra la meta es de ${((promAnio-META)*100).toFixed(2)} puntos.`,
        palanca: 'Falta el desglose por planta (Ate / Pachacámac / Terceros) y por UEN para saber dónde atacar — esas medidas no están publicadas en el modelo.',
        area: 'Producción',
      });
    }
  }

  return { anioAct, anioAnt, hallazgos };
}

// Calcula de una sola vez todas las cifras derivadas que usa el dashboard.
function dxpStats() {
  const rp = (DATA.empresas && DATA.empresas.PAUNO && DATA.empresas.PAUNO.reportes) || {};
  const kv = (t, l) => rp[t]?.kpis?.find(k => k.label === l)?.valor;
  const s = { rp, kv };

  s.ventas       = kv('margen_variable','Ventas mes') || DATA.holding_ventas;
  s.margenOf     = kv('margen_variable','Margen variable');
  s.precioKg     = kv('margen_variable','Precio/kg');
  s.costoKg      = kv('margen_variable','Costo/kg');
  s.fillRate     = kv('fill_rate','Fill Rate');
  s.ordenVenta   = kv('fill_rate','Orden de Venta');
  s.facturacion  = kv('fill_rate','Facturación');
  s.ventaPerdida = kv('fill_rate','Venta Perdida');
  s.mermaTotal   = kv('mermas','Merma Total');
  s.mora         = kv('cuentas_por_cobrar','Morosidad') || DATA.holding_mora;
  s.cxcVencer    = kv('cuentas_por_cobrar','CxC por vencer');
  s.cxpTotal     = kv('cuentas_por_pagar','CxP Total');
  s.refinanciado = kv('cuentas_por_pagar','Refinanciado');
  s.proveedores  = kv('cuentas_por_pagar','# Proveedores');
  s.avancePpto   = kv('margen_variable_pag2','Avance vs Ppto');

  // Control interno
  const ci = l => rp.control_interno?.kpis?.find(k => k.label === l)?.valor;
  s.ciCumpl = ci('% Cumplimiento'); s.ciEval = ci('Puntos de Control evaluados');
  s.ciCritico = ci('Crítico'); s.ciCritPct = ci('% Puntos en estado Crítico');
  s.ciPlanes = ci('Total Planes de Acción'); s.ciAtrasados = ci('Planes de Acción Atrasados');
  const at = parseVal(s.ciAtrasados), tp = parseVal(s.ciPlanes);
  s.ciAtrasPct = (at != null && tp) ? (at / tp * 100) : null;

  // Margen por UEN (para palanca y desglose)
  const umg = (rp.margen_variable?.por_uen || []).slice().sort((a,b) => parseVal(a.margen) - parseVal(b.margen));
  // Si el margen por UEN es derivado nuestro y no la medida del reporte, se
  // advierte: en agosto el reporte marcaba B&D 62.30% y el cálculo, 65.3%.
  s.margenUenCalculado = umg.some(u => u.fuente === 'calculado');
  s.uenPeorMg = umg[0]; s.uenMejorMg = umg[umg.length-1];

  // Mermas por UEN / planta
  const uen = (rp.mermas?.por_uen || []).slice().sort((a,b) => parseVal(b.merma) - parseVal(a.merma));
  const pla = (rp.mermas?.por_planta || []).slice().sort((a,b) => parseVal(b.merma) - parseVal(a.merma));
  s.uenPeor = uen[0]; s.uenMejor = uen[uen.length-1];
  s.plaPeor = pla[0]; s.plaMejor = pla[pla.length-1];
  s.ratioUen = (s.uenPeor && s.uenMejor && parseVal(s.uenMejor.merma)) ? (parseVal(s.uenPeor.merma)/parseVal(s.uenMejor.merma)) : null;
  s.ratioPla = (s.plaPeor && s.plaMejor && parseVal(s.plaMejor.merma)) ? (parseVal(s.plaPeor.merma)/parseVal(s.plaMejor.merma)) : null;

  // Fill rate: % de venta perdida sobre el pedido
  const ov = parseVal(s.ordenVenta), vp = parseVal(s.ventaPerdida), fa = parseVal(s.facturacion);
  s.vpPct = (ov && vp) ? (vp/ov*100) : null;
  s.faPct = (ov && fa) ? (fa/ov*100) : null;

  // CxP refinanciado
  const cx = parseVal(s.cxpTotal), rf = parseVal(s.refinanciado);
  s.refPct = (cx && rf) ? (rf/cx*100) : null;

  // ── Series ──
  const ds = (SERIES && SERIES.datasets) || {};
  const ps = (SERIES && SERIES.periodos) || [];
  s.ps = ps; s.ds = ds;
  const M = ds.margen || {};
  const pk = M['Precio x Kilo'], ck = M['Costo x Kilo'], vt = M['Ventas (S/.)'];
  if (pk && ck) {
    const mg = pk.map((p,i) => (p==null||ck[i]==null||!p) ? null : (p-ck[i])/p*100);
    const val = mg.map((v,i)=>({v,i})).filter(x=>x.v!=null);
    if (val.length) {
      s.mgSerie = mg;
      s.mgAct = val[val.length-1].v;
      s.mgProm = val.reduce((a,b)=>a+b.v,0)/val.length;
      const mx = val.reduce((a,b)=>b.v>a.v?b:a), mn = val.reduce((a,b)=>b.v<a.v?b:a);
      s.mgMax = mx.v; s.mgMaxP = ps[mx.i]; s.mgMin = mn.v; s.mgMinP = ps[mn.i];
      s.mgN = val.length;
      s.mgSobreMeta = val.filter(x=>x.v>=52).length;
      s.mgEsMin = (mn.i === val[val.length-1].i);
    }
    const ckv = ck.map((v,i)=>({v,i})).filter(x=>x.v!=null);
    const pkv = pk.map((v,i)=>({v,i})).filter(x=>x.v!=null);
    if (ckv.length>=2) { s.ckDelta = (ckv[ckv.length-1].v/ckv[0].v-1)*100; s.ckIni=ckv[0].v; s.ckFin=ckv[ckv.length-1].v; s.ckIniP=ps[ckv[0].i]; s.ckFinP=ps[ckv[ckv.length-1].i]; s.ckN=ckv.length; }
    if (pkv.length>=2) { s.pkDelta = (pkv[pkv.length-1].v/pkv[0].v-1)*100; }
  }
  const fr = ds.fill_rate && ds.fill_rate['% Fill Rate'];
  if (fr) { const v = fr.filter(x=>x!=null); s.frN = v.length; s.frBajoMeta = v.filter(x=>x<0.98).length; }
  const mm = ds.mermas && ds.mermas['% Merma Total'];
  if (mm) { const v = mm.filter(x=>x!=null); s.mmN = v.length; s.mmSobreMeta = v.filter(x=>x>0.02).length; }

  // Confiabilidad calculada EN VIVO con dxpSerieOk (no se confía en el split que
  // trae series.json, porque el pipeline con detección de series planas puede no
  // haberse re-ejecutado todavía). Un dataset es confiable si al menos una de sus
  // medidas pasa la prueba de serie real.
  s.repConSerie = DXP_ORDEN.filter(tp => {
    const c = DXP_SERIE_CFG[tp];
    return c && !!dxpSerie(c.ds, c.medida);
  });
  s.repSinSerie = DXP_ORDEN.filter(tp => !s.repConSerie.includes(tp));
  s.dsConf = s.repConSerie.length;
  s.dsTot  = DXP_ORDEN.length;
  // Datasets cuya serie existe pero es plana (medida sin filtro de fecha)
  s.dsPlanaLista = Object.keys(ds).filter(n => !Object.values(ds[n] || {}).some(dxpSerieOk));
  s.dsSinEsquema = Object.keys((SERIES && SERIES.sin_serie) || {}).length;
  // Nombres legibles de los reportes sin historia mensual: decir "Control
  // Interno y Avance vs Presupuesto" es accionable; decir "2 datasets" no.
  s.dsSinSerieNombres = s.repSinSerie.map(t => DXP_NOMBRE[t] || t);

  // YoY de ventas (acumulado comparable)
  if (vt && ps.length) {
    const aAct = ps[ps.length-1].slice(0,4), aAnt = String(parseInt(aAct)-1);
    const comp = mesesComparables(vt, ps, aAnt, aAct);
    if (comp.length) {
      s.acumAct = sumaEn(vt, ps, aAct, comp);
      s.acumAnt = sumaEn(vt, ps, aAnt, comp);
      s.acumYoY = (s.acumAnt) ? (s.acumAct/s.acumAnt-1)*100 : null;
      s.acumMeses = comp.length; s.anioAct = aAct; s.anioAnt = aAnt;
    }
  }
  const yoy = DATA.yoy || {};
  const vAct = parseVal(s.ventas);
  s.ventasYoY = (yoy.ventas && vAct) ? (vAct - yoy.ventas)/yoy.ventas*100 : null;

  // Conteo de estados
  s.criticos = DXP_ORDEN.filter(t => rp[t]?.estado === 'red');
  s.atencion = DXP_ORDEN.filter(t => rp[t]?.estado === 'yellow');
  return s;
}

function dxpPct(v, dec) { return v == null ? '—' : v.toFixed(dec == null ? 1 : dec) + '%'; }
function dxpSigno(v, dec) { return v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(dec == null ? 1 : dec) + '%'; }

// ── Bloque: Resumen Ejecutivo (veredicto + 3 hallazgos) ────────────────────
function dxpExecSummary(s) {
  const partes = [];
  if (s.ventasYoY != null) partes.push(`Ventas crecen <span class="g">${dxpSigno(s.ventasYoY)} YoY</span> (${s.ventas})`);
  const duros = [];
  if (s.ckDelta != null) duros.push(`<b>Costo/kg subió ${dxpSigno(s.ckDelta,0)} en ${s.ckN} meses</b> mientras el precio ${s.pkDelta!=null&&s.pkDelta<0?'cayó':'no lo compensó'}`);
  if (s.vpPct != null) duros.push(`<b>1 de cada ${(100/s.vpPct).toFixed(0)} soles pedidos se pierde</b> por Fill Rate`);
  const cierre = s.mgEsMin ? ' — la utilidad de este mes es la más baja de los últimos ' + s.mgN + '.' : '.';
  const verdict = (partes.length ? partes[0] + ', pero el crecimiento se está comiendo a sí mismo: ' : '')
    + duros.join(', y ') + cierre;

  const findings = [];
  if (s.mgAct != null) findings.push({
    n:'Hallazgo 1 · Margen', tipo:'margen_variable',
    txt:`Margen implícito <b>${dxpPct(s.mgAct,2)}</b> — ${s.mgEsMin?'mínimo':'dentro'} de ${s.mgN} meses. Costo/kg <b>${dxpSigno(s.ckDelta,0)}</b>, precio/kg <b>${dxpSigno(s.pkDelta,1)}</b> en el mismo período.`
  });
  if (s.frBajoMeta != null) findings.push({
    n:'Hallazgo 2 · Fill Rate', tipo:'fill_rate',
    txt:`<b>${s.frBajoMeta}/${s.frN} meses</b> bajo meta 98%. Venta Perdida <b>${s.ventaPerdida||'—'}</b> — ${dxpPct(s.vpPct)} de todo lo pedido.`
  });
  if (s.ciAtrasPct != null) findings.push({
    n:'Hallazgo 3 · Gobierno interno', tipo:'control_interno',
    txt:`<b>${dxpPct(s.ciAtrasPct)}</b> de los planes de acción de auditoría están atrasados — por eso el cumplimiento no sube aunque se detectan los problemas.`
  });

  return `
    <div class="exec-summary">
      <div class="exec-eyebrow">Resumen Ejecutivo · para CEO</div>
      <div class="exec-verdict">${verdict}</div>
      ${findings.length ? `<div class="exec-findings">${findings.map(f => `
        <div class="ef" onclick="dxpOpen('${f.tipo}')">
          <div class="ef-n">${f.n}<span class="arrow">→</span></div>
          <div class="ef-txt">${f.txt}</div>
        </div>`).join('')}</div>` : ''}
    </div>`;
}

// ── Bloque: qué reportes no tienen historia mensual ────────────────────────
//
// Antes esto era un recuadro rojo con jerga de programador —nombres de
// archivos, "medida sin filtro de fecha", tareas pendientes del pipeline— en
// la primera pantalla que ve el gerente. Decía la verdad y no servía de nada:
// no hay ninguna decisión que tomar con eso, y el rojo hacía pensar que algo
// estaba roto.
//
// No es un fallo: esos dos reportes son acumulados históricos en Power BI y
// no guardan corte por mes. Es un límite del origen, no del tablero.
function dxpNoteBanner(s) {
  if (!s.dsTot || s.dsConf >= s.dsTot) return '';
  const faltan = Math.max(0, s.dsTot - s.dsConf);
  const nombres = (s.dsSinSerieNombres || []).join(' y ');
  return `
    <div class="note-banner">
      <span class="tag">SIN COMPARATIVO MENSUAL</span>
      <span>${nombres
        ? `<b>${nombres}</b> no tienen`
        : `<b>${faltan}</b> de los ${s.dsTot} reportes no tienen`} historia por mes:
      en Power BI son acumulados y no guardan el corte de cada mes. Se muestran
      igual, con su cifra del día, pero sin tendencia ni comparación contra el
      mes anterior. Los otros <b>${s.dsConf}</b> sí la tienen.</span>
    </div>`;
}

// ── Bloque: mapa de causalidad ─────────────────────────────────────────────
function dxpCausal(s) {
  const ch = [];
  if (s.uenPeor && s.ckDelta != null && s.mgAct != null) ch.push([
    {c:'crit', l:'Merma — peor UEN/Planta', v:`${s.uenPeor.uen} ${s.uenPeor.merma}${s.plaPeor?' · '+s.plaPeor.planta+' '+s.plaPeor.merma:''}`,
     s:`${s.ratioUen?s.ratioUen.toFixed(1)+'x':''}${s.ratioPla?' y '+s.ratioPla.toFixed(1)+'x':''} vs mejor referencia interna`},
    {c:'crit', l:`Costo x Kilo (${s.ckN} meses)`, v:dxpSigno(s.ckDelta,1), s:`S/${s.ckIni.toFixed(2)} (${fmtPeriodo(s.ckIniP)}) → S/${s.ckFin.toFixed(2)} (${fmtPeriodo(s.ckFinP)})`},
    {c:'crit', l:'Margen implícito', v:dxpPct(s.mgAct,2), s:`${s.mgEsMin?'Mínimo histórico':'Actual'} · meta 52%`},
  ]);
  if (s.fillRate && s.ventaPerdida && s.facturacion) ch.push([
    {c:'crit', l:'Fill Rate', v:s.fillRate, s:`${s.frBajoMeta}/${s.frN} meses bajo meta 98%`},
    {c:'crit', l:'Venta Perdida', v:s.ventaPerdida, s:`${dxpPct(s.vpPct)} de la Orden de Venta (${s.ordenVenta})`},
    {c:'warn', l:'Facturación real', v:s.facturacion, s:`${dxpPct(s.faPct)} de lo pedido — techo de ventas autoimpuesto`},
  ]);
  if (s.ciAtrasados && s.ciCritico && s.ciCumpl) ch.push([
    {c:'warn', l:'Planes de acción atrasados', v:`${s.ciAtrasados} / ${s.ciPlanes}`, s:`${dxpPct(s.ciAtrasPct)} de los planes correctivos`},
    {c:'crit', l:'Puntos en estado Crítico', v:`${s.ciCritico} / ${s.ciEval}`, s:`${s.ciCritPct||''} del total — no bajan porque no se cierran los planes`},
    {c:'crit', l:'% Cumplimiento', v:s.ciCumpl, s:`Estancado ${(85-parseVal(s.ciCumpl)).toFixed(1)} pts bajo meta 85%`},
  ]);
  if (!ch.length) return '';
  const box = b => `<div class="flow-box ${b.c}"><div class="fb-l">${b.l}</div><div class="fb-v">${b.v}</div><div class="fb-sub">${b.s}</div></div>`;
  return `
    <div class="section-label"><span class="num">◆</span><h2>De dónde viene el problema — mapa de causalidad</h2><span class="rule"></span></div>
    <div class="causal-wrap">${ch.map(c => `<div class="flow-chain">${c.map((b,i)=>box(b)+(i<c.length-1?'<div class="flow-arrow">→</div>':'')).join('')}</div>`).join('')}</div>`;
}

// ── Bloque: heatmap ────────────────────────────────────────────────────────
function dxpHeatmap(s) {
  const cells = DXP_ORDEN.map((t,i) => {
    const rd = s.rp[t]; if (!rd) return '';
    const est = rd.estado === 'red' ? 'crit' : rd.estado === 'yellow' ? 'warn' : 'ok';
    const k0 = (rd.kpis||[])[0];
    const n = k0 ? parseVal(k0.valor) : null;
    const marca = est === 'ok' ? '✓' : (n != null && n < 1000 ? Math.round(n) : '!');
    return `<div class="hm-cell" onclick="dxpOpen('${t}')" title="${k0?k0.label+': '+k0.valor:''}">
      <div class="hm-n">${String(i+1).padStart(2,'0')}</div>
      <div class="hm-dot ${est}">${marca}</div>
      <div class="hm-lbl">${DXP_CORTO[t]||t}</div>
    </div>`;
  }).join('');
  return `
    <div class="section-label"><span class="num">◆</span><h2>Vista de calor — ${DXP_ORDEN.length} reportes</h2><span class="rule"></span></div>
    <div class="heatmap">${cells}</div>`;
}

// ── Bloque: grilla de 11 tarjetas ──────────────────────────────────────────
function dxpCards(s) {
  const resumen = {
    control_interno: () => `<b>${s.ciCritico||'—'} pts críticos</b> (${s.ciCritPct||'—'} del total) · <b>${s.ciAtrasados||'—'} planes atrasados</b> de ${s.ciPlanes||'—'} (${dxpPct(s.ciAtrasPct)})`,
    fill_rate: () => `<b>${s.frBajoMeta}/${s.frN} meses</b> bajo meta · Venta Perdida <b>${s.ventaPerdida||'—'}</b> (${dxpPct(s.vpPct)} del pedido)`,
    mermas: () => `${s.uenPeor?`${s.uenPeor.uen} <b>${s.ratioUen?s.ratioUen.toFixed(1)+'x':''}</b> peor que ${s.uenMejor.uen}`:''}${s.plaPeor?` · ${s.plaPeor.planta} <b>${s.ratioPla?s.ratioPla.toFixed(1)+'x':''}</b> peor que ${s.plaMejor.planta}`:''}`,
    margen_variable: () => `Margen implícito <b>${dxpPct(s.mgAct,2)}</b> — ${s.mgEsMin?'mínimo histórico':'dentro'} de ${s.mgN} meses`,
    cuentas_por_cobrar: () => `CxC por vencer <b>${s.cxcVencer||'—'}</b> · aging en 4 tramos + serie mensual`,
    cuentas_por_pagar: () => `<b>${dxpPct(s.refPct)}</b> refinanciado (${s.refinanciado||'—'}) · ${s.proveedores||'—'} proveedores`,
    consumo_materiales: () => `Costo por tonelada, producida y vendida · acumulado del año`,
    compras: () => `Ratio consumo/compra · sobre 100% jala inventario`,
    sop_inventario: () => `Dead stock por categoría · seis categorías`,
    productividad: () => `Planilla por kilo · <b>falta definir la meta</b>`,
    margen_variable_pag2: () => `Avance por canal desde la tabla del reporte 11 — el visual no filtra año`,
  };
  const cards = DXP_ORDEN.map((t,i) => {
    const rd = s.rp[t]; if (!rd || !(rd.kpis||[]).length) return '';
    const est = rd.estado === 'red' ? 'crit' : rd.estado === 'yellow' ? 'warn' : 'ok';
    const lbl = est === 'crit' ? 'Crítico' : est === 'warn' ? 'Atención' : 'Sin alerta';
    const PREF = { margen_variable:'Margen variable', margen_variable_pag2:'Avance vs Ppto',
                   cuentas_por_pagar:'CxP Total', compras:'Stock Valorizado' };
    const k0 = (PREF[t] && rd.kpis.find(k => k.label === PREF[t])) || rd.kpis[0];
    let body = ''; try { body = resumen[t] ? resumen[t]() : ''; } catch(e) { body = ''; }
    if (!body) body = rd.alerta || `${k0.label}: <b>${k0.valor}</b>`;
    return `<div class="rcard ${est}" onclick="dxpOpen('${t}')">
      <div class="rcard-head">
        <div><div class="rcard-num">${String(i+1).padStart(2,'0')}</div><div class="rcard-title">${DXP_NOMBRE[t]||t}<span class="arrow">→</span></div></div>
        <span class="pill ${est}">${lbl}</span>
      </div>
      <div class="rcard-kpi"><span class="v" style="color:${est==='crit'?'var(--red)':est==='warn'?'var(--yellow)':'var(--ink)'}">${k0.valor}</span><span class="meta">${k0.label}${k0.fuente && k0.fuente !== 'reporte' ? ' <span title="No contrastado contra Power BI" style="color:var(--yellow);font-weight:700">◦</span>' : ''}${k0.meta?' · meta '+k0.meta:''}</span></div>
      <div class="rcard-body">${body}</div>
    </div>`;
  }).join('');
  return `
    <div class="section-label"><span class="num">◆</span><h2>Reportes — clic para abrir dashboard completo</h2><span class="rule"></span></div>
    <div class="grid">${cards}</div>`;
}
