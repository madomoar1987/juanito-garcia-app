  control_interno: {
    fuerte: ['control interno','auditoria','plan de accion','planes de accion',
             'punto de control','puntos de control'],
    debil: ['control','area','areas','jefe','jefes','plan','planes','cumplimiento',
            'observacion','critico'] },
  consumo_materiales: {
    fuerte: ['consumo','mip','tonelada','toneladas','costo x tn','por tonelada'],
    debil: ['indirecto','indirectos','material','materiales'] },
  productividad: {
    fuerte: ['productividad','planilla','funcionario','funcionarios'],
    debil: ['personal','kg producido','kilo producido','mano de obra'] },
  margen_variable_pag2: {
    fuerte: ['presupuesto','ppto','avance vs','canal','canales','produccion',
             'programado','cumplimiento de produccion'],
    debil: ['avance','facturacion','facturado','moderno','tradicional'] },
};

// Palabras con las que se pide un corte. Sirven para responder "esto no está
// abierto por producto" en vez de entregar otro corte como si fuera el pedido.
const DIMENSIONES = {
  producto: ['producto','sku','articulo','item','items'],
  cliente:  ['cliente','clientes'],
  canal:    ['canal','canales'],
  planta:   ['planta','plantas'],
  persona:  ['persona','trabajador','empleado','colaborador','jefe','responsable'],
  categoria:['categoria','categorias','familia','rubro'],
  proveedor:['proveedor','proveedores'],
  marca:    ['marca','marcas'],
  uen:      ['uen','unidad de negocio','negocio'],
};
// Con qué campo de los desgloses se cubre cada dimensión.
const DIMENSION_DE = { producto:'producto', sku:'producto', responsable:'persona',
  cliente:'cliente', grupo:'cliente',
  canal:'canal', planta:'planta', jefe:'persona', categoria:'categoria',
  nombre:'proveedor', marca:'marca', uen:'uen', label:null, momento:null };

function localNormalizar(t) {
  return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Un término encaja si aparece como frase dentro de la pregunta (para los de
// varias palabras) o si comparte raíz con alguna palabra suelta.
function localEncaja(termino, texto, tk) {
  if (termino.includes(' ')) return texto.includes(termino);
  return tk.some(t => localMismaRaiz(t, termino));
}

let localUltimoTipo = null;

function localReporte(pregunta) {
  const texto = localNormalizar(pregunta);
  const tk = localTokens(pregunta);
  const puntos = {};
  let mejor = null, mejorN = 0, nombrado = false;
  Object.entries(TERMINOS_REPORTE).forEach(([tipo, def]) => {
    const fuertes = def.fuerte.filter(x => localEncaja(x, texto, tk)).length;
    const n = fuertes * 10 + def.debil.filter(x => localEncaja(x, texto, tk)).length;
    puntos[tipo] = n;
    if (n > mejorN) { mejor = tipo; mejorN = n; nombrado = fuertes > 0; }
  });
  // Sin un término que nombre otro reporte, se sigue en el de la respuesta
  // anterior siempre que encaje igual de bien. Una repregunta corta ("en tigo
  // qué SKU?") continúa el tema; no empieza uno nuevo.
  if (!nombrado && localUltimoTipo && (puntos[localUltimoTipo] || 0) >= mejorN) {
    return { tipo: localUltimoTipo, puntaje: mejorN, nombrado: false, heredado: true };
  }
  return { tipo: mejor, puntaje: mejorN, nombrado };
}

// ¿Qué tipo de pregunta es?
function localIntencion(p) {
  const t = p.toLowerCase();
  if (/desde cuando|desde cuándo|evolucion|evolución|tendencia|como viene|cómo viene|historico|histórico|meses|mensual|ultimamente|últimamente|venimos|va mejorando|empeorando/.test(t)) return 'tendencia';
  if (/segundo|tercero|siguiente|el resto|completa|lista|todos|todas/.test(t)) return 'ranking';
  if (/quien|quién|cual|cuál|peor|mejor|mayor|menor|top|ranking|mas |más |concentra/.test(t)) return 'ranking';
  if (/de donde|de dónde|por que|por qué|causa|origen|explica/.test(t)) return 'origen';
  return 'resumen';
}

// Ranking de un desglose: ordena y devuelve los primeros, con su peso.
function localRanking(rd, cfg, tope) {
  const filas = rd[cfg.clave] || [];
  const items = [];
  filas.forEach(f => {
    const campo = localCampoValor(cfg, f);
    const v = localNum(f[campo]);
    if (v == null) return;
    const n = String(f[cfg.entidad] ?? '—');
    // Algunos desgloses traen la misma entidad en varias filas (una por
    // estado). Sumarlas evita un ranking donde el primer puesto se repite.
    const previo = cfg.sumar ? items.find(x => x.n === n) : null;
    if (previo) { previo.v += v; previo.crudo = previo.v; return; }
    items.push({ n, v, crudo: f[campo],
      extra: f.pct != null ? f.pct : (f.margen ?? f.pedidos ?? null) });
  });
  if (!items.length) return null;
  items.sort((a, b) => cfg.menorEsPeor ? a.v - b.v : b.v - a.v);
  const total = items.reduce((a, b) => a + b.v, 0);
  return { items: items.slice(0, tope || 6), total, n: items.length };
}

// Elige el desglose que responde la pregunta. Busca primero dentro del
// reporte detectado y, si ahí no hay ninguno que encaje, en todos los demás:
// quien pregunta por "canal" o por "faltantes" nombra el dato, no el reporte
// donde vive.
function localElegirDesglose(rp, tipo, tk, det, texto) {
  // "Quién" pide un nombre. Sin esto, "quién tiene más vencido" respondía con
  // los tramos de antigüedad, que no tienen dueño.
  const pidePersona = /\bquien\b|\bquién\b/.test(texto || '');
  const esNominal = (cfg) =>
    ['responsable', 'nombre', 'jefe', 'cliente', 'grupo'].includes(cfg.entidad);
  const puntaje = (cfg) =>
    tk.filter(t => cfg.alias.some(a => localMismaRaiz(t, a))).length +
    (pidePersona && esNominal(cfg) ? 1 : 0);
  const enReporte = (t) => DESGLOSES_LOCALES
    .filter(c => Array.isArray(rp[t]?.[c.clave]) && rp[t][c.clave].length);

  const propios = enReporte(tipo).map(c => ({ tipo, cfg: c, p: puntaje(c) }));
  const mejorPropio = propios.slice().sort((x, y) => y.p - x.p)[0];
  if (mejorPropio && mejorPropio.p > 0) return mejorPropio;

  let mejorAjeno = null;
  Object.keys(rp).forEach(t => {
    if (t === tipo) return;
    enReporte(t).forEach(c => {
      const p = puntaje(c);
      if (p > 0 && (!mejorAjeno || p > mejorAjeno.p)) mejorAjeno = { tipo: t, cfg: c, p };
    });
  });
  // Se cambia de reporte cuando el propio no tiene ninguna coincidencia: si
  // la pregunta dice "canal" y este reporte no desglosa por canal, el dato
  // está en otro y es ahí donde hay que ir.
  // Y solo si el reporte no estaba nombrado. Si preguntas por "merma por
  // producto", el tema es la merma: que no haya desglose por producto es un
  // hueco del dato, no una excusa para contestar de otro reporte.
  const fijo = det.nombrado || det.puntaje >= 2;
  if (mejorAjeno && (!mejorPropio || mejorPropio.p === 0) && !fijo) return mejorAjeno;
  return propios.length
    ? { tipo, cfg: propios[0].cfg, p: 0, noDisponible: mejorAjeno ? mejorAjeno.cfg : null }
    : { tipo, cfg: null, p: 0, noDisponible: mejorAjeno ? mejorAjeno.cfg : null };
}

// Tendencia de una serie: primer y último dato, cambio y punto de inflexión.
function localTendencia(arr, periodos) {
  const pts = [];
  let parcial = null;
  arr.forEach((v, i) => {
    if (v == null) return;
    // El mes en curso queda fuera de maximos, minimos y variacion: llevaria
    // el minimo casi siempre, por llevar menos dias, no por ir mejor.
    if (esParcial(periodos[i])) { parcial = { v, p: periodos[i] }; return; }
    pts.push({ v, p: periodos[i] });
  });
  if (pts.length < 3) return null;
  const ini = pts[0], fin = pts[pts.length - 1];
  const cambio = ini.v ? (fin.v - ini.v) / Math.abs(ini.v) * 100 : null;
  // El mes de mayor salto respecto al anterior: casi siempre es donde empezó
  // el problema, y es lo que se busca al preguntar "desde cuándo".
  let quiebre = null, mayor = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.abs(pts[i].v - pts[i - 1].v);
    if (d > mayor) { mayor = d; quiebre = pts[i]; }
  }
  const max = pts.reduce((a, b) => b.v > a.v ? b : a);
  const min = pts.reduce((a, b) => b.v < a.v ? b : a);
  return { ini, fin, cambio, quiebre, max, min, n: pts.length, parcial };
}

function localSeriesDe(tipo) {
  const mapa = {
    cuentas_por_cobrar: 'cxc', cuentas_por_pagar: 'cxp', margen_variable: 'margen',
    mermas: 'mermas', compras: 'compras', sop_inventario: 'inventario',
    fill_rate: 'fill_rate', consumo_materiales: 'consumo', productividad: 'productividad',
    margen_variable_pag2: 'planificacion'
  };
  const ds = mapa[tipo];
  return (typeof SERIES !== 'undefined' && SERIES?.datasets?.[ds]) || null;
}

// Si la pregunta nombra a alguien o algo que está en un desglose ("cuánto le
// debo a E & M"), lo que se quiere es esa fila, no el total del reporte.
const EMPRESAS_LOCALES = ['pauno','amauta','neopack'];

function localBuscarEntidad(rp, tk, tipoPref, texto) {
  const largos = tk.filter(t => t.length >= 4 && !EMPRESAS_LOCALES.includes(t));
  const tipos = [tipoPref, ...Object.keys(rp).filter(t => t !== tipoPref)].filter(Boolean);
  for (const t of tipos) {
    for (const cfg of DESGLOSES_LOCALES) {
      const filas = rp[t]?.[cfg.clave];
      if (!Array.isArray(filas)) continue;
      for (const f of filas) {
        const nom = localNormalizar(String(f[cfg.entidad] ?? ''));
        if (nom.length < 3) continue;
        const golpes = largos.filter(w => nom.includes(w)).length;
        // El nombre entero dicho en la pregunta, dos palabras coincidentes, o
        // una palabra que ya sea casi todo el nombre.
        // Nadie escribe "E & M S.R.L." entero: basta con que la pregunta
        // traiga el arranque del nombre.
        if (EMPRESAS_LOCALES.includes(nom)) continue;
        const cabecera = nom.split(/[,(]/)[0].trim();
        const corto = cabecera.split(/\s+/).slice(0, 3).join(' ');
        const literal = [cabecera, corto]
          .some(c => c.length >= 5 && texto.includes(c));
        if (literal || golpes >= 2 ||
            largos.some(w => nom.split(/\s+/).some(x => x === w) && w.length >= 4)) {
          return { tipo: t, cfg, fila: f };
        }
      }
    }
  }
  return null;
}

// Ficha de una fila concreta: sus campos y en qué puesto queda.
function localFichaEntidad(rp, ent, aviso) {
  const nomSec = (typeof DXP_NOMBRE !== 'undefined' && DXP_NOMBRE[ent.tipo]) || ent.tipo;
  const campos = Object.entries(ent.fila)
    .filter(([k]) => k !== ent.cfg.entidad)
    .map(([k, v]) => `· ${localEsc(k.replace(/_/g, ' '))}: <b>${localEsc(v)}</b>`);
  const r = localRanking(rp[ent.tipo], ent.cfg, 999);
  const pos = r ? r.items.findIndex(x => x.n === String(ent.fila[ent.cfg.entidad])) : -1;
  return `<b>${nomSec}</b> — datos al ${DATA?.fecha || 'último corte'}<br><br>` +
    (aviso || '') + `<b>${localEsc(ent.fila[ent.cfg.entidad])}</b><br>` + campos.join('<br>') +
    (pos >= 0 ? `<br><br>Puesto <b>${pos + 1}</b> de ${r.n} en ${ent.cfg.etq}.` : '');
}

// Punto de entrada. Devuelve HTML o null si no sabe responder.
function analizarLocal(pregunta) {
  const emp = 'PAUNO';
  const rp = (DATA?.empresas || {})[emp]?.reportes || {};
  const det = localReporte(pregunta);
  const tipo = det.tipo;
  const texto = localNormalizar(pregunta);
  if (!tipo) {
    const solo = localBuscarEntidad(rp, localTokens(pregunta), null, texto);
    if (!solo) return null;
    localUltimoTipo = solo.tipo;
    return localFichaEntidad(rp, solo);
  }
  if (!tipo || !rp[tipo]) return null;
  const rd = rp[tipo];
  const nombre = (typeof DXP_NOMBRE !== 'undefined' && DXP_NOMBRE[tipo]) || tipo;
  const intencion = localIntencion(pregunta);
  const tk = localTokens(pregunta);
  const partes = [];

  const cab = `<b>${nombre}</b> — datos al ${DATA?.fecha || 'último corte'}<br><br>`;

  // ── Dimensión pedida que este reporte no tiene.
  const dimPedida = Object.entries(DIMENSIONES).find(([, ws]) =>
    ws.some(w => localEncaja(w, texto, tk)));
  let avisoDim = '';
  if (dimPedida) {
    const cubre = DESGLOSES_LOCALES.some(c =>
      Array.isArray(rd[c.clave]) && rd[c.clave].length &&
      DIMENSION_DE[c.entidad] === dimPedida[0]);
    if (!cubre) avisoDim = `ℹ️ <b>${nombre}</b> no está abierto por ` +
      `<b>${dimPedida[0]}</b> — ese dato no existe en este reporte.<br><br>`;
  }

  // ── Preguntó por alguien concreto: se responde por esa fila.
  const ent = localBuscarEntidad(rp, tk, tipo, texto);
  if (ent) { localUltimoTipo = ent.tipo; return localFichaEntidad(rp, ent, avisoDim); }

  // ── Ranking / origen: se busca el desglose que responde la pregunta.
  // También se entra aquí en preguntas sin verbo de ranking ("qué materiales
  // me faltan") cuando la pregunta nombra un desglose de forma inequívoca.
  const sel = localElegirDesglose(rp, tipo, tk, det, texto);
  if (sel && sel.cfg && (intencion === 'ranking' || intencion === 'origen' ||
      (sel.p >= 1 && intencion !== 'tendencia'))) {
    const elegido = sel.cfg;
    const r = localRanking(rp[sel.tipo], elegido, 6);
    if (r) {
      const nomSec = (typeof DXP_NOMBRE !== 'undefined' && DXP_NOMBRE[sel.tipo]) || sel.tipo;
      const esPct = /%/.test(String(r.items[0].crudo || ''));
      const dir = elegido.menorEsPeor ? 'de peor a mejor' : 'de mayor a menor';
      partes.push(`<b>${nomSec}</b> — datos al ${DATA?.fecha || 'último corte'}<br><br>` +
        (sel.tipo === tipo ? avisoDim : '') +
        `<b>${elegido.etq}</b> (${dir}, ${r.n} en total):<br>`);
      partes.push(r.items.map((x, i) => {
        const peso = (!elegido.menorEsPeor && r.total)
          ? ` · ${(x.v / r.total * 100).toFixed(1)}% del total` : '';
        const ex = (x.extra == null || esPct) ? ''
          : ` · ${typeof x.extra === 'number' ? x.extra.toFixed(1) + '%' : x.extra}`;
        return `${i + 1}. <b>${localEsc(x.n)}</b> — ${localEsc(x.crudo)}${peso}${ex}`;
      }).join('<br>'));
      const primero = r.items[0];
      // En una lista de tres, tener el 56% no es una concentración: es
      // aritmética. La alerta pide lista suficientemente larga.
      const conc = r.total ? primero.v / r.total : 0;
      if (!elegido.menorEsPeor && ((r.n >= 4 && conc > 0.5) || (r.n >= 6 && conc > 0.3))) {
        partes.push(`<br><br>⚠️ <b>${localEsc(primero.n)}</b> concentra el ` +
          `${(conc * 100).toFixed(0)}% — la cifra depende de uno solo.`);
      }
      if (elegido.menorEsPeor) {
        partes.push(`<br><br>El peor es <b>${localEsc(primero.n)}</b> con ${localEsc(primero.crudo)}.`);
      }
      const pidePersona = /trabajador|empleado|persona|colaborador|responsable|jefe/
        .test(pregunta.toLowerCase());
      if (pidePersona && !['jefe', 'nombre', 'cliente'].includes(elegido.entidad)) {
        partes.push(`<br><br>ℹ️ Este dato no está abierto por persona, solo por ` +
          `<b>${elegido.entidad}</b>. Por persona solo hay el % de cumplimiento ` +
          `de Control Interno (pregunta "qué jefe cumple peor").`);
      }
    }
  }

  const huboRanking = partes.length > 0;

  // Se pidió un corte que este reporte no tiene. Decirlo es la respuesta:
  // callarlo hace creer que lo de abajo contesta la pregunta.
  // ── Sin ranking que mostrar, se abre con los KPIs del reporte
  if (!huboRanking) {
    const k = rd.kpis || [];
    if (k.length) {
      partes.push(cab + avisoDim + k.map(x =>
        `· ${localEsc(x.label)}: <b>${localEsc(x.valor)}</b>` +
        `${x.meta ? ` (meta ${localEsc(x.meta)})` : ''}`).join('<br>'));
      if (rd.alerta) partes.push(`<br><br>⚠️ ${localEsc(rd.alerta)}`);
    }
  }

  // ── Tendencia: se recorre la serie del reporte. Va también cuando no hubo
  // ranking, porque unos KPIs sueltos no dicen si la cosa mejora o empeora.
  if (intencion === 'tendencia' || !huboRanking) {
    const ss = localSeriesDe(tipo);
    if (ss && typeof SERIES !== 'undefined') {
      const claves = Object.keys(ss);
      // Serie que nombre la pregunta, o la primera que tenga suficientes datos
      const clave = claves.find(k => tk.some(t =>
        k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(t))) || claves[0];
      const t = localTendencia(ss[clave], SERIES.periodos);
      if (t) {
        var parcialFin = t.parcial;
        const esPct = clave.trim().startsWith('%');
        const f = v => esPct ? (v * 100).toFixed(2) + '%' : localFmt(v, false);
        if (!partes.length) partes.push(cab);
        partes.push(`<br><b>${clave}</b> — ${t.n} meses con dato:<br>` +
          `· ${t.ini.p}: ${f(t.ini.v)}<br>` +
          `· ${t.fin.p}: <b>${f(t.fin.v)}</b>${marcaParcial(t.fin.p)}` +
          (t.cambio != null ? ` (${t.cambio >= 0 ? '+' : ''}${t.cambio.toFixed(1)}%)` : '') + '<br>' +
          `· máximo ${f(t.max.v)} en ${t.max.p} · mínimo ${f(t.min.v)} en ${t.min.p}`);
        if (parcialFin) partes.push(`<br><br><b>${parcialFin.p} en curso:</b> ` +
          `${f(parcialFin.v)} — son los días transcurridos, no el mes entero. ` +
          `No lo compares de frente contra un mes cerrado.`);
        if (t.quiebre && !esParcial(t.quiebre.p))
          partes.push(`<br><br>El mayor salto fue en <b>${t.quiebre.p}</b> ` +
            `(${f(t.quiebre.v)}): ahí conviene mirar primero.`);
      }
      // Si hay varias series del mismo grupo, se comparan entre sí
      const grupo = claves.filter(k => k !== clave && k.split(' ')[0] === clave.split(' ')[0]);
      if (grupo.length >= 2) {
        const ult = grupo.map(k => {
          const a = ss[k];
          for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return { k, v: a[i], p: SERIES.periodos[i] };
          return null;
        }).filter(Boolean).sort((a, b) => b.v - a.v);
        if (ult.length) {
          const esPct = ult[0].k.trim().startsWith('%');
          partes.push(`<br><br><b>Comparación por segmento</b> (${ult[0].p})` +
            `${marcaParcial(ult[0].p)}:<br>` +
            ult.map(x => `· ${x.k.replace(clave.split(' ')[0], '').trim() || x.k}: ` +
              `<b>${esPct ? (x.v * 100).toFixed(2) + '%' : localFmt(x.v)}</b>`).join('<br>'));
        }
      }
    }
  }

  if (partes.length) localUltimoTipo = tipo;
  return partes.length ? partes.join('') : null;
}

function buscarRespuestaLocal(pregunta) {
  const qa = DATA?.chat_qa;
  if (!qa || !qa.length) return null;
  // Si la pregunta coincide con un handler de analizarConJuanito, no usar QA local
  const p = pregunta.toLowerCase();
  const tieneHandlerDirecto = p.includes('compra') || p.includes('ratio') || p.includes('consumo') ||
    p.includes('inventario') || p.includes('stock') || p.includes('dead') || p.includes('s&op') ||
    p.includes('productividad') || p.includes('planilla') || p.includes('canal') ||
    p.includes('presupuesto') || p.includes('avance') || p.includes('ppto') ||
    p.includes('merma') || p.includes('mora') || p.includes('cxc') || p.includes('cobr') ||
    p.includes('venta') || p.includes('margen') || p.includes('cxp') || p.includes('pagar') ||
    p.includes('decid') || p.includes('hoy') || p.includes('semana') || p.includes('escal');
  if (tieneHandlerDirecto) return null;
  // Solo usar QA local para preguntas sin handler — umbral alto y solo palabras de contenido
  const scores = qa.map(item => {
    const q = item.pregunta.toLowerCase();
    const palabras = p.split(/\s+/).filter(w => w.length > 4 && !STOPWORDS.has(w));
    if (!palabras.length) return { item, score: 0 };
    const matches = palabras.filter(w => q.includes(w)).length;
    return { item, score: matches / palabras.length };
  });
  scores.sort((a, b) => b.score - a.score);
  if (scores[0].score >= 0.5) return scores[0].item.respuesta;
  return null;
}

function analizarConJuanito(pregunta) {
  const p = pregunta.toLowerCase();
  const d = DATA;
  const sems = d.semaforos || {};
  const razones = d.semaforo_razon || {};
  const agenda = d.agenda_ceo || {};

  // Detectar empresa mencionada
  const emp = p.includes('pauno') ? 'PAUNO' : p.includes('amauta') ? 'AMAUTA' : p.includes('neopack') ? 'NEOPACK' : null;

  const fmt = s => (s||'').replace(/\n/g,'<br>');
  const semIcon = s => s==='red'?'🔴':s==='yellow'?'🟡':'🟢';
  const semTxt  = s => s==='red'?'CRÍTICO':s==='yellow'?'ATENCIÓN':'OK';

  // Función para obtener KPIs clave de una empresa
  function kpisEmpresa(empresa) {
    const ed = (d.empresas||{})[empresa]||{};
    const rpts = REPORTES_CONFIG[empresa]||[];
    const lista = [];
    rpts.forEach(r => {
      const rd = (ed.reportes||{})[r.tipo]||{};
      if (rd.estado && rd.estado !== 'green' && rd.kpis?.length) {
        lista.push({ reporte: r.label, estado: rd.estado, alerta: rd.alerta, kpi: rd.kpis[0] });
      }
    });
    return lista;
  }

  // 1. DECIDIR HOY
  if (p.includes('decid') || p.includes('hoy') || p.includes('urgente') || p.includes('inmedi')) {
    const items = agenda.decidir_hoy || [];
    if (!items.length) return '✅ No hay acciones críticas para decidir hoy según los datos actuales.';
    const por_empresa = {};
    items.forEach(i => { (por_empresa[i.empresa||'General'] = por_empresa[i.empresa||'General']||[]).push(i); });
    let html = `<strong>🔴 DECIDIR HOY — ${items.length} acción${items.length>1?'es':''}</strong><br><br>`;
    items.forEach((i,n) => {
      html += `<strong>${n+1}.</strong> ${i.texto||i.text||''}<br>`;
      if (i.empresa) html += `<span style="font-size:11px;color:var(--text3)">▸ ${i.empresa}${i.responsable?' · '+i.responsable:''}</span><br>`;
      html += '<br>';
    });
    html += `<strong>¿Por qué importa?</strong> Estas acciones tienen impacto directo en liquidez o resultado del mes. Deben resolverse antes del cierre del día.`;
    return html;
  }

  // 2. SITUACIÓN GENERAL / SEMÁFOROS
  if (p.includes('situaci') || p.includes('general') || p.includes('resumen') || p.includes('cómo están') || p.includes('estado')) {
    let html = `<strong>📊 SITUACIÓN HOLDING — ${d.fecha||'hoy'}</strong><br><br>`;
    html += `<strong>Ventas:</strong> ${d.holding_ventas||'—'} &nbsp;|&nbsp; <strong>Mora consolidada:</strong> <span style="color:var(--red)">${d.holding_mora||'—'}</span><br><br>`;
    Object.entries(sems).forEach(([e, s]) => {
      html += `${semIcon(s)} <strong>${e}</strong> — ${semTxt(s)}<br><span style="font-size:12px;color:var(--text2)">${razones[e]||''}</span><br><br>`;
    });
    const critica = Object.entries(sems).find(([e,s])=>s==='red');
    if (critica) html += `<strong>⚡ FOCO INMEDIATO:</strong> ${critica[0]} está en estado crítico. ${razones[critica[0]]||''}`;
    return html;
  }

  // 3. EMPRESA CRÍTICA
  if (p.includes('crític') || p.includes('peor') || p.includes('problema')) {
    const rojas = Object.entries(sems).filter(([e,s])=>s==='red');
    const amarillas = Object.entries(sems).filter(([e,s])=>s==='yellow');
    let html = '';
    if (rojas.length) {
      html += `<strong>🔴 EN ESTADO CRÍTICO:</strong><br>`;
      rojas.forEach(([e,s]) => {
        const kpis = kpisEmpresa(e);
        html += `<br><strong>${e}:</strong> ${razones[e]||''}<br>`;
        kpis.slice(0,3).forEach(k => html += `• ${k.reporte}: ${k.alerta||k.kpi?.valor||''}<br>`);
      });
    }
    if (amarillas.length) {
      html += `<br><strong>🟡 EN ATENCIÓN:</strong><br>`;
      amarillas.forEach(([e,s]) => html += `• ${e}: ${razones[e]||''}<br>`);
    }
    if (!rojas.length && !amarillas.length) html = '🟢 Todas las empresas operan dentro de parámetros normales.';
    return html;
  }

  // 4. MÓDULO 10 — RIESGOS (va primero para capturar "riesgo" antes que otros handlers)
  if (p.includes('riesgo') || p.includes('explota') || p.includes('risk') || p.includes('register') || p.includes('contingencia')) {
    if (!RISK_REGISTER) {
      return `<strong>⚠️ Risk Register no cargado.</strong><br><br>El archivo <code>data/latest/risk_register.json</code> no existe aún.<br><br>Riesgos detectados en el dashboard:<br><br>` + (() => {
        let h = '';
        ['PAUNO','AMAUTA','NEOPACK'].forEach(e => {
          const s = sems[e];
          if (s === 'red' || s === 'yellow') {
            const kpis = kpisEmpresa(e);
            h += `${semIcon(s)} <strong>${e}</strong> — ${razones[e]||''}<br>`;
            kpis.slice(0,2).forEach(k => h += `&nbsp;&nbsp;• ${k.reporte}: ${k.alerta||''}<br>`);
            h += '<br>';
          }
        });
        return h || '🟢 Sin riesgos críticos detectados.';
      })();
    }
    const fecha = RISK_REGISTER.fecha_actualizacion || '';
    let html = `<strong>🔴 RISK REGISTER VIVO — ${fecha}</strong><br><br>`;
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    objetivo.forEach(e => {
      const riesgos = (RISK_REGISTER.empresas?.[e]?.riesgos || []);
      if (!riesgos.length) return;
      html += `<strong>${e}</strong><br>`;
      riesgos.forEach(r => {
        const ic = r.rating==='red'?'🔴':r.rating==='yellow'?'🟡':'🟢';
        html += `${ic} <strong>${r.riesgo}</strong><br>`;
        html += `&nbsp;&nbsp;Prob: ${r.probabilidad} · Impacto: ${r.impacto_soles} · Dueño: ${r.dueno||'⚠ SIN DUEÑO'}<br>`;
        if (r.senal_temprana) html += `&nbsp;&nbsp;📡 Señal: ${r.senal_temprana}<br>`;
        if (r.mitigacion) html += `&nbsp;&nbsp;💡 ${r.mitigacion}<br>`;
        html += '<br>';
      });
    });
    const rojos = Object.values(RISK_REGISTER.empresas||{}).flatMap(e=>(e.riesgos||[]).filter(r=>r.rating==='red'));
    if (rojos.length) {
      html += `<strong>🎯 FOCO CEO esta semana (${rojos.length} riesgo${rojos.length>1?'s':''} 🔴):</strong><br>`;
      rojos.slice(0,3).forEach(r => html += `• ${r.riesgo} — Dueño: ${r.dueno||'ASIGNAR'}<br>`);
    }
    return html;
  }

  // 4b. MÓDULO 11 — HITOS
  if (p.includes('hito') || p.includes('calendario') || p.includes('qué se viene') || p.includes('próximo') || p.includes('vence') || p.includes('plazo') || p.includes('covenant') || p.includes('directorio') || p.includes('cierre')) {
    if (!HITOS) {
      return `<strong>📅 Calendario de Hitos no cargado.</strong><br><br>El archivo <code>data/latest/hitos.json</code> no existe aún.`;
    }
    const fecha = HITOS.fecha_actualizacion || '';
    let html = `<strong>📅 HITOS — PRÓXIMOS 90 DÍAS (${fecha})</strong><br><br>`;
    const hitos = HITOS.hitos || [];
    const pendientes = hitos.filter(h => h.estado !== 'Cerrado');
    const urgentes  = pendientes.filter(h => h.urgente || h.lead_time_activo);
    if (urgentes.length) {
      html += `<strong>⚡ ACTUAR HOY (en ventana de lead time):</strong><br><br>`;
      urgentes.forEach(h => {
        html += `• <strong>${h.hito}</strong> — ${h.fecha_gate}<br>`;
        html += `&nbsp;&nbsp;Acción: ${h.accion_requerida}<br>`;
        if (h.insumo_dueno) html += `&nbsp;&nbsp;Insumo: ${h.insumo_dueno}<br>`;
        html += '<br>';
      });
    }
    html += `<strong>Todos los hitos activos:</strong><br><br>`;
    pendientes.forEach(h => {
      const ic = h.urgente ? '🔴' : h.lead_time_activo ? '🟡' : '🟢';
      html += `${ic} <strong>${h.hito}</strong> [${h.tipo}] — ${h.fecha_gate}<br>`;
      html += `&nbsp;&nbsp;${h.accion_requerida}<br><br>`;
    });
    const vencidos = hitos.filter(h => h.estado === 'Vencido_sin_accion');
    if (vencidos.length) {
      html += `<strong>⛔ VENCIDOS SIN ACCIÓN → pasan a Risk Register:</strong><br>`;
      vencidos.forEach(h => html += `• ${h.hito}<br>`);
    }
    return html;
  }

  // 5. MORA / CxC / COBRANZA
  if (p.includes('mora') || p.includes('cobr') || p.includes('cxc') || p.includes('cartera') || p.includes('vencid')) {
    let html = `<strong>💰 CxC & MORA — ${d.fecha||'hoy'}</strong><br><br>`;
    html += `<strong>Mora consolidada: ${d.holding_mora||'—'}</strong><br><br>`;
    const objetivo = emp ? [emp] : ['PAUNO'];
    objetivo.forEach(e => {
      const rd = ((d.empresas||{})[e]?.reportes||{}).cuentas_por_cobrar || {};
      if (!rd.kpis?.length && !rd.alerta) return;
      html += `${rd.estado==='red'?'🔴':rd.estado==='yellow'?'🟡':'🟢'} <strong>${e}:</strong> ${rd.alerta||''}<br><br>`;
      if (rd.contexto) html += `${rd.contexto}<br><br>`;
      const kpisShow = (rd.kpis||[]).filter(k => !k.label.includes('Ventas')).slice(0,5);
      kpisShow.forEach(k => {
        const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta?' (meta '+k.meta+')':''}<br>`;
      });
      if (rd.clientes_criticos?.length) {
        html += `<br><strong>Clientes prioritarios para cobranza:</strong><br>`;
        rd.clientes_criticos.forEach(c => html += `• ${c.nombre}: vencido +30d <strong>${c.vencido30}</strong> · total ${c.total}<br>`);
      }
      if (rd.acciones?.length) {
        html += `<br><strong>💡 Acciones:</strong><br>`;
        rd.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
      }
      html += '<br>';
    });
    return html;
  }

  // 5. VENTAS / MARGEN
  if (p.includes('venta') || p.includes('margen') || p.includes('ingreso') || p.includes('presupuesto') || p.includes('avance')) {
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    let html = `<strong>📈 VENTAS & MARGEN — ${d.fecha||'hoy'}</strong><br><br>`;
    objetivo.forEach(e => {
      const ed = (d.empresas||{})[e]||{};
      const mv = (ed.reportes||{}).margen_variable || (ed.reportes||{}).ventas || {};
      if (!mv.kpis?.length) return;
      html += `<strong>${e}:</strong><br>`;
      (mv.kpis||[]).slice(0,3).forEach(k => html += `&nbsp;&nbsp;• ${k.label}: <strong>${k.valor}</strong>${k.tendencia?' — '+k.tendencia:''}<br>`);
      if (mv.alerta) html += `&nbsp;&nbsp;⚠ ${mv.alerta}<br>`;
      (mv.acciones||[]).slice(0,2).forEach(a => html += `&nbsp;&nbsp;💡 ${a}<br>`);
      html += '<br>';
    });
    if (html === `<strong>📈 VENTAS & MARGEN — ${d.fecha||'hoy'}</strong><br><br>`) html += 'No hay datos de ventas disponibles en el reporte actual.';
    return html;
  }

  // 6. CxP / PROVEEDORES / PAGOS
  if (p.includes('cxp') || p.includes('pagar') || p.includes('proveedor') || p.includes('días de pago') || p.includes('pago')) {
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    let html = `<strong>🏦 CxP & PROVEEDORES — ${d.fecha||'hoy'}</strong><br><br>`;
    objetivo.forEach(e => {
      const rd = ((d.empresas||{})[e]?.reportes||{}).cuentas_por_pagar || {};
      if (!rd.kpis?.length) return;
      html += `<strong>${e}:</strong> ${rd.alerta||''}<br>`;
      (rd.kpis||[]).slice(0,2).forEach(k => html += `&nbsp;&nbsp;• ${k.label}: <strong>${k.valor}</strong> (meta ${k.meta||'—'})<br>`);
      (rd.proveedores_criticos||[]).slice(0,2).forEach(p => html += `&nbsp;&nbsp;⚠ ${p.nombre||''}: ${p.monto||p.pct||''}<br>`);
      html += '<br>';
    });
    return html;
  }

  // 6b. COMPRAS / RATIO CONSUMO
  if (p.includes('compra') || p.includes('ratio') || p.includes('consumo') || p.includes('reposición') || p.includes('materiales')) {
    const rd = ((d.empresas||{}).PAUNO?.reportes||{}).compras || {};
    const ratio = rd.kpis?.find(k => k.label.includes('Total'));
    let html = `<strong>🛒 COMPRAS — RATIO CONSUMO/COMPRA</strong><br><br>`;
    if (rd.alerta) html += `⚠️ <strong>${rd.alerta}</strong><br><br>`;
    if (rd.contexto) html += `${rd.contexto}<br><br>`;
    if (rd.kpis?.length) {
      html += `<strong>Por categoría:</strong><br>`;
      rd.kpis.forEach(k => {
        const ic = k.estado === 'red' ? '🔴' : k.estado === 'yellow' ? '🟡' : '🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong><br>`;
      });
      html += '<br>';
    }
    if (rd.acciones?.length) {
      html += `<strong>💡 Acciones inmediatas:</strong><br>`;
      rd.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html;
  }

  // 6c. PRODUCTIVIDAD / PLANILLA / KG
  if (p.includes('productividad') || p.includes('planilla') || p.includes('producción') || p.includes('eficiencia') || p.includes('rendimiento')) {
    const rd = ((d.empresas||{}).PAUNO?.reportes||{}).productividad || {};
    let html = `<strong>⚙️ PRODUCTIVIDAD PAUNO — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd.alerta) html += `✅ <strong>${rd.alerta}</strong><br><br>`;
    if (rd.contexto) html += `${rd.contexto}<br><br>`;
    if (rd.kpis?.length) {
      rd.kpis.forEach(k => {
        const ic = k.estado === 'green' ? '🟢' : k.estado === 'yellow' ? '🟡' : '⚪';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta ? ` (meta/ref: ${k.meta})` : ''}<br>`;
      });
      html += '<br>';
    }
    if (rd.acciones?.length) {
      html += `<strong>💡 Recomendaciones:</strong><br>`;
      rd.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html;
  }

  // 6d. FILL RATE
  if (p.includes('fill') || p.includes('fillrate') || p.includes('venta perdida') || p.includes('facturaci')) {
    const rd3 = ((d.empresas||{}).PAUNO?.reportes||{}).fill_rate || {};
    let html = `<strong>📦 FILL RATE — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd3.alerta) html += `${rd3.estado==='red'?'🔴':'🟡'} <strong>${rd3.alerta}</strong><br><br>`;
    if (rd3.kpis?.length) {
      rd3.kpis.forEach(k => {
        const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta ? ` (meta ${k.meta})` : ''}<br>`;
      });
    } else {
      html += 'No hay datos de Fill Rate disponibles.';
    }
    html += `<br><strong>¿Qué es el Fill Rate?</strong><br>Porcentaje de órdenes de venta que se facturaron completas. Bajo 95% indica pedidos no atendidos que generan venta perdida.`;
    return html;
  }

  // 6e. AVANCE PRESUPUESTO / CANAL
  if (p.includes('presupuesto') || p.includes('avance') || p.includes('canal') || p.includes('tradicional') || p.includes('moderno') || p.includes('horeca') || p.includes('ppto')) {
    const rd2 = ((d.empresas||{}).PAUNO?.reportes||{}).margen_variable_pag2 || {};
    let html = `<strong>🎯 AVANCE VENTAS VS PRESUPUESTO — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd2.alerta) html += `${rd2.estado==='red'?'🔴':'🟡'} <strong>${rd2.alerta}</strong><br><br>`;
    if (rd2.contexto) html += `${rd2.contexto}<br><br>`;
    if (rd2.kpis?.length) {
      html += `<strong>Por canal/marca:</strong><br>`;
      rd2.kpis.forEach(k => {
        if (k.label.includes('Presupuesto') || k.label.includes('Real')) return;
        const ic = k.estado === 'red' ? '🔴' : k.estado === 'yellow' ? '🟡' : '🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta ? ` · meta ${k.meta}` : ''}<br>`;
      });
      html += '<br>';
    }
    if (rd2.acciones?.length) {
      html += `<strong>💡 Acciones urgentes:</strong><br>`;
      rd2.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html;
  }

  // 7. MERMAS
  if (p.includes('merma') || p.includes('pérdida') || p.includes('desperdicio')) {
    const rd = ((d.empresas||{}).PAUNO?.reportes||{}).mermas || {};
    let html = `<strong>⚠️ MERMAS PAUNO — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd.alerta) html += `${rd.estado==='red'?'🔴':'🟡'} <strong>${rd.alerta}</strong><br><br>`;
    if (rd.contexto) html += `${rd.contexto}<br><br>`;
    (rd.kpis||[]).forEach(k => {
      const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
      html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta?' (meta '+k.meta+')':''}<br>`;
    });
    if (rd.acciones?.length) {
      html += `<br><strong>💡 Acciones:</strong><br>`;
      rd.acciones.slice(0,3).forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html || 'No hay datos de mermas disponibles.';
  }

  // 8. INVENTARIO / STOCK
  if (p.includes('inventario') || p.includes('stock') || p.includes('s&op') || p.includes('dead') || p.includes('cobertura')) {
    const objetivo = emp ? [emp] : ['PAUNO'];
    let html = `<strong>📦 INVENTARIO & S&OP — ${d.fecha||'hoy'}</strong><br><br>`;
    objetivo.forEach(e => {
      const ed = (d.empresas||{})[e]||{};
      const rd = (ed.reportes||{}).sop_inventario || (ed.reportes||{}).inventario || {};
      if (!rd.alerta && !rd.kpis?.length) return;
      html += `${rd.estado==='red'?'🔴':rd.estado==='yellow'?'🟡':'⚪'} <strong>${e}:</strong> ${rd.alerta||''}<br><br>`;
      if (rd.contexto) html += `${rd.contexto}<br><br>`;
      const mostrar = (rd.kpis||[]).slice(0,6);
      mostrar.forEach(k => {
        const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta?' (meta: '+k.meta+')':''}<br>`;
      });
      if (rd.categorias_criticas?.length) {
        html += `<br><strong>Categorías más críticas:</strong><br>`;
        rd.categorias_criticas.forEach(c => html += `• ${c.categoria}: Dead ${c.dead_pct} · Working ${c.working_pct}<br>`);
      }
      if (rd.acciones?.length) {
        html += `<br><strong>💡 Acciones:</strong><br>`;
        rd.acciones.slice(0,3).forEach((a,i) => html += `${i+1}. ${a}<br>`);
      }
      html += '<br>';
    });
    return html;
  }

  // 9. ANÁLISIS DE EMPRESA ESPECÍFICA
  if (emp) {
    const s = sems[emp] || 'green';
    const kpis = kpisEmpresa(emp);
    let html = `<strong>${semIcon(s)} ${emp} — ${semTxt(s)}</strong><br>`;
    html += `<span style="font-size:12px">${razones[emp]||''}</span><br><br>`;
    if (kpis.length) {
      html += `<strong>Alertas activas:</strong><br>`;
      kpis.forEach(k => {
        html += `• ${semIcon(k.estado)} ${k.reporte}: ${k.alerta||k.kpi?.label+' '+k.kpi?.valor||''}<br>`;
      });
      html += '<br>';
    }
    const escalar = (agenda.escalar_semana||[]).filter(i=>i.empresa===emp);
    if (escalar.length) {
      html += `<strong>🟡 Escalar esta semana:</strong><br>`;
      escalar.forEach(i => html += `• ${i.texto||i.text||''}<br>`);
    }
    return html;
  }

  // 10. CASH FLOW / TESORERÍA
  if (p.includes('caja') || p.includes('cash') || p.includes('tesor') || p.includes('liquidez') || p.includes('flujo') || p.includes('queda sin')) {
    if (!CASHFLOW) {
      return `🟨 <strong>Sin datos de Cash Flow</strong><br><br>El archivo <code>data/latest/cashflow.json</code> aún no existe. Para activar este módulo, el equipo financiero debe subir la proyección de caja en el formato JUANITO.<br><br><strong>Mientras tanto, señales de liquidez desde el dashboard:</strong><br>` + (() => {
        let h = '';
        ['PAUNO','AMAUTA','NEOPACK'].forEach(e => {
          const cxc = (d.empresas?.[e]?.reportes?.cuentas_por_cobrar?.kpis||[]).find(k=>(k.label||'').toLowerCase().includes('mora'));
          const cxp = (d.empresas?.[e]?.reportes?.cuentas_por_pagar?.kpis||[]).find(k=>(k.label||'').toLowerCase().includes('día'));
          if (cxc || cxp) {
            h += `<strong>${e}:</strong> `;
            if (cxc) h += `Mora ${cxc.valor} `;
            if (cxp) h += `· Días CxP ${cxp.valor}`;
            h += '<br>';
          }
        });
        return h || 'Sin datos suficientes.';
      })();
    }
    const cf = CASHFLOW;
    const fecha = cf.fecha_actualizacion || '';
    let html = `<strong>💵 CASH FLOW — ${fecha}</strong><br><br>`;
    html += `<strong>Posición actual:</strong> ${cf.caja_actual||'—'}<br>`;
    html += `<strong>Proyección 30d:</strong> <span style="color:${(cf.proyeccion_30d||'').includes('-')?'var(--red)':'var(--green)'}"><strong>${cf.proyeccion_30d||'—'}</strong></span><br>`;
    html += `<strong>Proyección 60d:</strong> ${cf.proyeccion_60d||'—'}<br><br>`;
    if (cf.alertas?.length) {
      html += `<strong>⚠️ Alertas de caja:</strong><br>`;
      cf.alertas.forEach(a => html += `• ${a}<br>`);
      html += '<br>';
    }
    if (cf.empresas) {
      html += `<strong>Por empresa:</strong><br>`;
      Object.entries(cf.empresas).forEach(([e, ed]) => {
        if (emp && emp !== e) return;
        html += `${e}: Cobros esperados ${ed.cobros_30d||'—'} · Pagos comprometidos ${ed.pagos_30d||'—'}<br>`;
        if (ed.alerta) html += `&nbsp;&nbsp;⚠ ${ed.alerta}<br>`;
      });
    }
    return html;
  }

  // 11. TENDENCIA HISTÓRICA
  if (p.includes('tendencia') || p.includes('históri') || p.includes('mes anterior') || p.includes('evolución') || p.includes('cómo viene') || p.includes('meses')) {
    if (!HISTORICO) {
      return `🟨 <strong>Sin datos históricos</strong><br><br>El archivo <code>data/historico/historico.json</code> aún no existe. Se activa cuando el sistema acumule al menos 2 meses de cierre.<br><br>Hoy solo dispongo del snapshot actual (${d.fecha||'—'}) sin comparativo histórico.`;
    }
    const h = HISTORICO;
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    let html = `<strong>📊 TENDENCIA HISTÓRICA — últimos ${h.meses?.length||0} meses</strong><br><br>`;
    objetivo.forEach(e => {
      const serie = (h.empresas?.[e]?.meses||[]);
      if (!serie.length) return;
      html += `<strong>${e}:</strong><br>`;
      ['ventas','mora','margen'].forEach(kpi => {
        const vals = serie.map(m => m[kpi]).filter(v => v !== undefined && v !== null);
        if (!vals.length) return;
        const labels = serie.map(m => m.mes||'');
        const trend = vals.length >= 2 ? (vals[vals.length-1] > vals[0] ? '↑' : vals[vals.length-1] < vals[0] ? '↓' : '→') : '—';
        html += `&nbsp;&nbsp;${kpi.charAt(0).toUpperCase()+kpi.slice(1)}: `;
        html += serie.map((m,i) => `${m.mes} ${vals[i]}`).join(' → ');
        html += ` ${trend}<br>`;
      });
      html += '<br>';
    });
    return html;
  }

  // 12. ESCALAR / AGENDA SEMANA
  if (p.includes('escal') || p.includes('semana') || p.includes('monitorear')) {
    const items = agenda.escalar_semana || [];
    const mon   = agenda.monitorear || [];
    let html = '';
    if (items.length) {
      html += `<strong>🟡 ESCALAR ESTA SEMANA (${items.length}):</strong><br><br>`;
      items.forEach((i,n) => html += `${n+1}. ${i.texto||i.text||''} <span style="font-size:11px;color:var(--text3)">${i.empresa||''}</span><br><br>`);
    }
    if (mon.length) {
      html += `<strong>🔵 MONITOREAR (${mon.length}):</strong><br><br>`;
      mon.forEach((i,n) => html += `${n+1}. ${i.texto||i.text||''} <span style="font-size:11px;color:var(--text3)">${i.empresa||''}</span><br>`);
    }
    return html || 'No hay items en la agenda de la semana.';
  }

  // FALLBACK: resumen general
  let html = `<strong>📊 HOLDING — ${d.fecha||'hoy'}</strong><br><br>`;
  html += `Ventas: <strong>${d.holding_ventas||'—'}</strong> · Mora: <strong style="color:var(--red)">${d.holding_mora||'—'}</strong><br><br>`;
  Object.entries(sems).forEach(([e,s]) => {
    html += `${semIcon(s)} <strong>${e}:</strong> ${razones[e]||semTxt(s)}<br>`;
  });
  html += '<br>Puedes preguntarme sobre: mora, ventas, margen, CxP, mermas, inventario, o el análisis de una empresa específica.';
  return html;
}

function datosAntiguedad() {
  const fecha = DATA?.fecha || RISK_REGISTER?.fecha_actualizacion || '';
  if (!fecha) return null;
  const ms = Date.now() - new Date(fecha).getTime();
  return Math.floor(ms / 86400000);
}

function bannerFrescura() {
  const dias = datosAntiguedad();
  if (dias === null) return '';
  if (dias > 14) return `<div style="background:#7f1d1d;color:#fca5a5;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">⛔ Datos con <strong>${dias} días</strong> de antigüedad — validar antes de tomar decisiones.</div>`;
  if (dias > 7)  return `<div style="background:#78350f;color:#fcd34d;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">⚠️ Datos con <strong>${dias} días</strong> de antigüedad — confirmar con equipo.</div>`;
  return `<div style="background:#052e16;color:#86efac;padding:6px 12px;border-radius:6px;margin-bottom:10px;font-size:11px">🟦 Datos al ${DATA?.fecha||''} — fuente confirmada.</div>`;
}

// Cuánto de lo que se muestra viene de una consulta del reporte y cuánto no.
// Es el número que responde "¿está todo validado?" sin creerle a nadie: lo
// calcula la extracción comparando cada cifra contra lo que devolvió el
// sondeo genérico, que es el camino sin filtros y por tanto el no verificado.
function bannerCobertura() {
  const c = DATA?.cobertura;
  const t = DATA?.validacion_tarjetas;
  if (!c && !t) return '';
  const partes = [];
  if (c && c.kpis_totales) {
    partes.push(`<b>${c.kpis_del_reporte} de ${c.kpis_totales}</b> cifras ` +
      `salen de una consulta del reporte (${c.pct}%)`);
  }
  if (t) {
    const n = (t.distintas || []).length;
    partes.push(n === 0
      ? `<b>${t.iguales}</b> comparadas contra la tarjeta de Power BI: todas iguales`
      : `<b>${n}</b> difieren de la tarjeta de Power BI`);
  }
  const mal = (DATA?.validacion?.no_cuadran || []).length
            + ((DATA?.validacion_tarjetas?.distintas || []).length);
  const fondo = mal ? 'var(--yellow-bg)' : 'var(--green-bg)';
  const borde = mal ? 'var(--yellow)' : 'var(--green)';
  return `<div style="background:${fondo};border-left:3px solid ${borde};
      padding:7px 11px;border-radius:6px;margin-bottom:10px;font-size:11.5px;
      color:var(--text)">${partes.join(' · ')}</div>`;
}

function crossCheckMora() {
  if (!RISK_REGISTER || !DATA) return '';
  const alertas = [];
  ['PAUNO','AMAUTA','NEOPACK'].forEach(e => {
    const moraSummary = parseFloat(((DATA.empresas?.[e]?.reportes?.cuentas_por_cobrar?.kpis||[]).find(k=>(k.label||'').toLowerCase().includes('mora'))?.valor||'0').replace('%','').replace(',','.'));
    const riesgos = RISK_REGISTER.empresas?.[e]?.riesgos || [];
    const moraRiesgo = parseFloat((riesgos.find(r=>(r.riesgo||'').toLowerCase().includes('mora'))?.senal_temprana||'0').match(/(\d+)%/)?.[1]||0);
    if (moraSummary && moraRiesgo && Math.abs(moraSummary - moraRiesgo) > 2) {
      alertas.push(`• ${e}: mora dashboard ${moraSummary}% vs risk register ${moraRiesgo}% — diferencia de ${Math.abs(moraSummary-moraRiesgo).toFixed(1)}pp`);
    }
  });
  if (!alertas.length) return '';
  return `<div style="background:#1e1b4b;color:#c4b5fd;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">⚡ <strong>Inconsistencia detectada (mora):</strong><br>${alertas.join('<br>')}<br><span style="font-size:11px">Validar qué fuente es la actualizada.</span></div>`;
}

const JUANITO_AI_WORKER_URL = 'https://autumn-boat-225d.rgarciaa78.workers.dev';

// Llama al Worker (Gemini) con el contexto real del dashboard. Devuelve null si falla
// (sin internet, Worker caído, clave inválida, etc.) para poder usar el fallback local.
// Motivo del último fallo de la IA, para poder decirlo en pantalla en vez de
// caer a una plantilla como si nada hubiera pasado.
let ultimoFalloIA = null;

async function preguntarJuanitoIA(pregunta) {
  ultimoFalloIA = null;
  const cuerpo = JSON.stringify({
    pregunta,
    contexto: construirContexto(),
    historial: chatHistorial.slice(-6)
  });

  // El Worker desplegado tiene una lista de modelos de respaldo que ya no
  // existen: cuando el principal se satura un instante, cae a uno muerto y
  // devuelve 404. Es transitorio —basta que el principal se libere— así que
  // se insiste más de lo normal. Cuando se despliegue el Worker corregido
  // esto dejará de hacer falta, pero no estorba.
  for (let intento = 1; intento <= 6; intento++) {
    try {
      const resp = await fetch(JUANITO_AI_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: cuerpo
      });
      if (resp.ok) {
        const data = await resp.json();
        if (data.respuesta) return data.respuesta;
        ultimoFalloIA = 'El servicio respondió vacío.';
      } else {
        let detalle = '';
        try {
          const err = await resp.json();
          detalle = err.detalle || err.error || '';
        } catch (_) { /* respuesta no JSON */ }
        // El 404 de 'no longer available' viene del modelo de respaldo, no del
        // principal: significa que el principal estaba ocupado en ese instante.
        // Reintentar sirve, aunque el código de error no lo sugiera.
        const transitorio = /UNAVAILABLE|high demand|503|overload|no longer available/i.test(detalle)
                            || resp.status === 502 || resp.status === 503;
        ultimoFalloIA = transitorio
          ? 'El modelo de IA estaba ocupado.'
          : `El servicio de IA respondió con error ${resp.status}.`;
        if (!transitorio) break;     // un error que no es transitorio no se arregla reintentando
      }
    } catch (e) {
      ultimoFalloIA = 'No se pudo conectar con el servicio de IA.';
    }
    if (intento < 6) await new Promise(r => setTimeout(r, Math.min(intento * 1500, 5000)));
  }
  console.warn('Juanito IA no disponible:', ultimoFalloIA);
  return null;
}

async function sendJuanito() {
  const input = document.getElementById('juanito-input');
  const text = input.value.trim();
  if (!text || !DATA) return;
  input.value = '';
  input.style.height = 'auto';
  addJuanitoMsg('user', text);
  chatHistorial.push({ rol: 'user', texto: text });

  const send = document.getElementById('juanito-send');
  send.disabled = true;

  // Indicador de escritura animado
  const loadEl = addJuanitoMsg('assistant', '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>');
  loadEl.classList.add('loading');

  // El analizador local va PRIMERO. Responde al instante con los mismos
  // datos que vería la IA, así que cuando sabe contestar no tiene sentido
  // hacer esperar al usuario por un servicio externo que además puede fallar.
  let cuerpo = analizarLocal(text);

  if (!cuerpo) {
    // Solo si el analizador no reconoce la pregunta se recurre a la IA, que
    // es la que puede razonar sobre lo que no está tabulado.
    const iaResp = await preguntarJuanitoIA(text);
    if (iaResp) {
      cuerpo = iaResp;
    } else {
      const local = buscarRespuestaLocal(text);
      cuerpo = (local ? local.replace(/\n/g, '<br>') : analizarConJuanito(text));
    }
  }

  // Solo mostrar banner y crosscheck en la primera respuesta de la sesión
  const esPrimera = chatHistorial.filter(m => m.rol === 'assistant').length === 0;
  const prefijo = esPrimera ? bannerFrescura() + bannerCobertura() + crossCheckMora() : '';

  const chipsHtml = '';

  loadEl.innerHTML = prefijo + cuerpo + chipsHtml;
  loadEl.classList.remove('loading');
  chatHistorial.push({ rol: 'assistant', texto: cuerpo.replace(/<[^>]*>/g,'').substring(0, 200) });
  send.disabled = false;

  // Scroll al último mensaje
  const msgs = document.getElementById('juanito-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

// Contexto compacto — solo datos clave, sin tendencias históricas largas
function construirContexto() {
  const d = DATA;
  const obj = {
    // Guía para el modelo: sin esto tiende a responder solo con los KPIs del
    // mes y a ignorar las series, que son las que permiten decir de DÓNDE
    // viene un problema y desde CUÁNDO.
    _guia: {
      que_hay: 'KPIs del último mes, desgloses por segmento y series mensuales completas.',
      como_responder: [
        'Para "por qué" o "de dónde viene": busca en desgloses (por_cliente, por_uen, por_area, dead_por_categoria, tramos, faltantes) y en series por segmento.',
        'Para "desde cuándo" o "cómo viene": recorre la serie mensual y di en qué mes cambió la tendencia.',
        'Compara segmentos entre sí antes de dar un promedio: el promedio esconde al que está mal.',
        'Cita siempre el mes de cada cifra. Los períodos están en series.periodos, alineados por posición con cada array.',
        'Si un KPI trae meta, di la brecha en puntos o en soles, no solo el valor.'
      ],
      limites: [
        'No inventes cifras que no estén aquí. Si falta el dato, dilo.',
        'Un KPI con fuente distinta de "reporte" no está contrastado contra Power BI: avísalo si lo usas.',
        'Revisa avisos_datos antes de afirmar que algo es actual.'
      ],
      // Sin esto el modelo responde cualquier cosa: por debajo es un modelo
      // general. El riesgo grave no es que hable de fútbol, es que conteste
      // una pregunta de negocio con conocimiento genérico —promedios de la
      // industria, supuestos razonables— en vez de con estos datos, y suene
      // igual de convincente.
      alcance: {
        responde: 'Solo preguntas sobre el holding (PAUNO, AMAUTA, NEOPACK) que puedan contestarse con los datos de este contexto: KPIs, series, desgloses y alertas.',
        fuera_de_alcance: 'Si la pregunta no se puede responder con estos datos —conocimiento general, otras empresas, temas ajenos al negocio, cálculos que requieran información que no está aquí— dilo en una frase y ofrece la pregunta más cercana que sí puedas responder. No respondas de memoria.',
        prohibido: 'Nunca completes un dato faltante con promedios de industria, benchmarks o supuestos. Si el dato no está en el contexto, la respuesta correcta es que no está.'
      }
    },
    fecha: d.fecha,
    verificacion: d.verificacion,
    semaforos: d.semaforos,
    semaforo_razon: d.semaforo_razon,
    holding_ventas: d.holding_ventas,
    holding_mora: d.holding_mora,
    agenda_ceo: d.agenda_ceo,
    empresas: {}
  };

  Object.entries(d.empresas || {}).forEach(([emp, ed]) => {
    obj.empresas[emp] = { reportes: {} };
    Object.entries(ed.reportes || {}).forEach(([tipo, rd]) => {
      obj.empresas[emp].reportes[tipo] = {
        estado: rd.estado,
        alerta: rd.alerta,
        kpis: rd.kpis,
        acciones: (rd.acciones || []).slice(0, 3),
        riesgos: (rd.riesgos || []).slice(0, 3),
        proveedores_criticos: (rd.proveedores_criticos || []).slice(0, 5),
        tramos: rd.tramos,
        por_gerente: rd.por_gerente,
        por_uen: rd.por_uen,
        por_canal: rd.por_canal,
        por_planta: rd.por_planta,
        cumplimiento_produccion: rd.cumplimiento_produccion,
        faltantes: rd.faltantes,
        por_cliente: rd.por_cliente,
        por_area: rd.por_area,
        planes_por_planta: rd.planes_por_planta,
        necesidad_compra: rd.necesidad_compra,
        por_marca: rd.por_marca,
        por_grupo: rd.por_grupo,
        dead_por_categoria: rd.dead_por_categoria,
        working_por_categoria: rd.working_por_categoria,
        por_categoria: rd.por_categoria
      };
    });
  });

  // ── Series mensuales. Antes se excluían "para reducir tamaño", y esa era la
  // razón de que el chat no pudiera responder de dónde viene un problema ni
  // desde cuándo. Comprimidas ocupan ~6 KB: redondear los enteros y recortar
  // los nulos del final basta.
  if (typeof SERIES !== 'undefined' && SERIES && SERIES.datasets) {
    const compactar = arr => {
      let fin = arr.length;
      while (fin > 0 && arr[fin - 1] == null) fin--;
      return arr.slice(0, fin).map(x =>
        x == null ? null : (Math.abs(x) < 10 ? Number(x.toFixed(4)) : Math.round(x)));
    };
    const ds = {};
    Object.entries(SERIES.datasets).forEach(([nombre, ss]) => {
      ds[nombre] = {};
      Object.entries(ss).forEach(([k, v]) => {
        if (Array.isArray(v)) ds[nombre][k] = compactar(v);
      });
    });
    obj.series = {
      periodos: SERIES.periodos,
      nota: 'Cada array está alineado por posición con periodos. null = mes sin dato.',
      datasets: ds
    };
    // Qué dataset alimenta a qué reporte, para que el modelo no tenga que
    // adivinar dónde buscar la serie de un reporte.
    obj.series.mapa_reporte_dataset = {
      cuentas_por_cobrar: 'cxc', cuentas_por_pagar: 'cxp',
      margen_variable: 'margen', mermas: 'mermas', compras: 'compras',
      sop_inventario: 'inventario', fill_rate: 'fill_rate',
      consumo_materiales: 'consumo', productividad: 'productividad',
      margen_variable_pag2: 'planificacion'
    };
  }

  // ── Avisos: datos viejos y cifras sin contrastar. Sin esto el modelo
  // presenta como actual un número de hace más de un año.
  const avisos = [];
  if (obj.series) {
    const hoy = new Date();
    Object.entries(obj.series.datasets).forEach(([ds, ss]) => {
      let ultimo = null;
      Object.values(ss).forEach(arr => {
        for (let i = arr.length - 1; i >= 0; i--)
          if (arr[i] != null) {
            const p = obj.series.periodos[i];
            if (!ultimo || p > ultimo) ultimo = p;
            break;
          }
      });
      if (!ultimo) return;
      const [a, m] = ultimo.split('-').map(Number);
      const meses = (hoy.getFullYear() - a) * 12 + (hoy.getMonth() + 1 - m);
      if (meses > 2) avisos.push(
        `${ds}: último dato ${ultimo}, hace ${meses} meses — NO es la situación actual.`);
    });
  }
  Object.entries(d.empresas || {}).forEach(([emp, ed]) => {
    Object.entries(ed.reportes || {}).forEach(([tipo, rd]) => {
      (rd.kpis || []).forEach(k => {
        if (k.fuente && k.fuente !== 'reporte')
          avisos.push(`${tipo}/${k.label}: no contrastado contra Power BI.`);
      });
    });
  });
  if (avisos.length) obj.avisos_datos = avisos;

  return JSON.stringify(obj);
}
