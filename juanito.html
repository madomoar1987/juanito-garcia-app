// ── Navegación interna del dashboard ───────────────────────────────────────
// ═══ Avance del mes ═══════════════════════════════════════════════════════
//
// Responde una sola pregunta: ¿el ritmo alcanza para llegar a la meta?
//
// Se alimenta solo de series.json y data/metas.json. No necesita consultas
// nuevas contra Power BI: las series ya llegan hasta el mes en curso desde
// que build_periodos() dejó de cortar en el mes anterior.

// Metas que el usuario editó y todavía no están publicadas en el repositorio.
// La app las usa igual y las marca, para que se vea qué es oficial y qué no.
const METAS_BORRADOR = 'juanito.metas.borrador';

function metasBorrador() {
  try { return JSON.parse(localStorage.getItem(METAS_BORRADOR) || '{}'); }
  catch (e) { return {}; }
}

function guardarMetaBorrador(clave, valor) {
  try {
    const b = metasBorrador();
    if (valor === null) delete b[clave]; else b[clave] = valor;
    localStorage.setItem(METAS_BORRADOR, JSON.stringify(b));
    return true;
  } catch (e) { return false; }
}

// Días del mes en curso y cuánto se lleva recorrido: la vara del ritmo.
function avanceDelMes() {
  const per = mesParcial();
  if (!per) return null;
  const [a, m] = per.split('-').map(Number);
  const dias = new Date(a, m, 0).getDate();
  const hoy = new Date();
  // Si el mes parcial no es el corriente (dato de ayer, fin de semana), el
  // día que vale es el último del que hay dato, no el de hoy.
  const dia = (hoy.getFullYear() === a && hoy.getMonth() + 1 === m)
    ? hoy.getDate() : dias;
  return { periodo: per, anio: a, mes: m, dias, dia, fraccion: dia / dias };
}

// Valor del mes en curso y del último mes cerrado, de una serie.
function valoresDe(ind) {
  const per = periodos();
  const arr = serieDe(ind.serie);
  if (!arr) return null;
  const idx = (p) => per.indexOf(p);
  const iCurso = idx(mesParcial());
  const iCerrado = idx(mesCerrado());
  const prev = per[per.indexOf(mesCerrado()) - 1];
  return {
    curso:   iCurso   >= 0 ? arr[iCurso]   : null,
    cerrado: iCerrado >= 0 ? arr[iCerrado] : null,
    previo:  prev ? arr[idx(prev)] : null,
    serie: arr,
  };
}

// Escala: las series guardan los porcentajes como fracción (0.029 = 2.9%).
function escalaMeta(ind, v) {
  if (v == null) return null;
  return (ind.unidad === 'pct' || ind.unidad === 'ratio') ? v * 100 : v;
}

function fmtMeta(ind, v) {
  if (v == null) return null;
  if (ind.unidad === 'pct')   return (v * 100).toFixed(v * 100 < 10 ? 2 : 1) + '%';
  if (ind.unidad === 'ratio') return (v * 100).toFixed(0) + '%';
  if (ind.unidad === 'dias')  return v.toFixed(0) + ' d';
  if (ind.unidad === 'kg')    return (v / 1e6).toFixed(2) + 'M kg';
  if (Math.abs(v) >= 1e6)     return 'S/' + (v / 1e6).toFixed(2) + 'M';
  if (Math.abs(v) >= 1000)    return 'S/' + Math.round(v).toLocaleString('es-PE');
  return 'S/' + v.toFixed(3);
}

// Distancia a la meta, con el signo que corresponde a cada indicador.
function distanciaMeta(ind, valor, meta) {
  if (valor == null || meta == null) return null;
  const d = escalaMeta(ind, valor) - escalaMeta(ind, meta);
  const bien = ind.direccion === 'menor' ? d <= 0 : d >= 0;
  const u = (ind.unidad === 'pct' || ind.unidad === 'ratio') ? ' pp'
          : (ind.unidad === 'dias' ? ' d' : '');
  let txt;
  if (ind.unidad === 'soles' || ind.unidad === 'kg') {
    txt = (d >= 0 ? '+' : '−') + fmtMeta(ind, Math.abs(d));
  } else {
    txt = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(Math.abs(d) < 10 ? 2 : 1) + u;
  }
  return { d, bien, txt };
}

// Comparación contra el mes anterior.
//
// El triángulo apunta según MEJORA, no según el signo del número: si la merma
// sube, empeora. Por eso el número va sin signo — "▼ +24.9%" se lee como una
// contradicción, con la flecha bajando y el número subiendo. La flecha y el
// color dicen si va bien; el número, cuánto se movió.
function triangulo(ind, act, ant) {
  if (act == null || ant == null || !ant) return null;
  const d = act - ant;
  const rel = Math.abs(d / ant);
  if (rel < 0.02) return { cls: 't-igual', txt: 'sin cambio' };
  const mejora = ind.direccion === 'menor' ? d < 0 : d > 0;
  return {
    cls: mejora ? 't-mejor' : 't-peor',
    txt: (rel * 100).toFixed(1) + '%',
  };
}

// Línea de la serie: 13 meses, con el último punto del color del veredicto.
function chispaSerie(arr, color) {
  const v = (arr || []).filter(x => x != null).slice(-13).map(Math.abs);
  if (v.length < 3) return '<span class="av-vacio">serie corta</span>';
  const W = 86, H = 26, P = 3;
  const lo = Math.min(...v), hi = Math.max(...v), r = (hi - lo) || 1;
  const pts = v.map((x, i) => [P + i * (W - 2 * P) / (v.length - 1),
                               H - P - (x - lo) / r * (H - 2 * P)]);
  const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const f = pts[pts.length - 1];
  return `<svg class="av-chispa" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    role="img" aria-label="${v.length} meses"><path d="${d}"/>
    <circle cx="${f[0].toFixed(1)}" cy="${f[1].toFixed(1)}" r="2.6" fill="${color}"/></svg>`;
}

// Editar una meta. Se guarda en el navegador y se marca como sin publicar:
// la oficial es la de data/metas.json, que queda con historial en el
// repositorio. Esto permite probar un número hoy sin esperar una publicación.
function avanceAbrir(clave) {
  const c = document.getElementById('seg-' + clave);
  const f = document.getElementById('fl-' + clave);
  if (!c) return;
  c.hidden = !c.hidden;
  if (f) f.textContent = c.hidden ? '\u25b8' : '\u25be';
}

function editarMeta(clave) {
  const ind = (METAS?.indicadores || []).find(i => i.clave === clave);
  if (!ind) return;
  const borr = metasBorrador();
  const actual = Object.prototype.hasOwnProperty.call(borr, clave) ? borr[clave] : ind.meta;
  const pista = {
    pct:   'en porcentaje, ej. 52 para 52%',
    ratio: 'en porcentaje, ej. 100 para 100%',
    dias:  'en días, ej. 90',
    soles: 'en soles, ej. 500000',
    kg:    'en kilos, ej. 1300000',
  }[ind.unidad] || '';
  const previo = actual == null ? '' :
    ((ind.unidad === 'pct' || ind.unidad === 'ratio') ? (actual * 100) : actual);
  const txt = prompt(`Meta de ${ind.label}\n(${pista})\n\n` +
    `Deja vacío para quitarla. Conviene que baje: ` +
    `${ind.direccion === 'menor' ? 'sí' : 'no'}.`, previo);
  if (txt === null) return;
  let v = null;
  if (txt.trim() !== '') {
    v = parseFloat(txt.replace(/[^0-9.,-]/g, '').replace(',', '.'));
    if (isNaN(v)) { alert('No entendí ese número.'); return; }
    if (ind.unidad === 'pct' || ind.unidad === 'ratio') v = v / 100;
  }
  guardarMetaBorrador(clave, v);
  dxpTab('avance');
}

// Las metas sin publicar se ven solo en este equipo. Esto arma el texto que
// hay que pegar en data/metas.json para que valgan para todos.
function exportarMetas() {
  const borr = metasBorrador();
  const lineas = Object.entries(borr).map(([k, v]) => {
    const ind = (METAS?.indicadores || []).find(i => i.clave === k);
    return `  ${k}  →  ${v == null ? 'sin meta' : fmtMeta(ind || {unidad:'soles'}, v)}`;
  }).join('\n');
  alert('Metas que pusiste y aún no están publicadas:\n\n' + lineas +
    '\n\nPara que las vea todo el mundo hay que grabarlas en data/metas.json ' +
    'del repositorio. Pásale esta lista a quien publica y quedan con ' +
    'historial de quién las cambió y cuándo.');
}

// Filas hijas de un indicador: sus unidades de negocio, plantas o categorías.
// Ver que la merma esta sobre meta no dice donde actuar; ver que TIGO va en
// 4.49% y B&D en 1.34% si.
function avanceSegmentos(ind, meta, pct) {
  const segs = ind.segmentos || [];
  if (!segs.length) return '';
  const filas = segs.map(([nombre, par, unidad, direccion]) => {
    const arr = serieDe(par);
    if (!arr) return '';
    // Un segmento puede medir otra cosa que su indicador: el costo unitario
    // por UEN va en soles aunque el margen sea un porcentaje.
    const fmt = (unidad || direccion)
      ? Object.assign({}, ind, unidad ? { unidad } : {}, direccion ? { direccion } : {})
      : ind;
    const per = periodos();
    const iC = per.indexOf(mesParcial());
    const iX = per.indexOf(mesCerrado());
    const prev = per[iX - 1];
    const curso = iC >= 0 ? arr[iC] : null;
    const cerrado = iX >= 0 ? arr[iX] : null;
    const previo = prev ? arr[per.indexOf(prev)] : null;

    // La distancia a la meta solo aplica si el segmento mide lo mismo que su
    // indicador: el margen de TIGO sí se compara contra la meta de margen, el
    // costo unitario de TIGO no.
    const mismaUnidad = !unidad || unidad === ind.unidad;
    const dist = mismaUnidad ? distanciaMeta(fmt, curso, meta) : null;
    // Con `fmt`, no con `ind`: el costo unitario mejora cuando baja.
    const tri = ind.tipo === 'acumula'
      ? triangulo(fmt, cerrado, previo)
      : triangulo(fmt, curso, cerrado);
    const col = dist ? (dist.bien ? 'var(--green)' : 'var(--red)') : 'var(--text3)';

    // Análisis de la unidad de negocio. El segmento no tiene columna "Lectura"
    // propia, así que el botón va donde estaría: al final de su fila.
    const an = analisisDe(ind, meta, nombre);
    const anId = 'an-' + ind.clave + '-' + nombre.replace(/[^A-Za-z0-9]/g, '');
    const cae = tri && tri.cls === 't-peor';
    const lectura = an
      ? `<span class="av-ver ${cae ? 'av-mal' : 'av-na'} av-ver-link"
           onclick="avanceAnalisis(event,'${anId}')"
           title="Abre el análisis escrito de ${esc(nombre)}"
           >${cae ? 'Cae · ver análisis' : 'Ver análisis'}</span>`
      : '';
    return `<tr class="av-seg">
      <td class="av-seg-n">${esc(nombre)}</td>
      <td></td>
      <td class="av-cerrado">${cerrado == null ? '' : esc(fmtMeta(fmt, cerrado))}</td>
      <td class="av-num">${curso == null
        ? '<span class="av-vacio">—</span>' : esc(fmtMeta(fmt, curso))}</td>
      <td>${tri ? `<span class="av-tri ${tri.cls}"><i></i>${tri.txt}</span>` : ''}</td>
      <td>${dist ? `<span class="av-num" style="color:${col}">${dist.txt}</span>` : ''}</td>
      <td>${chispaSerie(arr, col)}</td>
      <td>${lectura}</td>
    </tr>
    ${an ? avAnalisisHTML(an, anId) : ''}`;
  }).join('');
  const nota = ind.segmentos_nota
    ? `<tr class="av-seg"><td colspan="8" class="av-seg-nota">${esc(ind.segmentos_nota)}</td></tr>`
    : '';
  return nota + filas;
}

// Nombre corto del mes cerrado ("agosto"), para encabezar su columna. Ver
// "−4.0%" sin la cifra de contra qué obliga a ir a buscarla a otra pantalla.
const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio',
                  'agosto','setiembre','octubre','noviembre','diciembre'];

function nombreMes(periodo) {
  if (!periodo) return '';
  return MESES_ES[parseInt(periodo.slice(5, 7), 10) - 1] || periodo;
}

function nombreMesCerrado() {
  return nombreMes(mesCerrado()) || 'mes anterior';
}

// ─────────────────────────────────────────────────────────────────────────────
// ANÁLISIS ESCRITO DE UNA FILA
//
// La columna "Lectura" dice si un indicador está bien o mal. Eso no basta para
// decidir: saber que el margen cae no dice a quién llamar. Estas funciones
// arman, con los datos de la corrida, el diagnóstico y las tablas de detalle
// que sí dicen dónde poner la semana.
//
// Regla que se respeta en todo el bloque: si un corte no existe en Power BI,
// se dice, no se inventa. Clientes y productos vienen de toda la empresa —
// no están partidos por unidad de negocio — y donde se muestran dentro de una
// UEN se avisa en la misma pantalla.
// ─────────────────────────────────────────────────────────────────────────────

function avReporte(clave) {
  return (DATA && DATA.empresas && DATA.empresas.PAUNO &&
          DATA.empresas.PAUNO.reportes && DATA.empresas.PAUNO.reportes[clave]) || {};
}

// "43.5%" → 43.5 · "S/4.64M" → 4640000 · null si no hay número.
function avNum(s) {
  if (s == null) return null;
  if (typeof s === 'number') return isFinite(s) ? s : null;
  const n = localNum(s);
  return (n == null || !isFinite(n)) ? null : n;
}

// Etiqueta del período de un bloque. Si el dato no es del mes en curso hay
// que decirlo en el mismo renglón del título: la tabla de clientes venía de
// julio mientras el resto del análisis hablaba de setiembre.
function avPeriodoEtiqueta(periodo) {
  const curso = mesParcial();
  if (!periodo) return '<span class="av-an-mes av-an-mes-ojo">mes sin confirmar</span>';
  const nom = nombreMes(periodo);
  if (periodo !== curso) {
    return `<span class="av-an-mes av-an-mes-ojo">${esc(nom)} — no es el mes en curso</span>`;
  }
  // El mes en curso va siempre con su fecha de corte: "setiembre" a secas
  // invita a leerlo como el mes completo, y son trece días.
  const m = avanceDelMes();
  return `<span class="av-an-mes">${esc(nom)}${m ? ' · al día ' + m.dia : ''}</span>`;
}

// "setiembre al día 13 de 30" — la vara contra la que se lee todo el panel.
function avCorteTexto() {
  const m = avanceDelMes();
  const nom = nombreMes(mesParcial()) || '';
  return m ? `${nom} al día ${m.dia} de ${m.dias}` : nom;
}

function avPP(x, dec) {
  if (x == null) return '—';
  const d = dec == null ? 2 : dec;
  return (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d) + ' pp';
}

// fmtMeta redondea a tres decimales por debajo de S/1000, que sirve para un
// costo unitario en una celda pero se lee mal en una frase: "S/15.536".
function avSoles(v) {
  if (v == null) return '—';
  return Math.abs(v) >= 1000 ? fmtMeta({unidad: 'soles'}, v) : 'S/' + v.toFixed(2);
}

function avPct(x, dec) {
  if (x == null) return '—';
  return (x * 100).toFixed(dec == null ? 1 : dec) + '%';
}

// Valor del mes en curso y del cerrado de una serie suelta (no de un indicador).
function avSerie(par) {
  const arr = serieDe(par);
  if (!arr) return null;
  const per = periodos();
  const iC = per.indexOf(mesParcial()), iX = per.indexOf(mesCerrado());
  return {
    arr,
    curso:   iC >= 0 ? arr[iC] : null,
    cerrado: iX >= 0 ? arr[iX] : null,
  };
}

// ── Mecanismo del margen de una unidad de negocio.
//
// El margen no baja solo: baja porque el precio cae más rápido que el costo, o
// porque el costo sube más rápido que el precio. Saber cuál de las dos es lo
// que decide si la conversación es con comercial o con producción.
//
// El precio implícito es derivado: costo unitario / (1 − margen). Se marca como
// tal en pantalla, porque el reporte no lo publica.
function avMecanismoUEN(nombre) {
  const mg = avSerie(['margen', '% Margen ' + nombre]);
  const co = avSerie(['margen', 'Costo unitario ' + nombre]);
  if (!mg || !co) return null;
  const m0 = mg.cerrado, m1 = mg.curso, c0 = co.cerrado, c1 = co.curso;
  if (m0 == null || m1 == null || c0 == null || c1 == null) return null;
  if (!c0 || m0 >= 1 || m1 >= 1) return null;
  const p0 = c0 / (1 - m0), p1 = c1 / (1 - m1);
  if (!p0) return null;
  return {
    m0, m1, c0, c1, p0, p1,
    dMargen: (m1 - m0) * 100,            // puntos de margen
    dCosto: (c1 - c0) / c0 * 100,        // % de variación
    dPrecio: (p1 - p0) / p0 * 100,
    serieMargen: mg.arr, serieCosto: co.arr,
  };
}

function avTextoMecanismo(nombre, m) {
  const cae = m.dMargen < 0;
  const fCosto = Math.abs(m.dCosto).toFixed(1) + '%';
  const fPrecio = Math.abs(m.dPrecio).toFixed(1) + '%';
  const vCosto = m.dCosto < 0 ? 'bajó' : 'subió';
  const vPrecio = m.dPrecio < 0 ? 'bajó' : 'subió';
  const brecha = Math.abs(m.dPrecio - m.dCosto).toFixed(1);
  const tesis = `El costo ${vCosto} ${fCosto}. El precio ${vPrecio} ${fPrecio}. ` +
    (cae ? 'Ahí está la caída.' : 'Por eso el margen sube.');
  let cuerpo;
  if (cae && m.dCosto < 0 && m.dPrecio < m.dCosto) {
    cuerpo = `No es producción: el costo unitario mejoró de ${avSoles(m.c0)} ` +
      `a ${avSoles(m.c1)}. ${esc(nombre)} vendió más barato de lo que se ` +
      `abarató, y esa brecha de ${brecha} puntos son los ${Math.abs(m.dMargen).toFixed(1)} ` +
      `puntos de margen perdidos. La conversación es comercial, no de planta.`;
  } else if (cae && m.dCosto > 0) {
    cuerpo = `El costo unitario pasó de ${avSoles(m.c0)} a ` +
      `${avSoles(m.c1)} y el precio no lo siguió. Aquí la ` +
      `conversación empieza en producción y en compras.`;
  } else if (!cae && m.dCosto < 0) {
    cuerpo = `El abaratamiento se quedó en la empresa en vez de trasladarse al precio: ` +
      `${Math.abs(m.dMargen).toFixed(1)} puntos de margen ganados.`;
  } else {
    cuerpo = `El margen se movió ${Math.abs(m.dMargen).toFixed(1)} puntos entre ` +
      `${nombreMesCerrado()} y ${nombreMes(mesParcial())}.`;
  }
  return { tesis, cuerpo };
}

// ── Volatilidad del precio implícito.
//
// Un precio que sube y baja 20% mes a mes no es una decisión de precios: es la
// mezcla de lo que se vendió cambiando. Distinguirlo antes de ir a comercial
// evita una conversación equivocada.
function avVolatilidad(nombre) {
  const mg = serieDe(['margen', '% Margen ' + nombre]);
  const co = serieDe(['margen', 'Costo unitario ' + nombre]);
  if (!mg || !co) return null;
  const p = [];
  for (let i = 0; i < mg.length; i++) {
    if (mg[i] == null || co[i] == null || mg[i] >= 1) continue;
    p.push(co[i] / (1 - mg[i]));
  }
  const ult = p.slice(-6);
  if (ult.length < 4) return null;
  let saltos = 0;
  for (let i = 1; i < ult.length; i++) {
    if (ult[i - 1] && Math.abs(ult[i] - ult[i - 1]) / ult[i - 1] > 0.10) saltos++;
  }
  const lo = Math.min(...ult), hi = Math.max(...ult);
  return { saltos, lo, hi, n: ult.length,
           inestable: saltos >= 2 && lo && (hi - lo) / lo > 0.20 };
}

// ── Clientes que arrastran el margen.
//
// El impacto es la diferencia del cliente contra el margen de la empresa,
// pesada por cuánto vende: un cliente con 30% de margen que compra el 0.2% no
// explica nada, y encabezaría la lista si se ordenara por margen.
function avBloqueClientes() {
  const mv = avReporte('margen_variable');
  const cli = mv.por_cliente || [];
  if (cli.length < 3) return null;
  const kMg = (mv.kpis || []).find(k => k.label === 'Margen variable');
  const mgEmpresa = kMg ? avNum(kMg.valor) : null;
  if (mgEmpresa == null) return null;

  const filas = cli.map(c => {
    const m = avNum(c.margen), w = avNum(c.pct_venta);
    return { nombre: c.cliente, venta: c.venta, pct: w, margen: m,
             impacto: (m != null && w != null) ? (m - mgEmpresa) * w / 100 : null };
  }).filter(f => f.impacto != null);
  if (filas.length < 3) return null;
  filas.sort((a, b) => a.impacto - b.impacto);

  const malos = filas.filter(f => f.impacto < 0);
  const arrastran = malos.slice(0, 3);
  const sumaMal = arrastran.reduce((s, f) => s + f.impacto, 0);
  const pesoMal = arrastran.reduce((s, f) => s + (f.pct || 0), 0);
  const cubre = filas.reduce((s, f) => s + (f.pct || 0), 0);

  const cuerpo = filas.map(f => `
    <tr${f.impacto < -0.2 ? ' class="av-an-foco"' : ''}>
      <td>${esc(avNombreCorto(f.nombre))}</td>
      <td>${esc(f.venta || '—')}</td>
      <td>${f.pct == null ? '—' : f.pct.toFixed(1) + '%'}</td>
      <td style="color:${f.margen < mgEmpresa ? 'var(--red)' : 'var(--green)'}">
        ${f.margen.toFixed(1)}%</td>
      <td style="color:${f.impacto < 0 ? 'var(--red)' : 'var(--green)'}">
        ${avPP(f.impacto)}</td>
    </tr>`).join('');

  const lecturas = [];
  if (arrastran.length) {
    const p = arrastran[0];
    lecturas.push(`<p class="av-an-lee rojo"><b>Dónde enfocarse:</b> ` +
      `${arrastran.length === 1 ? 'un cliente explica' : 'los ' + arrastran.length +
        ' clientes que más arrastran explican'} ${avPP(sumaMal)} de margen y son el ` +
      `${pesoMal.toFixed(0)}% de la venta. ${esc(avNombreCorto(p.nombre))} solo, con ` +
      `${p.pct.toFixed(1)}% de la venta a ${p.margen.toFixed(1)}% de margen, pesa ` +
      `${avPP(p.impacto)}.</p>`);
  }
  // Dos clientes de venta parecida y margen muy distinto son la comparación
  // más accionable que hay: el peor no puede alegar que su tamaño lo explica.
  const par = avParComparable(filas);
  if (par) {
    lecturas.push(`<p class="av-an-lee">${esc(avNombreCorto(par.a.nombre))} y ` +
      `${esc(avNombreCorto(par.b.nombre))} venden casi lo mismo ` +
      `(${esc(par.a.venta)} vs ${esc(par.b.venta)}) pero a ${par.a.margen.toFixed(1)}% ` +
      `contra ${par.b.margen.toFixed(1)}%. Misma escala de cliente, ` +
      `${Math.abs(par.a.margen - par.b.margen).toFixed(0)} puntos de diferencia: ahí hay ` +
      `una conversación concreta que dar.</p>`);
  }

  return {
    periodo: avReporte('margen_variable').por_cliente_periodo || null,
    titulo: 'Por cliente — quién arrastra el margen',
    por: `Los ${filas.length} clientes con más venta, que concentran el ` +
         `${cubre.toFixed(1)}% del total. La última columna es lo que cada uno le suma o ` +
         `le quita al margen de la empresa: su diferencia contra el ${mgEmpresa.toFixed(1)}% ` +
         `general, pesada por cuánto vende.`,
    cabecera: ['Cliente', 'Venta', '% venta', 'Margen', 'Impacto'],
    cuerpo, lecturas,
  };
}

// Dos clientes de tamaño parecido con la mayor diferencia de margen entre sí.
function avParComparable(filas) {
  let mejor = null;
  for (let i = 0; i < filas.length; i++) {
    for (let j = i + 1; j < filas.length; j++) {
      const a = filas[i], b = filas[j];
      if (!a.pct || !b.pct || a.pct < 2 || b.pct < 2) continue;
      const rel = Math.abs(a.pct - b.pct) / Math.max(a.pct, b.pct);
      if (rel > 0.25) continue;                    // tamaños comparables
      const dif = Math.abs(a.margen - b.margen);
      if (dif < 8) continue;                       // diferencia que importa
      if (!mejor || dif > mejor.dif) {
        mejor = { dif, a: a.margen > b.margen ? a : b, b: a.margen > b.margen ? b : a };
      }
    }
  }
  return mejor;
}

// Razones sociales completas no entran en una tabla y no aportan: "SUPERMERCADOS
// PERUANOS SOCIEDAD ANONIMA 'O ' S.P.S.A." es SPSA para cualquiera que lo lea.
function avNombreCorto(n) {
  let s = (n || '').replace(/\s+/g, ' ').trim();
  s = s.replace(/'[^']*'/g, ' ').replace(/\s{2,}/g, ' ').trim();
  // Las formas societarias se apilan al final ("… SOCIEDAD ANONIMA S.P.S.A.");
  // se quitan de a una hasta que no quede ninguna.
  const forma = /\s*\.?\s*(SOCIEDAD ANONIMA CERRADA|SOCIEDAD ANONIMA ABIERTA|SOCIEDAD ANONIMA|SOCIEDAD COMERCIAL DE RESPONSABILIDAD LIMITADA|S\.?P\.?S\.?A\.?|S\.?A\.?C\.?|S\.?A\.?A\.?|S\.?R\.?L\.?|E\.?I\.?R\.?L\.?|E I R LTDA|LTDA|S\.?A\.?)\s*\.?$/i;
  for (let i = 0; i < 4 && forma.test(s); i++) s = s.replace(forma, '').trim();
  // Las razones sociales vienen en mayúsculas; una tabla entera gritando cansa.
  // Una sigla no tiene vocales ("KL", "J", "R"); "LA", "RED" o "PIN" sí, y son
  // palabras que deben quedar en minúscula como el resto del nombre.
  const siglas = s.split(' ').filter(w =>
    w.length <= 4 && w === w.toUpperCase() && !/[AEIOU]/.test(w));
  s = s.toLowerCase().replace(/(^|[\s.(])([a-záéíóúñ])/g, (m, a, b) => a + b.toUpperCase());
  // "KL Import Export" no es "Kl Import Export": las siglas cortas se respetan.
  siglas.forEach(w => {
    s = s.replace(new RegExp('(^|\\s)' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') +
      '(?=\\s|$)', 'i'), (m, a) => a + w);
  });
  if (s.length > 30) s = s.slice(0, 29).trim() + '…';
  return s || n;
}

// ── Los SKU de una unidad de negocio.
//
// Es el nivel donde se puede poner foco de verdad. No sale de ningún visual
// del reporte —ninguno cruza producto con unidad de negocio—; se arma con una
// consulta propia que reusa los filtros del reporte sin tocarlos.
function avBloqueSKU(uen) {
  const mv = avReporte('margen_variable');
  const todo = mv.sku_por_uen || {};
  const meses = mv.sku_por_uen_meses || [];
  // El nombre de la unidad en el tablero y en el modelo puede no coincidir
  // exactamente ("B&D" / "B & D"), así que se compara sin espacios.
  const llano = x => (x || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const clave = Object.keys(todo).find(k => llano(k) === llano(uen));
  const filas = clave ? todo[clave] : null;
  if (!filas || filas.length < 2) return null;

  // Las filas con margen imposible se muestran, pero no encabezan la lectura:
  // un SKU de S/2,205 con -283% de margen no es el problema de la unidad, es
  // un asiento que hay que revisar.
  //
  // La marca se decide acá y no solo en la extracción: así vale también para
  // los datos ya publicados, sin esperar otra corrida contra Power BI.
  const raro = p => {
    if (p.sospechoso) return true;
    const a = avNum(p.margen), b = avNum(p.margen_previo);
    return (a != null && Math.abs(a) > 100) || (b != null && Math.abs(b) > 100);
  };
  const sanas = filas.filter(p => !raro(p));
  const raras = filas.filter(raro);

  const cuerpo = filas.map(p => `
    <tr${(p.aporte_pp || 0) < -0.05 ? ' class="av-an-foco"' : ''}>
      <td>${raro(p) ? '<span title="Margen imposible: revisar el asiento" '
        + 'style="color:var(--yellow);font-weight:600">⚠ </span>' : ''}${esc(p.producto)}${p.subcategoria
        ? `<small style="display:block;color:var(--text3)">${esc(p.subcategoria)}</small>` : ''}</td>
      <td>${esc(p.venta || '—')}</td>
      <td>${p.peso == null ? '—' : p.peso.toFixed(1) + '%'}</td>
      <td>${esc(p.precio_kg_previo || '—')}</td>
      <td>${esc(p.precio_kg || '—')}</td>
      <td>${esc(p.margen_previo || '—')}</td>
      <td>${esc(p.margen || '—')}</td>
      <td style="color:${(p.aporte_pp || 0) < 0 ? 'var(--red)' : 'var(--green)'}">
        ${avPP(p.aporte_pp, 2)}</td>
    </tr>`).join('');

  const caen = sanas.filter(p => (p.aporte_pp || 0) < 0);
  const lecturas = [];
  if (caen.length) {
    const top = caen.slice(0, 3);
    const parte = top.reduce((a, p) => a + p.aporte_pp, 0);
    const suma = caen.reduce((a, p) => a + p.aporte_pp, 0);
    lecturas.push(`<p class="av-an-lee rojo"><b>Dónde enfocarse:</b> ` +
      `${top.length} SKU explican ${avPP(parte)} de los ${avPP(suma)} que ` +
      `${esc(uen)} perdió. El primero es <b>${esc(top[0].producto)}</b>: pasó de ` +
      `${esc(top[0].margen_previo)} a ${esc(top[0].margen)} pesando ` +
      `${(top[0].peso || 0).toFixed(1)}% de la venta de ${esc(uen)}.</p>`);
    // Precio contra volumen: es la pregunta que decide con quién hablar.
    const baja = caen.filter(p => avNum(p.precio_kg) != null &&
                                  avNum(p.precio_kg_previo) != null &&
                                  avNum(p.precio_kg) < avNum(p.precio_kg_previo));
    if (baja.length) {
      lecturas.push(`<p class="av-an-lee">De esos SKU, <b>${baja.length} bajaron su ` +
        `precio por kilo</b> y el resto perdió margen por costo o por mezcla. ` +
        `La columna de precio dice cuál es cuál: si el precio cayó, la ` +
        `conversación es comercial; si no, es de planta o de compras.</p>`);
    } else {
      lecturas.push(`<p class="av-an-lee">Ninguno de esos SKU bajó su precio por ` +
        `kilo: el margen se perdió por costo, no por precio. La conversación ` +
        `empieza en planta y en compras, no en comercial.</p>`);
    }
  }

  if (raras.length) {
    lecturas.push(`<p class="av-an-lee"><b>${raras.length} fila` +
      `${raras.length > 1 ? 's' : ''} marcada${raras.length > 1 ? 's' : ''} con ⚠:</b> ` +
      `su margen cae fuera de lo posible (${raras.map(p => esc(p.margen)).join(', ')}), ` +
      `así que no es margen sino costo cargado sin su venta, una devolución o un ` +
      `ajuste. Queda fuera de la lectura de arriba y conviene revisar el asiento.</p>`);
  }

  return {
    periodo: meses.length === 2 ? meses[1] : null,
    titulo: `Por SKU — los productos de ${uen}`,
    por: `Los productos de ${uen} ordenados por los puntos de margen que le quitan ` +
      `a su unidad` +
      (meses.length === 2 ? `, comparando ${nombreMes(meses[0])} contra ${nombreMes(meses[1])}` : '') +
      `. Ningún visual del reporte cruza producto con unidad de negocio: esta tabla ` +
      `se arma con una consulta propia que reusa los filtros del reporte sin cambiarlos.`,
    cabecera: ['Producto', 'Venta', '% venta', 'Precio/kg previo', 'Precio/kg',
               'Margen previo', 'Margen', 'Impacto'],
    cuerpo, lecturas,
  };
}

// ── Subcategorías dentro de una unidad de negocio.
//
// Es el único corte del detalle de costos que sí viene partido por unidad de
// negocio. Con producto y cliente no se puede hacer lo mismo.
function avBloqueSubcategorias(uen) {
  const det = (avReporte('margen_variable').detalle_costos) || [];
  if (!det.length) return null;
  const suyas = uen
    ? det.filter(d => (d.negocio || '').toUpperCase().indexOf(uen.toUpperCase()) >= 0)
    : det;
  if (suyas.length < 2) return null;
  const cuerpo = suyas.slice(0, 15).map(d => {
    const m = avNum(d.margen);
    return `<tr>
      <td>${esc(d.subcategoria || d.categoria)}</td>
      <td>${esc(d.venta || '—')}</td>
      <td>${esc(d.precio_kg || '—')}</td>
      <td>${esc(d.costo_kg || '—')}</td>
      <td>${d.margen ? esc(d.margen) : '—'}</td>
    </tr>`;
  }).join('');
  return {
    periodo: avReporte('margen_variable').detalle_costos_periodo || null,
    titulo: uen ? `Por subcategoría — el corte que sí es de ${uen}`
                : 'Por subcategoría',
    por: uen
      ? `Precio y costo por kilo de las subcategorías de ${uen}, ordenadas por venta. ` +
        `Es el mayor detalle que el reporte entrega dentro de una unidad de negocio.`
      : 'Precio y costo por kilo por subcategoría, ordenadas por venta.',
    cabecera: ['Subcategoría', 'Venta', 'Precio/kg', 'Costo/kg', 'Margen'],
    cuerpo, lecturas: [],
  };
}


// ── Qué segmento explica la desviación de un indicador.
//
// Vale para cualquiera que tenga segmentos: merma, compras, margen. Compara
// cada segmento contra la meta del padre y nombra al que más pesa.
// "A y B y C" se lee como un error de tipeo. Una lista es "A, B y C".
function avLista(xs) {
  if (xs.length <= 1) return xs[0] || '';
  return xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1];
}

// Los segmentos de un indicador pueden ser dos cortes distintos de lo mismo:
// la merma viene por unidad de negocio Y por planta, que son la misma merma
// mirada dos veces. Contarlos juntos daría "4 de 6 fuera de meta" cuando en
// realidad son dos veces los mismos kilos. Se analizan por separado.
function avCortes(segs) {
  const planta = segs.filter(x => /^planta\b/i.test(x[0]));
  const resto  = segs.filter(x => !/^planta\b/i.test(x[0]));
  const grupos = [];
  if (resto.length >= 2)  grupos.push({ corte: 'unidad de negocio', segs: resto });
  if (planta.length >= 2) grupos.push({ corte: 'planta', segs: planta });
  if (!grupos.length && segs.length >= 2) grupos.push({ corte: null, segs });
  return grupos;
}

function avBloqueSegmentos(ind, meta, segsDadas, corte) {
  const segs = (segsDadas || ind.segmentos || []).filter(s => !s[2] || s[2] === ind.unidad);
  if (segs.length < 2) return null;
  const filas = [];
  segs.forEach(([nombre, par]) => {
    const v = avSerie(par);
    if (!v || v.curso == null) return;
    const dist = distanciaMeta(ind, v.curso, meta);
    const tri = triangulo(ind, v.curso, v.cerrado);
    filas.push({ nombre, curso: v.curso, cerrado: v.cerrado, dist, tri });
  });
  if (filas.length < 2) return null;
  // El peor primero: el que más lejos está de la meta en la dirección mala.
  filas.sort((a, b) => {
    const A = a.dist ? a.dist.d : 0, B = b.dist ? b.dist.d : 0;
    return ind.direccion === 'menor' ? B - A : A - B;
  });
  const cuerpo = filas.map(f => `
    <tr${f.dist && !f.dist.bien ? ' class="av-an-foco"' : ''}>
      <td>${esc(f.nombre)}</td>
      <td>${f.cerrado == null ? '—' : esc(fmtMeta(ind, f.cerrado))}</td>
      <td>${esc(fmtMeta(ind, f.curso))}</td>
      <td style="color:${f.dist ? (f.dist.bien ? 'var(--green)' : 'var(--red)') : 'var(--text3)'}">
        ${f.dist ? esc(f.dist.txt) : '—'}</td>
      <td>${f.tri ? `<span class="av-tri ${f.tri.cls}"><i></i>${f.tri.txt}</span>` : '—'}</td>
    </tr>`).join('');

  const malos = filas.filter(f => f.dist && !f.dist.bien);
  const lecturas = [];
  if (malos.length === 1) {
    lecturas.push(`<p class="av-an-lee rojo"><b>Dónde enfocarse:</b> ` +
      `${esc(malos[0].nombre)} es el único fuera de meta (${esc(malos[0].dist.txt)}). ` +
      `El resto no necesita atención esta semana.</p>`);
  } else if (malos.length > 1) {
    lecturas.push(`<p class="av-an-lee rojo"><b>Dónde enfocarse:</b> ` +
      `${esc(malos[0].nombre)} está ${esc(malos[0].dist.txt)} de la meta y encabeza; ` +
      `${malos.length} de ${filas.length} están fuera.</p>`);
  } else {
    lecturas.push(`<p class="av-an-lee">Todos los segmentos están en meta. ` +
      `El indicador no necesita apertura esta semana.</p>`);
  }
  const mejora = filas.filter(f => f.tri && f.tri.cls === 't-mejor');
  const empeora = filas.filter(f => f.tri && f.tri.cls === 't-peor');
  if (empeora.length === 1 && mejora.length >= 1) {
    lecturas.push(`<p class="av-an-lee">${esc(empeora[0].nombre)} es el único que ` +
      `empeora contra ${nombreMesCerrado()}, mientras ` +
      `${avLista(mejora.map(f => esc(f.nombre)))} mejora` +
      `${mejora.length > 1 ? 'n' : ''}. Es un problema de ese segmento, no del ` +
      `indicador completo.</p>`);
  }
  return {
    periodo: mesParcial(),
    titulo: corte ? `Por ${corte} — de dónde viene la desviación`
                  : 'Por segmento — de dónde viene la desviación',
    por: `Cada ${corte || 'segmento'} contra la meta del indicador, y cómo se movió ` +
         `desde ${nombreMesCerrado()}.`,
    cabecera: [corte ? corte[0].toUpperCase() + corte.slice(1) : 'Segmento', nombreMesCerrado(), nombreMes(mesParcial()) || 'mes en curso',
               'vs meta', 'vs ' + nombreMesCerrado()],
    cuerpo, lecturas,
  };
}

// ── El análisis completo de una fila. Devuelve null si no hay nada que decir:
// una etiqueta que promete análisis y abre una caja vacía es peor que no
// ofrecerlo.
function analisisDe(ind, meta, segNombre) {
  const bloques = [];
  const parrafos = [];
  let tesis = null;
  const esUEN = !!segNombre;
  const uen = segNombre || null;

  if (ind.clave === 'margen' && esUEN) {
    const m = avMecanismoUEN(uen);
    if (m) {
      const t = avTextoMecanismo(uen, m);
      tesis = t.tesis;
      parrafos.push(t.cuerpo);
      parrafos.push(`Precio implícito: ${avSoles(m.p0)} en ` +
        `${nombreMesCerrado()} y ${avSoles(m.p1)} en ` +
        `${nombreMes(mesParcial())}. Es un valor <b>derivado</b> — costo unitario ` +
        `dividido entre uno menos el margen —, no una cifra que publique el reporte.`);
      const vol = avVolatilidad(uen);
      if (vol && vol.inestable) {
        parrafos.push(`El precio implícito salta de ${avSoles(vol.lo)} a ` +
          `${avSoles(vol.hi)} en ${vol.n} meses, con ${vol.saltos} ` +
          `saltos de más de 10%. Un descuento comercial no se comporta así: se parece ` +
          `más a un cambio de mezcla, meses en que se vende más de un producto caro y ` +
          `meses en que se vende más de uno barato. <b>Conviene descartarlo antes de ` +
          `hablar de precios con comercial.</b>`);
      }
    }
    const sku = avBloqueSKU(uen);
    if (sku) bloques.push(sku);
    const sub = avBloqueSubcategorias(uen);
    if (sub) bloques.push(sub);
  }

  if (!esUEN) {
    avCortes(ind.segmentos || []).forEach(g => {
      const seg = avBloqueSegmentos(ind, meta, g.segs, g.corte);
      if (seg) bloques.push(seg);
    });
  }

  // Un segmento solo ofrece análisis si hay algo suyo que decir. "Costo
  // unitario B&D" es una serie de apoyo del margen, no una unidad de negocio:
  // ofrecerle un análisis que solo contiene la tabla de clientes de toda la
  // empresa es prometer un detalle que esa fila no tiene.
  if (esUEN && !tesis && !bloques.length) return null;

  // Clientes y productos son de TODA la empresa: el reporte no los parte por
  // unidad de negocio. Ponerlos dentro del panel de B&D los hacía leer como
  // si fueran de B&D, que es exactamente lo que no son. Van solo en el nivel
  // del indicador, donde sí corresponden.
  if (ind.clave === 'margen' && !esUEN) {
    const cli = avBloqueClientes();
    if (cli) bloques.push(cli);
  }

  if (!bloques.length && !tesis) return null;

  // El aviso que evita la lectura equivocada: dentro de una UEN, clientes y
  // productos siguen siendo los de toda la empresa.
  let nota = null;
  if (esUEN && !bloques.length) {
    nota = `Todavía no hay detalle publicado de ${esc(uen)}. Las tablas por SKU y ` +
      `por subcategoría entran con la próxima corrida.`;
  } else if (!esUEN && ind.clave === 'margen') {
    nota = `La tabla de clientes es de <b>toda la empresa</b>: el reporte no la parte ` +
      `por unidad de negocio. Para ver los SKU de una unidad, abre su fila y su ` +
      `propio análisis.`;
  }

  return { tesis, parrafos, bloques, nota, titulo: esUEN ? `${uen} · ${ind.label}` : ind.label };
}

function avAnalisisHTML(an, id) {
  const blqs = an.bloques.map(b => `
    <div class="av-an-blq">
      <h4>${b.titulo} ${b.periodo === undefined ? '' : avPeriodoEtiqueta(b.periodo)}</h4>
      <p class="av-an-por">${b.por}</p>
      <div style="overflow-x:auto">
        <table class="av-an-tabla">
          <thead><tr>${b.cabecera.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${b.cuerpo}</tbody>
        </table>
      </div>
      ${b.lecturas.join('')}
    </div>`).join('');
  return `<tr class="av-an-fila" id="${id}" hidden><td colspan="8"><div class="av-an">
    <span class="av-an-cerrar" onclick="avanceAnalisis(event,'${id}')">cerrar ✕</span>
    <div class="av-an-k">Análisis · ${esc(an.titulo)} · ${esc(avCorteTexto())}</div>
    ${an.tesis ? `<p class="av-an-t">${an.tesis}</p>` : ''}
    ${an.parrafos.map(p => `<p class="av-an-p">${p}</p>`).join('')}
    ${an.nota ? `<p class="av-an-falta">${an.nota}</p>` : ''}
    ${blqs}
  </div></td></tr>`;
}

function avanceAnalisis(ev, id) {
  if (ev) ev.stopPropagation();
  const f = document.getElementById(id);
  if (f) f.hidden = !f.hidden;
}

function dxpAvanceView() {
  if (!METAS || !SERIES) return '<div class="av-nota">Cargando datos…</div>';
  const mes = avanceDelMes();
  if (!mes) return '<div class="av-nota">Todavía no hay datos del mes en curso. ' +
    'Aparecen con la corrida de mañana a las 7 de la mañana.</div>';

  const borr = metasBorrador();
  const pct = (mes.fraccion * 100);
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
                 'agosto','setiembre','octubre','noviembre','diciembre'];

  const filas = (METAS.indicadores || []).map(ind => {
    const propia = Object.prototype.hasOwnProperty.call(borr, ind.clave);
    const meta = propia ? borr[ind.clave] : ind.meta;
    const val = valoresDe(ind);

    // Sin serie mensual: se usa el KPI del reporte y se dice que es del día.
    let curso = val ? val.curso : null, cerrado = val ? val.cerrado : null,
        previo = val ? val.previo : null, serie = val ? val.serie : null;
    let sinSerie = !val;
    if (sinSerie) {
      const rd = (DATA?.empresas?.PAUNO?.reportes || {})[ind.reporte] || {};
      const k = (rd.kpis || []).find(x => x.label === ind.kpi);
      curso = k ? localNum(k.valor) : null;
      if (curso != null && ind.unidad === 'pct' && curso > 1) curso = curso / 100;
    }

    const dist = distanciaMeta(ind, curso, meta);
    // Una tasa se puede comparar aunque el mes vaya a medias: un porcentaje
    // es un porcentaje. Lo que se acumula, no — comparar trece días contra un
    // mes entero daría −60% en facturación sin que nada haya pasado. Para
    // esos se comparan los dos últimos meses cerrados y se dice cuáles son.
    const compara = ind.tipo === 'acumula'
      ? { a: cerrado, b: previo, pie: `${nombreMesCerrado()} vs el mes previo` }
      : { a: curso,   b: cerrado, pie: '' };
    const tri = triangulo(ind, compara.a, compara.b);
    const col  = dist ? (dist.bien ? 'var(--green)' : 'var(--red)') : 'var(--text3)';

    // Columna del centro: ritmo para lo que se acumula, distancia para tasas.
    let centro, enRitmo = null;
    if (meta == null) {
      centro = '<span class="av-falta">necesita meta</span>';
    } else if (ind.tipo === 'acumula' && curso != null) {
      const logro = escalaMeta(ind, curso) / escalaMeta(ind, meta) * 100;
      const ok = logro >= pct;
      enRitmo = ok;
      centro = `<span class="av-ritmo">
        <b class="av-num" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${logro.toFixed(0)}%</b>
        <span class="av-barra"><span class="av-barra-f" style="width:${Math.min(logro,100)}%;
          background:${ok ? 'var(--green)' : 'var(--red)'}"></span>
          <span class="av-barra-t" style="left:${pct}%"></span></span></span>`;
    } else if (dist) {
      centro = `<span class="av-num" style="color:${col}">${dist.txt}</span>`;
    } else {
      centro = '<span class="av-vacio">sin dato del mes</span>';
    }

    let veredicto;
    if (curso == null) {
      // Un indicador sin dato del mes no está ni bien ni mal: falta el dato.
      // Decir "falta meta" ahí confunde dos carencias distintas.
      veredicto = '<span class="av-ver av-na">Sin dato del mes</span>';
    } else if (meta == null) {
      veredicto = '<span class="av-ver av-na">Falta meta</span>';
    } else if (enRitmo !== null) {
      veredicto = `<span class="av-ver ${enRitmo ? 'av-bien' : 'av-mal'}">${
        enRitmo ? 'En ritmo' : 'Atrasado'}</span>`;
    } else if (dist) {
      veredicto = `<span class="av-ver ${dist.bien ? 'av-bien' : 'av-mal'}">${
        dist.bien ? 'En meta' : (ind.direccion === 'menor' ? 'Sobre meta' : 'Bajo meta')}</span>`;
    } else {
      veredicto = '<span class="av-ver av-na">Sin dato</span>';
    }

    // Si hay análisis que dar, la Lectura deja de ser solo una etiqueta y pasa
    // a ser el botón que lo abre. Donde no hay nada que decir se queda como
    // está: una etiqueta clicable que abre una caja vacía enseña a no hacer
    // clic en ninguna.
    const an = analisisDe(ind, meta, null);
    const anId = 'an-' + ind.clave;
    if (an) {
      const mala = / av-mal"/.test(veredicto);
      veredicto = veredicto.replace('class="av-ver ', 'class="av-ver-link av-ver ')
        .replace('>', ` onclick="avanceAnalisis(event,'${anId}')" title="Abre el análisis escrito">`)
        .replace(/<\/span>$/, (mala ? ' · ver análisis' : ' · analizar') + '</span>');
    }

    const metaTxt = meta == null ? '+ poner meta' : fmtMeta(ind, meta);
    const triHtml = tri ? `<span class="av-tri ${tri.cls}"><i></i>${tri.txt}</span>`
                        : '<span class="av-vacio">—</span>';

    const tieneSeg = (ind.segmentos || []).length > 0;
    return `<tr${tieneSeg ? ` class="av-abrible" onclick="avanceAbrir('${ind.clave}')"` : ''}>

  root.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

  root.querySelectorAll('.tt').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'avance' && v) v.innerHTML = dxpAvanceView();
  const ctx = root.querySelector('#dxp-context');

}

function gapBar(val, meta, inverso) {
  // val y meta como números. inverso=true si menor es mejor (mora, mermas)
  if (!val || !meta) return '';
  const pct = Math.min(100, Math.round((val / meta) * 100));
  const ok   = inverso ? val <= meta : val >= meta;
  const warn  = inverso ? val <= meta * 1.5 : val >= meta * 0.7;
  const color = ok ? 'var(--green)' : warn ? 'var(--yellow)' : 'var(--red)';
  const fill  = inverso ? Math.min(100, Math.round((val / (meta * 2)) * 100)) : pct;
  return `<div style="height:4px;background:var(--border);border-radius:2px;margin-top:4px">
    <div style="height:4px;border-radius:2px;background:${color};width:${fill}%"></div>
  </div>`;
}

function fmtNum(s) {
  // Returns raw number from string like "S/6.42M", "21.1%", "81.7%"
  if (!s) return null;
  const m = s.replace(/[^0-9.]/g,'');
  return parseFloat(m) || null;
}

function buildDecisionMatrix(empresa, reportesData) {
  // Returns array of {prioridad, area, indicador, valor, meta, brecha, impacto, accion, tipo, estado}
  // ordered by severity / $ impact
  const rp = reportesData;
  const kv = (tipo, lbl) => rp[tipo]?.kpis?.find(k=>k.label===lbl)?.valor;
  const items = [];

  // Fill Rate — impacto directo en venta perdida (el más alto en $)
  const fr = fmtNum(kv('fill_rate','Fill Rate'));
  const vp = kv('fill_rate','Venta Perdida');
  if (fr !== null) items.push({
    area:'Supply Chain', indicador:'Fill Rate', valor: kv('fill_rate','Fill Rate')||'—',
    meta:'98%', brecha: fr ? `${(98-fr).toFixed(1)}pp` : '—',
    impacto: vp ? `Venta perdida ${vp}` : `${(98-fr).toFixed(1)}pp bajo meta`,
    accion:'Revisar cobertura de inventario y SKUs sin stock. ¿Qué productos fallan más?',
    tipo:'fill_rate', estado: rp.fill_rate?.estado||'neutral',
    peso: (100 - (fr||0)) * 3   // mayor brecha = mayor peso
  });

  // Morosidad CxC — impacto en caja
  const mora = fmtNum(kv('cuentas_por_cobrar','Morosidad'));
  const pvencer = kv('cuentas_por_cobrar','CxC por vencer');
  if (mora !== null) items.push({
    area:'Cobranzas', indicador:'Morosidad CxC', valor: kv('cuentas_por_cobrar','Morosidad')||'—',
    meta:'15%', brecha: mora ? `${(mora-15).toFixed(1)}pp` : '—',
    impacto: pvencer ? `${pvencer} en riesgo de vencer` : `${mora.toFixed(1)}% sobre meta`,
    accion:'Activar cobranza activa. Evaluar bloqueo de crédito a clientes con >60 días.',
    tipo:'cuentas_por_cobrar', estado: rp.cuentas_por_cobrar?.estado||'neutral',
    peso: (mora||0) * 2
  });

  // Mermas — impacto en costo
  const merma = fmtNum(kv('mermas','Merma Total'));
  if (merma !== null) items.push({
    area:'Operaciones', indicador:'Mermas', valor: kv('mermas','Merma Total')||'—',
    meta:'2%', brecha: merma ? `${(merma-2).toFixed(2)}pp` : '—',
    impacto: `${merma.toFixed(2)}% merma — encima del límite operativo`,
    accion:'Auditar proceso en planta. Identificar turno/línea con mayor pérdida.',
    tipo:'mermas', estado: rp.mermas?.estado||'neutral',
    peso: (merma||0) * 10
  });

  // Avance vs Ppto — riesgo de no cumplir plan
  const av = fmtNum(kv('margen_variable_pag2','Avance vs Ppto'));
  if (av !== null && av < 90) items.push({
    area:'Ventas', indicador:'Avance vs Presupuesto', valor: kv('margen_variable_pag2','Avance vs Ppto')||'—',
    meta:'100%', brecha: av ? `${(100-av).toFixed(0)}pp` : '—',
    impacto: `Riesgo de no alcanzar el presupuesto del mes`,
    accion:'Revisar pipeline con equipo comercial. ¿Dónde está la brecha: volumen o precio?',
    tipo:'margen_variable_pag2', estado: rp.margen_variable_pag2?.estado||'neutral',
    peso: (100 - (av||0)) * 1.5
  });

  // CxP Refinanciado — riesgo financiero
  const cxpV = kv('cuentas_por_pagar','CxP Total');
  const refV = kv('cuentas_por_pagar','Refinanciado');
  const cxpN = parseVal(cxpV), refN = parseVal(refV);
  if (cxpN && refN) {
    const pctRef = Math.round((refN/cxpN)*100);
    if (pctRef > 30) items.push({
      area:'Finanzas', indicador:'CxP Refinanciado', valor: `${pctRef}% refinanciado`,
      meta:'<20%', brecha: `${pctRef-20}pp`,
      impacto: `${fmtM(refN)} en deuda refinanciada de ${fmtM(cxpN)} total`,
      accion:'Negociar plan de pago con proveedores clave. Priorizar vencimientos más próximos.',
      tipo:'cuentas_por_pagar', estado: rp.cuentas_por_pagar?.estado||'neutral',
      peso: pctRef
    });
  }

  // ordenar por peso descendente
  items.sort((a,b) => (b.peso||0) - (a.peso||0));
  return items;
}

function renderEmpresa(empresa, containerId) {
  const el = document.getElementById(containerId);
  const empData    = (DATA.empresas || {})[empresa] || {};
  const semaforo   = (DATA.semaforos || {})[empresa] || 'green';
  const razon      = (DATA.semaforo_razon || {})[empresa] || '';
  const reportes   = REPORTES_CONFIG[empresa] || [];
  const reportesData = empData.reportes || {};
  const rp = reportesData;

  const kv = (tipo, lbl) => rp[tipo]?.kpis?.find(k=>k.label===lbl)?.valor || '—';
  const matrix = buildDecisionMatrix(empresa, reportesData);

  // ── colores de estado ────────────────────────────────────────────────────
  const stateColor = s => s==='red'?'var(--mk-red)':s==='yellow'?'var(--mk-yellow)':s==='green'?'var(--mk-green)':'var(--mk-sub)';
  const stateBg    = s => s==='red'?'rgba(239,68,68,.08)':s==='yellow'?'rgba(234,179,8,.08)':s==='green'?'rgba(34,197,94,.08)':'var(--mk-surface2)';
  const stateLabel = s => s==='red'?'CRÍTICO':s==='yellow'?'ALERTA':s==='green'?'OK':'—';

  // ── mini gauge inline SVG ────────────────────────────────────────────────
  const miniGauge = (pct, color) => {
    const r=18, cx=22, cy=22;
    const clamped = Math.max(0, Math.min(100, pct));
    const large = clamped > 50 ? 1 : 0;
    const rad = a => ({ x: cx + r*Math.cos((a-90)*Math.PI/180), y: cy + r*Math.sin((a-90)*Math.PI/180) });
    const end = rad(clamped * 3.6);
    const start = rad(0);
    return `<svg viewBox="0 0 44 44" style="width:36px;height:36px;flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--mk-border)" stroke-width="5"/>
      <path d="M${start.x},${start.y} A${r},${r} 0 ${large},1 ${end.x},${end.y}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="8" font-weight="700" fill="${color}">${pct.toFixed(0)}%</text>
    </svg>`;
  };

// ¿Este campo de este desglose lo calculamos nosotros? La lista viaja en
// summaries.json, así que marcarlo no depende de que alguien recuerde cuáles
// eran: si mañana se agrega otro cálculo, se marca solo.
function esDerivado(reporte, desglose, campo) {
  return (DATA?.derivados || []).some(x =>
    x.reporte === reporte && x.desglose === desglose && x.campo === campo);
}

function notaDerivado(reporte, desglose, campo) {
  const d = (DATA?.derivados || []).find(x =>
    x.reporte === reporte && x.desglose === desglose && x.campo === campo);
  if (!d) return '';
  return `<span class="calc" title="${esc(d.formula)} — ${esc(d.razon)}">◦ calculado</span>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderKpiCard(k, contexto, empresa, tipo, archivo, desc) {
  const cls = sc(k.estado);
  const { arrow, cls: tCls } = trendArrow(k.tendencia, k.label);
  const clickable = !!(empresa && tipo && archivo);
  const onclick = clickable
    ? `onclick="showDetail('${empresa}','${tipo}','${contexto || tipo}','${archivo}','${(desc||'').replace(/'/g,"\\'")}')" style="cursor:pointer"`
    : '';

  let progressHtml = '';
  if (k.valor && k.meta) {
    const valN  = parseFloat((k.valor || '').replace(/[^0-9.]/g, ''));
    const metaN = parseFloat((k.meta  || '').replace(/[^0-9.]/g, ''));
    if (!isNaN(valN) && !isNaN(metaN) && metaN > 0) {
      const pct = Math.min(100, Math.round((valN / metaN) * 100));
      progressHtml = `<div class="kpi-progress">
        <div class="kpi-progress-track">
          <div class="kpi-progress-fill ${cls}" style="width:${pct}%"></div>
        </div>
        <div class="kpi-progress-meta">Meta: ${esc(k.meta)} · ${pct}% alcanzado</div>

  return `<div class="kpi-card ${cls}${clickable ? ' kpi-card-link' : ''}" ${onclick}>
    <div class="kpi-label">${k.label}${contexto ? `<br><span style="opacity:.6;font-size:9px;font-style:italic">${contexto}</span>` : ''}</div>
    <div class="kpi-val-row">

// ── Gráficas SVG inline ──────────────────────────────────────────────────────

// Parsea "S/124.89M" → 124890000, "81.7%" → 81.7, "S/3.15M" → 3150000
function parseVal(s) {
  if (!s) return null;
  s = String(s).trim();
  // (?![a-zA-Z]) evita que la "k" de "kg"/"km" o la "m" de otro sufijo se
  // confundan con los multiplicadores K (miles) / M (millones) — sin esto,
  // "9,834,538 kg" se leía como "9,834,538 K" y se inflaba 1000x.
  const mM = s.match(/([\d,]+\.?\d*)\s*M(?![a-zA-Z])/i);
  if (mM) return parseFloat(mM[1].replace(/,/g,'')) * 1e6;
  const mK = s.match(/([\d,]+\.?\d*)\s*K(?![a-zA-Z])/i);
  if (mK) return parseFloat(mK[1].replace(/,/g,'')) * 1e3;
  return parseFloat(s.replace(/[^0-9.\-]/g,'')) || null;
}

function fmtM(n) { // format soles as "S/X.XXM"
  if (n === null || n === undefined) return '—';
  if (Math.abs(n) >= 1e6) return 'S/' + (n/1e6).toFixed(2) + 'M';
  if (Math.abs(n) >= 1e3) return 'S/' + (n/1e3).toFixed(0) + 'K';
  return 'S/' + n.toFixed(0);
}

// Semicircle gauge (180°): left=0%, right=100%
function svgGauge(pct, label, color, meta) {
  const clamped = Math.max(0, Math.min(100, pct));
  const R = 52, cx = 64, cy = 64;
  // angle in radians: 0% = π (left), 100% = 0 (right), sweep left→right through top
  const ang = Math.PI * (1 - clamped / 100);
  const ex = cx + R * Math.cos(ang);
  const ey = cy - R * Math.sin(ang);
  // track: full semicircle from right (0) to left (π)
  return `<svg viewBox="0 0 128 78" style="width:150px;height:88px;display:block;margin:0 auto">
    <path d="M${cx-R},${cy} A${R},${R} 0 0,1 ${cx+R},${cy}" fill="none" stroke="var(--border)" stroke-width="11" stroke-linecap="round"/>
    <path d="M${cx+R},${cy} A${R},${R} 0 0,0 ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"/>
    <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="20" font-weight="800" fill="${color}">${pct.toFixed(1)}%</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" fill="var(--sub)">${label}</text>
    ${meta ? `<text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="8" fill="var(--sub)">meta ${meta}</text>` : ''}
    <text x="${cx-R+2}" y="${cy+14}" font-size="8" fill="var(--sub)">0%</text>
    <text x="${cx+R-14}" y="${cy+14}" font-size="8" fill="var(--sub)">100%</text>
  </svg>`;
}

// Waterfall: items = [{label, valSoles, color}]
function svgWaterfall(items) {
  const maxVal = Math.max(...items.map(i => Math.abs(i.valSoles)));
  if (!maxVal) return '';
  const W = 280, H = 110, padL = 8, bw = 72, gap = 12, padB = 22;
  const scale = (H - padB - 8) / maxVal;
  let bars = '';
  items.forEach((item, i) => {
    const bh = Math.max(4, Math.round(Math.abs(item.valSoles) * scale));
    const x = padL + i * (bw + gap);
    const y = H - padB - bh;
    const lbl = fmtM(item.valSoles);
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${item.color}" opacity="0.9"/>
      <text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" font-weight="700" fill="${item.color}">${lbl}</text>
      <text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--sub)">${item.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:300px;display:block;margin:0 auto">${bars}</svg>`;
}

function renderChartForReporte(tipo, rd) {
  // Medidas que Power BI sí entrega en series.json pero que no vienen en
  // summaries.json — se agregan como KPI real (con su período de origen).
  const EXTRA_SERIE = {
    mermas:            [{ ds:'mermas',     medida:'Merma',           label:'Merma (medida absoluta)', pct:true }],
    cuentas_por_pagar: [{ ds:'cxp',        medida:'Refinanciamiento',label:'Refinanciamiento (serie)', money:true },
                        { ds:'cxp',        medida:'Proveedores',     label:'Proveedores (serie)' }],
    sop_inventario:    [{ ds:'inventario', medida:'Stock Total',     label:'Stock Total (kg)' }],
    margen_variable:   [{ ds:'margen',     medida:'Ventas (S/.)',     label:'Ventas (S/.)', money:true }],
    fill_rate:         [{ ds:'fill_rate',  medida:'ORDEN DE VENTA',  label:'Orden de Venta (serie)', money:true }],
  };
  const extras = (EXTRA_SERIE[tipo] || []).map(e => {
    const a = (SERIES?.datasets?.[e.ds] || {})[e.medida];
    if (!Array.isArray(a)) return null;
    const v = a.map((x,i)=>({x,i})).filter(o=>o.x!=null);
    if (!v.length) return null;
    const u = v[v.length-1];
    const val = e.pct ? (u.x*100).toFixed(2)+'%' : e.money ? fmtM(u.x) : u.x.toLocaleString('es-PE',{maximumFractionDigits:2});
    return { label: e.label, valor: val, periodo: s.ps[u.i] };
  }).filter(Boolean);

  const kpis = rd.kpis || [];
  const get  = (lbl) => kpis.find(k => k.label === lbl)?.valor;
  const num  = (lbl) => parseVal(get(lbl));

  if (tipo === 'fill_rate') {
    const fr  = num('Fill Rate');
    const ov  = num('Orden de Venta');
    const fac = num('Facturación');
    const vp  = num('Venta Perdida');
    if (!fr && !ov) return '';
    const col = (fr||0) > 95 ? 'var(--green)' : (fr||0) > 85 ? 'var(--yellow)' : 'var(--red)';
    return `<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:12px 0">
      ${fr ? svgGauge(fr, 'Fill Rate', col, '98%') : ''}
      ${ov ? svgWaterfall([
        {label:'Orden Venta', valSoles: ov,  color:'var(--accent)'},
        {label:'Facturado',   valSoles: fac, color:'var(--green)'},
        {label:'Venta Perdida', valSoles: vp, color:'var(--red)'},
      ]) : ''}
    </div>
    ${vp ? `<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px;font-size:12px;margin-top:4px">
      <strong style="color:var(--red)">Impacto económico:</strong> ${fmtM(vp)} en venta perdida — pedidos que no se atendieron completos.<br>
      <span style="color:var(--sub)">Si Fill Rate sube a 98%, se recuperarían ≈ ${fmtM((ov||0)*0.98 - (fac||0))} adicionales.</span>
    </div>` : ''}`;
  }

  if (tipo === 'cuentas_por_cobrar') {
    const mora  = num('Morosidad');
    const pvenc = num('CxC por vencer');
    if (!mora) return '';
    const col = mora >= 20 ? 'var(--red)' : mora >= 15 ? 'var(--yellow)' : 'var(--green)';
    return `<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:12px 0">
      ${svgGauge(mora, 'Morosidad', col, '15%')}
      ${pvenc ? `<div style="flex:1;min-width:120px">
        <div style="font-size:11px;color:var(--sub);margin-bottom:4px">Por vencer próximos 30 días</div>
        <div style="font-size:24px;font-weight:800;color:var(--yellow)">${fmtM(pvenc)}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:8px">Brecha vs meta 15%: <strong style="color:${col}">${(mora-15).toFixed(1)}pp</strong></div>
        <div style="font-size:11px;color:var(--sub)">Acción: Activar cobranza activa y bloquear crédito a clientes >60 días.</div>
      </div>` : ''}
    </div>`;
  }

  if (tipo === 'mermas') {
    const m = num('Merma Total');
    if (!m) return '';
    const col = m > 3 ? 'var(--red)' : m > 2 ? 'var(--yellow)' : 'var(--green)';
    const brecha = (m - 2).toFixed(2);
    return `<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:12px 0">
      ${svgGauge(m, 'Merma Total', col, '2%')}
      <div style="flex:1;min-width:120px">
        <div style="font-size:13px;font-weight:700;color:${col}">+${brecha}pp sobre meta</div>
        <div style="font-size:11px;color:var(--sub);margin-top:6px">Merma de <strong>${m.toFixed(2)}%</strong> vs límite operativo de <strong>2%</strong>.</div>
        <div style="font-size:11px;color:var(--sub);margin-top:6px">Acción: Auditar línea/turno con mayor pérdida. Revisar temperatura, manipulación y vencimientos.</div>
      </div>
    </div>`;
  }

  if (tipo === 'control_interno') {
    // Cumplimiento por jefe de área y planes por planta — tablas del reporte 8.
    // Sus 14 KPIs decían CUÁNTO fallaba pero no QUIÉN ni DÓNDE.
    const ar = s.rp.control_interno?.por_area || [];
    const pl = s.rp.control_interno?.planes_por_planta || [];
    if (!ar.length && !pl.length) return null;
    let h2 = '';
    if (ar.length) {
      h2 += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin-bottom:6px">Cumplimiento por jefe de área — peor primero</div>`
        + ar.map(a => bar(a.jefe, a.valor, a.pct, col(a.estado))).join('');
    }
    if (pl.length) {
      const mx = Math.max(...pl.map(p => p.planes)) || 1;
      h2 += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin:12px 0 6px">Planes de acción por planta y estado</div>`
        + pl.map(p => bar(`${p.planta} · ${p.estatus}`, String(p.planes),
            p.planes / mx * 100,
            /atras|vencid/i.test(p.estatus) ? 'var(--red)'
            : /abiert|proceso/i.test(p.estatus) ? 'var(--yellow)' : 'var(--green)')).join('');
    }
    return { t:'Control interno — quién y dónde', h: h2 };
  }
  if (tipo === 'margen_variable_pag2') {
    const av = num('Avance vs Ppto');
    if (!av) return '';
    const col = av > 80 ? 'var(--green)' : av > 60 ? 'var(--yellow)' : 'var(--red)';
    return `<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:12px 0">
      ${svgGauge(av, 'Avance vs Ppto', col, '100%')}
      <div style="flex:1;min-width:130px">
        <div style="font-size:13px;font-weight:700;color:${col}">${av.toFixed(1)}% del presupuesto</div>
        <div style="font-size:11px;color:var(--sub);margin-top:6px">Brecha para cerrar: <strong style="color:var(--red)">${(100-av).toFixed(1)}pp restantes</strong></div>
        <div style="font-size:11px;color:var(--sub);margin-top:6px">→ Revisar pipeline. ¿La brecha es volumen, precio o canal?</div>
      </div>
    </div>`;
  }

  if (tipo === 'margen_variable') {
    const venta = num('Ventas mes');
    if (!venta) return '';
    return `<div style="padding:12px;background:var(--surface);border-radius:8px;border:1px solid var(--border);font-size:12px">
      <div style="font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px">Ventas agosto 2026</div>
      <div style="font-size:28px;font-weight:800;color:var(--accent)">${fmtM(venta)}</div>
      <div style="font-size:11px;color:var(--sub);margin-top:4px">Fuente: Power BI — dato real del mes</div>
    </div>`;
  }

  if (tipo === 'cuentas_por_pagar') {
    const cxp = toNum(get('CxP Total'));
    const ref = toNum(get('Refinanciado'));
    const neto = cxp - ref;
    if (!cxp) return '';
    return `<div style="margin:12px 0">
      ${svgBars([
        {label:'CxP Total',    val: cxp, max: cxp, color:'var(--accent)'},
        {label:'Refinanciado', val: ref, max: cxp, color:'var(--yellow)'},
        {label:'Neto por pagar', val: neto, max: cxp, color:'var(--red)'},
      ], 'CxP')}
    </div>`;
  }

  return '';
}

// ── Marco McKinsey genérico para cualquier área ──────────────────────────────
function renderMcKinseyArea(empresa, tipo) {
  const rp = (DATA.empresas || {})[empresa]?.reportes || {};
  const rd = rp[tipo] || {};
  const kv = (t, lbl) => rp[t]?.kpis?.find(k => k.label === lbl)?.valor;
  const yoy = DATA.yoy || {};
  const periodoYoY = DATA.yoy_periodo || '2025-08';
  const yearYoY = periodoYoY.split('-')[0];

  const mcSection = (n, title, content) => `
    <div class="mck-sec" data-n="${n}">
      <div class="mck-h"><span class="rn">${n}</span>${title}</div>
      ${content}
    </div>`;

  // Marca de origen: los KPIs que no salen de una consulta capturada del
  // reporte llevan un signo. El sondeo genérico consulta la medida SIN los
  // filtros del visual, y eso ya produjo diferencias reales (49.5% vs 46.5%
  // en margen, 4.87% vs 2.93% en mermas). Quien lea el dashboard debe poder
  // distinguir una cifra contrastada de una que no lo está.
  const marcaFuente = (tipoRep, lbl) => {
    const k = rp[tipoRep]?.kpis?.find(x => x.label === lbl);
    if (!k) return '';
    let out = '';
    if (k.fuente && k.fuente !== 'reporte') {
      out += ` <span title="No contrastado contra Power BI: viene del escaneo autom\u00e1tico, sin los filtros del visual" style="color:var(--yellow);font-weight:700;cursor:help">\u25e6</span>`;
    }
    // Cifras que no son del mes que titula el tablero. La validación las
    // detecta comparándolas contra la serie mensual y les pone la nota: sin
    // esto, un acumulado del año se lee como si fuera de agosto.
    if (k.nota_periodo) {
      out += ` <span title="${esc(k.nota_periodo)}" style="color:var(--yellow);font-weight:700;cursor:help">\u26a0</span>`;
    }
    return out;
  };

  const rowKpi = (lbl, val, meta, col, tipoRep) => {
    const cls = col === 'var(--red)' ? 'crit' : col === 'var(--yellow)' ? 'warn' : col === 'var(--green)' ? 'ok' : '';
    return `<div class="mck-kv"><span class="l">${lbl}${tipoRep ? marcaFuente(tipoRep, lbl) : ''}</span><span class="v ${cls}">${val}${meta?` <small>meta ${meta}</small>`:''}</span></div>`;
  };

  const yoyBlock = (valorActual, valorYoY, labelMetrica, fmt, motivoPendiente) => {
    if (valorYoY === null || valorYoY === undefined) {
      return `<div style="padding:8px;background:rgba(234,179,8,.06);border-left:3px solid var(--yellow);border-radius:4px;font-size:11px;color:var(--sub)">
        ${motivoPendiente || `Sin comparativo contra ${yearYoY}: este reporte no guarda el corte
        por mes en Power BI, así que no hay con qué comparar el mismo mes del año pasado.`}
      </div>`;
    }
    const delta = valorActual !== null ? ((valorActual - valorYoY) / Math.abs(valorYoY || 1)) * 100 : null;
    const col = delta !== null ? (delta >= 0 ? 'var(--green)' : 'var(--red)') : 'var(--sub)';
    const sign = delta !== null ? (delta > 0 ? '+' : '') : '';
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div style="padding:10px;background:rgba(0,0,0,.04);border-radius:8px;text-align:center">
        <div style="font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:4px">Agosto ${yearYoY}</div>
        <div style="font-size:20px;font-weight:700;color:var(--sub)">${fmt(valorYoY)}</div>
      </div>
      <div style="padding:10px;background:var(--accent)11;border:1px solid var(--accent)33;border-radius:8px;text-align:center">
        <div style="font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;margin-bottom:4px">Agosto 2026</div>
        <div style="font-size:20px;font-weight:700;color:var(--accent)">${valorActual !== null ? fmt(valorActual) : '—'}</div>
      </div>
    </div>
    ${delta !== null ? `<div style="padding:8px;background:${delta>=0?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border-left:3px solid ${col};border-radius:4px;font-size:11px">
      <span style="font-weight:700;color:${col}">${sign}${delta.toFixed(1)}% YoY</span>
      <span style="color:var(--sub);margin-left:8px">${labelMetrica} vs mismo período año anterior</span>
    </div>` : ''}`;
  };

  // ── Configuración por tipo ──────────────────────────────────────────────────
  const cfg = {
    fill_rate: () => {
      const fr   = parseVal(kv('fill_rate','Fill Rate'));
      const ov   = parseVal(kv('fill_rate','Orden de Venta'));
      const fac  = parseVal(kv('fill_rate','Facturación'));
      const vp   = parseVal(kv('fill_rate','Venta Perdida'));
      const col  = (fr||0) > 95 ? 'var(--green)' : (fr||0) > 85 ? 'var(--yellow)' : 'var(--red)';
      const rec  = ov ? fmtM(ov * 0.98 - (fac||0)) : '—';
      return {
        titulo: 'Fill Rate — Nivel de Servicio',
        I: `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
          ${fr ? svgGauge(fr, 'Fill Rate', col, '98%') : ''}
          <div style="flex:1;min-width:140px">
            ${rowKpi('Fill Rate agosto 2026', kv('fill_rate','Fill Rate')||'—', '98%', col)}
            ${rowKpi('Orden de Venta (YTD)', kv('fill_rate','Orden de Venta')||'—', null, 'var(--text)')}
            ${rowKpi('Facturación (YTD)',     kv('fill_rate','Facturación')||'—',    null, 'var(--green)')}
            ${rowKpi('Venta Perdida (YTD)',   kv('fill_rate','Venta Perdida')||'—',  null, 'var(--red)')}
            <div style="font-size:10px;color:var(--sub);margin-top:8px;padding:6px;background:rgba(0,0,0,.04);border-radius:6px">⚠️ OV/Facturación/VP son acumulados YTD, no solo agosto.</div>
          </div>
        </div>`,
        II: yoyBlock(fr, yoy.fill_rate != null ? yoy.fill_rate * 100 : null, 'Fill Rate', v => v.toFixed(1)+'%'),
        III: ov ? svgWaterfall([
          {label:'Orden Venta', valSoles: ov,  color:'var(--accent)'},
          {label:'Facturado',   valSoles: fac, color:'var(--green)'},
          {label:'Venta Perdida', valSoles: vp, color:'var(--red)'},
        ]) + `<div style="font-size:11px;color:var(--sub);margin-top:8px">Acumulado YTD. Meta: facturar 98% de OV.
          ${ov && fac ? ` Para llegar a la meta faltarían <strong>${rec}</strong> de facturación adicional sobre el acumulado actual.` : ''}
        </div>` + (() => {
          // Desglose por marca del mes en curso — filtro FIL_MES_ACTUAL del
          // visual "SOLES NO ATENDIDOS POR GRUPO" (la consulta del reporte 2026-09-06)
          const pg = rp.fill_rate?.por_grupo || [];
          const pm = rp.fill_rate?.por_marca || [];
          const cVar = s => s === 'red' ? 'var(--red)' : s === 'yellow' ? 'var(--yellow)' : 'var(--green)';
          const bloqueGrupo = pg.length ? `<div style="margin-top:12px">
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin-bottom:6px">Fill Rate por cliente — peor primero</div>
            ${pg.map(g => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap">
              <div style="flex:0 0 88px;font-size:11px;font-weight:600">${g.grupo}</div>
              <div style="flex:1 1 100px;min-width:80px;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${Math.min(100, parseVal(g.valor) || 0)}%;background:${cVar(g.estado)}"></div>
              </div>
              <div style="flex:0 0 auto;font-size:11px;font-family:var(--fm);color:${cVar(g.estado)}">${g.valor}</div>
              ${g.pedidos ? `<div style="flex:0 0 auto;font-size:10px;font-family:var(--fm);color:var(--sub)">${g.pedidos} pedidos sin atender</div>` : ''}
            </div>`).join('')}
          </div>` : '';
          if (!pm.length) return bloqueGrupo;
          return bloqueGrupo + `<div style="margin-top:12px">
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin-bottom:6px">Pedidos no atendidos este mes, por marca</div>
            ${pm.map(m => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap">
              <div style="flex:0 0 88px;font-size:11px;font-weight:600">${m.marca}</div>
              <div style="flex:1 1 100px;min-width:80px;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${m.pct != null ? Math.min(100, m.pct) : 0}%;background:var(--red)"></div>
              </div>
              <div style="flex:0 0 auto;font-size:11px;font-family:var(--fm)">${m.valor} pedidos${m.pct != null ? ` · ${m.pct}%` : ''}</div>
            </div>`).join('')}
          </div>`;

      };
    },
  };

  // Fallback para tipos sin configuración específica
  const areaConfig = (cfg[tipo] || cfg['sop_inventario'])?.();
  if (!areaConfig) return '<div style="padding:20px;color:var(--sub)">Sin análisis disponible para este reporte.</div>';

  const { titulo, I, II, III, IV, V, chatMsg } = areaConfig;

  const prClass = {'ALTA':'alta','MEDIA':'media','BAJA':'baja'};

    </div>`).join('') || `<div class="mck-nd">Sin palancas identificadas para este reporte todavía.</div>`;

  const vHtml = (Array.isArray(V) ? V : []).map(d => `<div class="mck-vacio"><span class="mk">▸</span>${d}</div>`).join('');

  return `
    <div class="mck-grid">
    ${mcSection('I', 'Diagnóstico — ¿Dónde estamos?', I)}

    ${mcSection('IV', 'Palancas de Gestión — So What?', ivHtml)}

      <button data-msg="${(chatMsg||'').replace(/"/g,'&quot;')}" onclick="openChatWithMsg(this.dataset.msg)">Preguntar a Juanito sobre este reporte</button>
    </div></div>`;
}

        <line x1="0" y1="4" x2="700" y2="4" stroke="var(--mk-border)" stroke-dasharray="2,4"/>
        <line x1="0" y1="61" x2="700" y2="61" stroke="var(--mk-border)" stroke-dasharray="2,4"/>
        <line x1="0" y1="119" x2="700" y2="119" stroke="var(--mk-border)" stroke-dasharray="2,4"/>
        <line x1="0" y1="176" x2="700" y2="176" stroke="var(--mk-border)"/>
        ${ventaPts?`<polyline points="${ventaPts}" fill="none" stroke="var(--mk-accent)" stroke-width="2" opacity=".65" vector-effect="non-scaling-stroke"/>`:''}
        ${costoPts?`<polyline points="${costoPts}" fill="none" stroke="var(--mk-red)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:''}
      </svg></div>
      <div class="mck-chart-x"><span>${fmtPeriodo(ps[0])}</span><span>${fmtPeriodo(ps[Math.floor(ps.length/2)])}</span><span>${fmtPeriodo(ps[idxAct])} (actual)</span></div>
      <div class="mck-chart-stats">
        ${ckDelta!=null?`<span class="item">Costo/kg: <b style="color:${ckDelta>=0?'var(--mk-red)':'var(--mk-green)'}">${ckDelta>=0?'+':''}${ckDelta.toFixed(1)}%</b> (${fmtPeriodo(ps[ps.length-ck.filter(v=>v!=null).length])}→actual)</span>`:''}
        ${pkDelta!=null?`<span class="item">Precio/kg: <b style="color:${pkDelta>=0?'var(--mk-green)':'var(--mk-red)'}">${pkDelta>=0?'+':''}${pkDelta.toFixed(1)}%</b> (mismo período)</span>`:''}
      </div>
    </div>`;
  })()}
  </div>`;

  return html;
}

//  DXP — Detalle de reporte (formato I–V idéntico para los 11 reportes)
//  Base: el dashboard de Margen Variable del artifact aprobado.
//  Toda cifra sale de summaries.json (mes actual) o series.json (serie mensual).

// Detección de serie plana, misma regla que fetch_series.py: una medida cuya
// cantidad de valores distintos es ínfima frente a los meses con dato no es una
// tendencia real (la medida ignora el filtro de fecha en el modelo de Power BI).
function dxpSerieOk(arr) {
  if (!Array.isArray(arr)) return false;
  const v = arr.filter(x => x != null);
  if (v.length < 3) return false;
  // 1) Suficientes valores distintos
  const distintos = new Set(v.map(x => Math.round(x * 1e6))).size;
  if (distintos <= Math.max(2, Math.floor(v.length / 7))) return false;
  // 2) Amplitud relativa mínima: un rango < 1% de la media es ruido, no tendencia
  const mn = Math.min(...v), mx = Math.max(...v);
  const media = v.reduce((a, b) => a + b, 0) / v.length;
  if (media && Math.abs((mx - mn) / media) < 0.01) return false;
  // 3) Valor congelado: si un mismo valor ocupa más de la mitad de los meses,
  //    la medida quedó fija en la última medición y no refleja el mes.
  // Redondeo RELATIVO a la magnitud de la serie: así el ruido de coma flotante
  // (0.95971109 vs 0.95971062) no parte un mismo valor en dos buckets distintos.
  const conteo = {};
  v.forEach(x => { const k = Math.round(x / (media || 1) * 1e4); conteo[k] = (conteo[k] || 0) + 1; });
  if (Math.max(...Object.values(conteo)) > v.length / 2) return false;
  return true;
}
function dxpSerie(ds, medida) {
  const a = (SERIES && SERIES.datasets && SERIES.datasets[ds] || {})[medida];
  return dxpSerieOk(a) ? a : null;
}
