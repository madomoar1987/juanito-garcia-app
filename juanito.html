// Sección III — desglose real por reporte (barras / ratios), sin inventar nada.
function dxpDesglose(tipo, s) {
  const bar = (name, val, pct, color) => `<div class="bd-row"><span class="name">${name}</span><div class="bd-bar-track"><div class="bd-bar-fill" style="width:${Math.max(2,Math.min(100,pct))}%;background:${color}"></div></div><span class="val">${val}</span></div>`;
  const col = e => e === 'red' ? 'var(--red)' : e === 'yellow' ? 'var(--yellow)' : 'var(--green)';
  const mini = (l, v) => `<div class="stat-mini"><span>${l}</span><b>${v}</b></div>`;

  if (tipo === 'mermas') {
    const mx = Math.max(...[...(s.rp.mermas.por_uen||[]),...(s.rp.mermas.por_planta||[])].map(x=>parseVal(x.merma)||0)) || 1;
    return { t:'Desglose — UEN / Planta', h:
      (s.rp.mermas.por_uen||[]).map(u => bar(u.uen, u.merma, parseVal(u.merma)/mx*100, col(u.estado))).join('')
      + ((s.rp.mermas.por_planta||[]).length ? '<div style="height:8px"></div>' : '')
      + (s.rp.mermas.por_planta||[]).map(pl => bar(pl.planta, pl.merma, parseVal(pl.merma)/mx*100, col(pl.estado))).join('')
      + (s.ratioUen ? mini(`Ratio ${s.uenPeor.uen} / ${s.uenMejor.uen}`, s.ratioUen.toFixed(1)+'x') : '')
      + (s.ratioPla ? mini(`Ratio ${s.plaPeor.planta} / ${s.plaMejor.planta}`, s.ratioPla.toFixed(1)+'x') : '') };
  }
  if (tipo === 'margen_variable_pag2') {
    // Avance por canal — tabla "FACTURACION AL ..." del reporte 11,
    // pestaña RESUMEN 2 (la consulta del reporte 2026-09-06)
    const cs = s.rp.margen_variable_pag2?.por_canal || [];
    // Cumplimiento del programa de producción de AYER — mide una jornada,
    // no el mes; por eso va rotulado con el día.
    const cp = s.rp.margen_variable_pag2?.cumplimiento_produccion || [];
    if (!cs.length && !cp.length) return null;
    const mx = Math.max(...cs.map(c => c.avance || 0)) || 1;
    let h = '';
    if (cs.length) {
      h += cs.map(c => bar(c.canal,
                      (c.avance != null ? c.avance.toFixed(1) + '%' : '—'),
                      (c.avance || 0) / mx * 100,
                      col(c.avance == null ? 'sub'
                          : c.avance > 150 ? 'yellow'
                          : c.avance >= 100 ? 'green'
                          : c.avance >= 80 ? 'yellow' : 'red'))).join('')
        + cs.map(c => mini(`${c.canal} — ppto ${c.ppto}`, `facturado ${c.facturado}`)).join('');
    }
    if (cp.length) {
      h += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin:12px 0 6px">Cumplimiento del programa de producción — jornada anterior</div>`
        + cp.map(c => bar(c.categoria,
                          (c.pct != null ? c.pct.toFixed(1) + '%' : '—'),
                          c.pct || 0,
                          col(c.pct == null ? 'sub'
                              : c.pct >= 95 ? 'green'
                              : c.pct >= 80 ? 'yellow' : 'red'))).join('')
        + cp.map(c => mini(`${c.categoria} — programado ${c.programado} TN`,
                           `producido ${c.producido} TN`)).join('');
    }
    return { t:'Avance vs presupuesto — por canal', h };
  }
  if (tipo === 'margen_variable') {
    // Margen por cliente: de la pestaña "R. ORDEN DE VENTA" del reporte 3.
    // Va antes que el desglose por UEN porque una caída de margen suele
    // concentrarse en pocos clientes, no repartirse por unidad.
    const cli = s.rp.margen_variable?.por_cliente || [];
    if (cli.length) {
      const mxv = Math.max(...cli.map(c => parseVal(c.venta) || 0)) || 1;
      return { t:'Margen por cliente — dónde se concentra la venta', h:
        cli.map(c => bar(
            `${c.cliente}${c.margen ? ` · ${c.margen}` : ''}`,
            `${c.venta}${c.pct_venta != null ? ` · ${c.pct_venta}%` : ''}`,
            (parseVal(c.venta) || 0) / mxv * 100,
            col(parseFloat(c.margen) < 40 ? 'red'
                : parseFloat(c.margen) < 48 ? 'yellow' : 'green'))).join('')
        + (cli.some(c => c.caida)
           ? mini('Mayor caída de margen',
                  cli.slice().sort((a, b) => parseFloat(b.caida || 0) - parseFloat(a.caida || 0))[0].cliente)
           : '') };
    }
    const u = s.rp.margen_variable.por_uen || [];
    const mx = Math.max(...u.map(x=>parseVal(x.margen)||0)) || 1;
    return { t:'Desglose — Margen por UEN', h:
      u.map(x => bar(x.uen, x.margen, parseVal(x.margen)/mx*100, col(x.estado))).join('')
      + u.map(x => mini(`${x.uen} · precio / costo`, `${x.precio_kg} / ${x.costo_kg}`)).join('')
      + (s.ckIni != null ? mini(`Δ Costo/kg (${fmtPeriodo(s.ckIniP)}→${fmtPeriodo(s.ckFinP)})`, dxpSigno(s.ckDelta,1)) : '')
      + (s.pkDelta != null ? mini('Δ Precio/kg (mismo período)', dxpSigno(s.pkDelta,1)) : '') };
  }
  if (tipo === 'fill_rate') {
    const ov = parseVal(s.ordenVenta) || 1;
    return { t:'Desglose — cascada del pedido', h:
      bar('Orden Venta', s.ordenVenta, 100, 'var(--sub)')
      + bar('Facturado', s.facturacion, parseVal(s.facturacion)/ov*100, 'var(--green)')
      + bar('Venta Perdida', s.ventaPerdida, parseVal(s.ventaPerdida)/ov*100, 'var(--red)')
      + mini('Venta Perdida / Facturación', (parseVal(s.ventaPerdida)/parseVal(s.facturacion)*100).toFixed(1)+'%') };
  }
  if (tipo === 'control_interno') {
    const tp = parseVal(s.ciPlanes) || 1;
    const g = l => s.rp.control_interno.kpis.find(k=>k.label===l)?.valor;
    return { t:'Desglose — Planes de Acción', h:
      bar('Total', s.ciPlanes, 100, 'var(--sub)')
      + bar('Cerrados', g('Planes de Acción Cerrados'), parseVal(g('Planes de Acción Cerrados'))/tp*100, 'var(--green)')
      + bar('Atrasados', s.ciAtrasados, parseVal(s.ciAtrasados)/tp*100, 'var(--red)')
      + bar('Abiertos', g('Planes de Acción Abiertos'), parseVal(g('Planes de Acción Abiertos'))/tp*100, 'var(--yellow)')
      + mini('% Avance planes', g('% Avance Planes de Acción'))
      + mini('% Atrasados / Total', dxpPct(s.ciAtrasPct)) };
  }
  if (tipo === 'cuentas_por_pagar') {
    return { t:'Desglose — composición de la deuda', h:
      bar('Refinanciado', s.refinanciado, s.refPct, 'var(--yellow)')
      + bar('Corriente', fmtM(parseVal(s.cxpTotal)-parseVal(s.refinanciado)), 100-s.refPct, 'var(--green)')
      + mini('CxP promedio / proveedor', fmtM(parseVal(s.cxpTotal)/parseVal(s.proveedores))) };
  }
  if (tipo === 'consumo_materiales') {
    const cp = parseVal(s.kv('consumo_materiales','Costo x TN Producida')), cv = parseVal(s.kv('consumo_materiales','Costo x TN Vendida'));
    const pn = parseVal(s.kv('consumo_materiales','Producción Neta (KG)')), vn = parseVal(s.kv('consumo_materiales','Venta Neta (KG)'));
    return { t:'Desglose — eficiencia de costo', h:
      mini('Costo x TN Producida vs Vendida', ((cp/cv-1)*100).toFixed(2)+'%')
      + (pn&&vn ? mini('Producción / Venta Neta', (pn/vn).toFixed(2)+'x') : '') };
  }
  if (tipo === 'productividad') {
    const pr = parseVal(s.kv('productividad','Producción Total (KG)')), ve = parseVal(s.kv('productividad','Venta Neta (KG)'));
    const pp = parseVal(s.kv('productividad','Planilla S/. / KG Producido')), pv = parseVal(s.kv('productividad','Planilla S/. / KG Vendido'));
    return { t:'Desglose — planilla vs volumen', h:
      (pr&&ve ? mini('Venta Neta / Producción', (ve/pr).toFixed(3)+'x') : '')
      + (pp&&pv ? mini('Planilla/kg Vendido vs Producido', ((pv/pp-1)*100).toFixed(1)+'%') : '')
      + mini('Planilla Total', s.kv('productividad','Planilla Total')) };
  }
  if (tipo === 'compras') {
    // Faltantes y necesidad de compra: lo accionable del reporte 5, desde la
    // pestaña "ANALISIS DE COMPRA" (captura del Analizador).
    const fal = s.rp.compras?.faltantes || [];
    const nec = s.rp.compras?.necesidad_compra || [];
    if (fal.length || nec.length) {
      let h2 = '';
      if (fal.length) {
        const mxf = Math.max(...fal.map(f => parseVal(f.faltante) || 0)) || 1;
        h2 += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--red);letter-spacing:.04em;margin-bottom:6px">Materiales en quiebre — comprar</div>`
          + fal.map(f => bar(
              `${f.producto}${f.lead_time != null ? ` · ${f.lead_time}d` : ''}`,
              f.faltante, (parseVal(f.faltante) || 0) / mxf * 100, 'var(--red)')).join('');
      }
      if (nec.length) {
        const mxn = Math.max(...nec.map(n => n.items)) || 1;
        h2 += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin:12px 0 6px">Necesidad de compra — ítems por urgencia</div>`
          + nec.map(n => bar(n.momento, String(n.items), n.items / mxn * 100,
              /ahora|urgen|inmediat/i.test(n.momento) ? 'var(--red)'
              : /program/i.test(n.momento) ? 'var(--yellow)' : 'var(--green)')).join('');
      }
      return { t:'Compras — qué falta y qué pedir', h: h2 };
    }
    const c3 = parseVal(s.kv('compras','Consumo Prom 3M')), c6 = parseVal(s.kv('compras','Consumo Prom 6M'));
    const sv = parseVal(s.kv('compras','Stock Valorizado')), pp = parseVal(s.kv('compras','Stock PP (Punto de Pedido)'));
    const mxc = Math.max(c3, c6) || 1, mxs = Math.max(sv, pp) || 1;
    const nf = v => v.toLocaleString('es-PE', { maximumFractionDigits: 0 });
    return { t:'Desglose — consumo y stock', h:
      bar('Consumo 3M', nf(c3), c3/mxc*100, 'var(--accent)')
      + bar('Consumo 6M', nf(c6), c6/mxc*100, 'var(--sub)')
      + '<div style="height:8px"></div>'
      + bar('Stock Valorizado', fmtM(sv), sv/mxs*100, 'var(--green)')
      + bar('Punto de Pedido', nf(pp), pp/mxs*100, 'var(--yellow)')
      + mini('Consumo 3M − 6M', nf(c3-c6))
      + mini('Holgura sobre punto de pedido', fmtM(sv-pp)) };
  }
  if (tipo === 'cuentas_por_cobrar') {
    const mo = parseVal(s.mora), pv = parseVal(s.cxcVencer), vt = parseVal(s.ventas);
    return { t:'Desglose — cartera vs meta', h:
      bar('Morosidad', s.mora, mo/Math.max(mo,20)*100, 'var(--yellow)')
      + bar('Meta', '15%', 15/Math.max(mo,20)*100, 'var(--green)')
      + mini('Brecha sobre meta', (mo-15).toFixed(1)+' pts')
      + mini('CxC por vencer', s.cxcVencer)
      + mini('CxC por vencer / venta del mes', (pv/vt*100).toFixed(1)+'%')
      + `<div class="nd" style="margin-top:8px">El modelo no expone el tramo de vencimiento (30/60/90) ni el saldo total de cartera, así que no se puede abrir más sin capturarlo con la consulta del reporte.</div>` };
  }
  if (tipo === 'sop_inventario') {
    const inv = parseVal(s.kv('sop_inventario','Inventario Total'));
    const sv  = parseVal(s.kv('compras','Stock Valorizado'));
    const vt  = parseVal(s.ventas);
    const mxv = Math.max(inv, sv, vt) || 1;
    return { t:'Desglose — inventario en contexto', h:
      bar('Inventario S&OP', fmtM(inv), inv/mxv*100, 'var(--accent)')
      + bar('Stock Valorizado', fmtM(sv), sv/mxv*100, 'var(--yellow)')
      + bar('Venta del mes', fmtM(vt), vt/mxv*100, 'var(--green)')
      + mini('Inventario / venta del mes', (inv/vt).toFixed(2)+'x')
      + mini('Inventario vs Stock Valorizado', ((inv/sv-1)*100).toFixed(1)+'%') };
  }
  if (tipo === 'margen_variable_pag2') {
    const av = parseVal(s.avancePpto), vt = parseVal(s.ventas);
    const ppto = vt/(av/100);
    return { t:'Desglose — real vs presupuesto', h:
      bar('Avance', s.avancePpto, av, 'var(--green)')
      + bar('Meta', '100%', 100, 'var(--sub)')
      + mini('Venta real del mes', s.ventas)
      + mini('Presupuesto implícito (venta ÷ avance)', fmtM(ppto))
      + mini('Brecha en soles', fmtM(ppto - vt))
      + mini('Puntos por cerrar', (100-av).toFixed(1)+' pts') };
  }
  return { t:'Desglose', h:'<div class="nd">Este reporte no expone un desglose adicional en el modelo de Power BI — solo el agregado del mes.</div>' };
}

// Relaciones derivadas reales por reporte: cruzan KPIs que Power BI ya entrega
// para que ninguna sección quede vacía cuando no hay serie mensual.
function dxpDerivados(tipo, s) {
  const mini = (l, v) => `<div class="stat-mini"><span>${l}</span><b>${v}</b></div>`;
  const n = x => parseVal(x);
  const ventas = n(s.ventas);
  const g = (tp, l) => s.kv(tp, l);
  const pctDe = (a, b) => (a != null && b) ? (a / b * 100).toFixed(1) + '%' : '—';
  switch (tipo) {
    case 'control_interno': {
      const ev = n(s.ciEval);
      const sat = n(g('control_interno','Satisfactorio')), obs = n(g('control_interno','Con Observaciones')), cri = n(s.ciCritico);
      return mini('Satisfactorio / evaluados', pctDe(sat, ev))
           + mini('Con Observaciones / evaluados', pctDe(obs, ev))
           + mini('Crítico / evaluados', pctDe(cri, ev))
           + mini('Calificación / Puntos Teóricos', `${g('control_interno','Calificación')} / ${g('control_interno','Puntos Totales')}`)
           + mini('Planes cerrados / total', pctDe(n(g('control_interno','Planes de Acción Cerrados')), n(s.ciPlanes)));
    }
    case 'cuentas_por_cobrar':
      return mini('Morosidad vs meta 15%', `${(n(s.mora)-15).toFixed(1)} pts sobre`)
           + mini('CxC por vencer', s.cxcVencer)
           + mini('CxC por vencer / venta del mes', pctDe(n(s.cxcVencer), ventas))
           + mini('Venta del mes (referencia)', s.ventas);
    case 'cuentas_por_pagar':
      return mini('Refinanciado / CxP total', dxpPct(s.refPct))
           + mini('CxP total / venta del mes', pctDe(n(s.cxpTotal), ventas) + ' (x' + (n(s.cxpTotal)/ventas).toFixed(2) + ')')
           + mini('CxP promedio por proveedor', fmtM(n(s.cxpTotal)/n(s.proveedores)))
           + mini('Proveedores activos', s.proveedores);
    case 'compras': {
      const sv = n(g('compras','Stock Valorizado')), pp = n(g('compras','Stock PP (Punto de Pedido)'));
      const c3 = n(g('compras','Consumo Prom 3M')), c6 = n(g('compras','Consumo Prom 6M'));
      return mini('Stock Valorizado / Punto de Pedido', (sv/pp).toFixed(2) + 'x')
           + mini('Consumo Prom 3M vs 6M', ((c3/c6-1)*100).toFixed(2) + '%')
           + mini('Stock Valorizado / venta del mes', pctDe(sv, ventas))
           + mini('Inventario S&OP (referencia)', g('sop_inventario','Inventario Total'));
    }
    case 'consumo_materiales': {
      const cp = n(g('consumo_materiales','Costo x TN Producida')), cv = n(g('consumo_materiales','Costo x TN Vendida'));
      const pn = n(g('consumo_materiales','Producción Neta (KG)')), vn = n(g('consumo_materiales','Venta Neta (KG)'));
      return mini('Costo x TN Producida vs Vendida', ((cp/cv-1)*100).toFixed(2) + '%')
           + mini('Producción Neta / Venta Neta', (pn/vn).toFixed(2) + 'x')
           + mini('Costo Total / venta del mes', pctDe(n(g('consumo_materiales','Costo Total')), ventas))
           + mini('Costo Total', g('consumo_materiales','Costo Total'));
    }
    case 'productividad': {
      const pt = n(g('productividad','Planilla Total'));
      const pr = n(g('productividad','Producción Total (KG)')), ve = n(g('productividad','Venta Neta (KG)'));
      const pp = n(g('productividad','Planilla S/. / KG Producido')), pv = n(g('productividad','Planilla S/. / KG Vendido'));
      return mini('Planilla Total / venta del mes', pctDe(pt, ventas))
           + mini('Venta Neta / Producción (KG)', (ve/pr).toFixed(3) + 'x')
           + mini('Planilla/kg Vendido vs Producido', ((pv/pp-1)*100).toFixed(1) + '%')
           + mini('Planilla Total', g('productividad','Planilla Total'));
    }
    case 'sop_inventario': {
      const inv = n(g('sop_inventario','Inventario Total'));
      return mini('Inventario / venta del mes', pctDe(inv, ventas) + ' (x' + (inv/ventas).toFixed(2) + ')')
           + mini('Inventario vs Stock Valorizado (Compras)', `${g('sop_inventario','Inventario Total')} vs ${g('compras','Stock Valorizado')}`)
           + mini('Venta del mes (referencia)', s.ventas);
    }
    case 'margen_variable_pag2':
      return mini('Avance vs meta 100%', `${(100-n(s.avancePpto)).toFixed(1)} pts por cerrar`)
           + mini('Venta del mes', s.ventas)
           + mini('Presupuesto implícito (venta ÷ avance)', fmtM(ventas / (n(s.avancePpto)/100)))
           + mini('Brecha en soles', fmtM(ventas/(n(s.avancePpto)/100) - ventas));
    default: return '';
  }
}

// Evidencia numérica de por qué una serie fue descartada + qué medidas del mismo
// dataset sí varían (para no dejar la sección en un simple aviso de texto).
function dxpEvidenciaPlana(cfg) {
  const ds = (SERIES && SERIES.datasets && SERIES.datasets[cfg.ds]) || {};
  const a = (ds[cfg.medida] || []).filter(x => x != null);
  if (!a.length) return '';
  const mn = Math.min(...a), mx = Math.max(...a), med = a.reduce((x,y)=>x+y,0)/a.length;
  const varPct = med ? Math.abs((mx-mn)/med*100) : 0;
  const f = v => Math.abs(v) >= 1e6 ? fmtM(v) : (Math.abs(v) < 1 ? (v*100).toFixed(2)+'%' : v.toLocaleString('es-PE',{maximumFractionDigits:2}));
  const otras = Object.keys(ds).filter(k => k !== cfg.medida && dxpSerieOk(ds[k]));
  const mini = (l,v) => `<div class="stat-mini"><span>${l}</span><b>${v}</b></div>`;
  return `<div class="nd" style="margin-bottom:8px">Serie descartada: <b>${cfg.medida}</b> no filtra por fecha en el modelo — estas son las cifras que lo prueban.</div>`
    + mini('Meses con dato', a.length)
    + mini('Mínimo / Máximo', `${f(mn)} / ${f(mx)}`)
    + mini('Variación total del período', varPct.toFixed(3) + '%')
    + mini('Valores distintos', new Set(a.map(x=>Math.round(x/(med||1)*1e4))).size + ' en ' + a.length + ' meses')
    + (otras.length ? mini('Sí varían en este dataset', otras.join(', ')) : '');
}

// Sección II — comparativo (MoM / YoY / acumulado) desde la serie confiable.
function dxpComparativo(tipo, s) {
  const cfg = DXP_SERIE_CFG[tipo];
  const der = dxpDerivados(tipo, s);
  if (!cfg) return (der || '') + (der ? '<div class="nd" style="margin-top:10px">' : '<div class="nd">') + (DXP_SIN_SERIE_MOTIVO[tipo] || 'Sin serie mensual disponible.') + '</div>';
  const arr = dxpSerie(cfg.ds, cfg.medida);
  if (!arr) return dxpEvidenciaPlana(cfg) + (der ? '<div style="height:10px"></div>' + der : '');
  const ps = s.ps, k = cfg.pct ? 100 : 1;
  const val = arr.map((v,i)=>({v,i})).filter(x=>x.v!=null);
  const act = val[val.length-1], prev = val[val.length-2];
  const iYoY = ps.indexOf(ps[act.i].slice(0,4)-1 + ps[act.i].slice(4));
  const yoyV = iYoY >= 0 ? arr[iYoY] : null;
  const mom = prev ? (cfg.pct ? (act.v-prev.v)*100 : (act.v/prev.v-1)*100) : null;
  const yoy = yoyV != null ? (cfg.pct ? (act.v-yoyV)*100 : (act.v/yoyV-1)*100) : null;
  const prom = val.reduce((a,b)=>a+b.v,0)/val.length;
  const mx = val.reduce((a,b)=>b.v>a.v?b:a), mn = val.reduce((a,b)=>b.v<a.v?b:a);
  const fmtv = v => cfg.pct ? (v*100).toFixed(2)+'%' : (Math.abs(v)>=1e6 ? fmtM(v) : v.toFixed(2));
  const fueraMeta = cfg.meta != null ? val.filter(x => cfg.metaArriba ? x.v*k > cfg.meta : x.v*k < cfg.meta).length : null;
  const buenoMoM = cfg.metaArriba ? (mom < 0) : (mom > 0);
  const buenoYoY = cfg.metaArriba ? (yoy < 0) : (yoy > 0);
  return `
    <div class="comp-line"><span class="l">MoM · vs ${prev?fmtPeriodo(ps[prev.i]):'—'}</span><span class="${mom==null?'flat-c':buenoMoM?'up-c':'down-c'}">${mom==null?'—':(mom>=0?'▲ +':'▼ ')+Math.abs(mom).toFixed(2)+(cfg.pct?' pts':'%')}</span></div>
    <div class="comp-line"><span class="l">YoY · vs ${iYoY>=0?fmtPeriodo(ps[iYoY]):'—'}</span><span class="${yoy==null?'flat-c':buenoYoY?'up-c':'down-c'}">${yoy==null?'—':(yoy>=0?'▲ +':'▼ ')+Math.abs(yoy).toFixed(2)+(cfg.pct?' pts':'%')}</span></div>
    <div class="stat-mini" style="margin-top:8px"><span>Promedio ${val.length} meses</span><b>${fmtv(prom)}</b></div>
    <div class="stat-mini"><span>Máximo</span><b>${fmtv(mx.v)} (${fmtPeriodo(ps[mx.i])})</b></div>
    <div class="stat-mini"><span>Mínimo</span><b>${fmtv(mn.v)} (${fmtPeriodo(ps[mn.i])})</b></div>
    ${fueraMeta != null ? `<div class="stat-mini"><span>Meses fuera de meta ${cfg.meta}%</span><b style="color:var(--red)">${fueraMeta} / ${val.length}</b></div>` : ''}`;
}

// Panel de tendencia grande (idéntico al de Margen en el artifact).

// Panel de segmentos: grafica TODAS las series del dataset de un reporte, no
// solo la principal. Nace de una carencia concreta — se estaban trayendo 10
// series de Mermas y 7 de Compras, y la app graficaba una sola de cada una,
// así que era imposible ver de qué unidad de negocio o planta viene un
// problema sin abrir Power BI.
//
// Las series se agrupan por su prefijo (todas las "% Merma …" juntas, todas
// las "% Ratio …" juntas) para que se comparen entre sí en la misma escala.
function dxpGrupoSeries(ds) {
  const todas = (SERIES && SERIES.datasets && SERIES.datasets[ds]) || {};
  const grupos = {};
  // El agrupamiento sale de los propios nombres, no de una lista fija: se
  // busca el prefijo de palabras más largo que compartan al menos dos series
  // ("% Merma", "Costo unitario"…) y el resto del nombre queda de etiqueta.
  // Antes solo se reconocían las que empezaban con "%", así que series como
  // "Costo unitario B&D" quedaban sueltas.
  const claves = Object.keys(todas).filter(k => dxpSerieOk(todas[k]));
  const asignada = {};
  for (let n = 4; n >= 1; n--) {
    const cubos = {};
    claves.forEach(k => {
      if (asignada[k]) return;
      const w = k.split(/\s+/);
      if (w.length <= n) return;               // el prefijo dejaría sin etiqueta
      const pre = w.slice(0, n).join(' ');
      (cubos[pre] = cubos[pre] || []).push(k);
    });
    Object.keys(cubos).forEach(pre => {
      if (cubos[pre].length < 2) return;
      cubos[pre].forEach(k => {
        asignada[k] = true;
        (grupos[pre] = grupos[pre] || []).push({
          etq: k.slice(pre.length).trim(), arr: todas[k], clave: k });
      });
    });
  }
  // Solo interesan los grupos con más de una serie: ahí está la comparación.
  Object.keys(grupos).forEach(g => { if (grupos[g].length < 2) delete grupos[g]; });
  return grupos;
}

// Aviso de dato viejo. Fill Rate lleva 17 meses sin refrescarse en Power BI
// y su 88% se lee como el de este mes. Un KPI desactualizado presentado como
// actual es peor que no tenerlo, así que se marca en la propia pantalla.
function dxpAvisoVigencia(tipo) {
  const cfg = DXP_SERIE_CFG[tipo];
  if (!cfg || !SERIES) return '';
  const ds = SERIES.datasets?.[cfg.ds] || {};
  const per = SERIES.periodos || [];
  let ultimo = null;
  Object.values(ds).forEach(arr => {
    if (!Array.isArray(arr)) return;
    for (let i = arr.length - 1; i >= 0; i--)
      if (arr[i] != null) { if (!ultimo || per[i] > ultimo) ultimo = per[i]; break; }
  });
  if (!ultimo) return '';
  const [a, m] = ultimo.split('-').map(Number);
  const hoy = new Date();
  const meses = (hoy.getFullYear() - a) * 12 + (hoy.getMonth() + 1 - m);
  if (meses <= 2) return '';
  return `<div style="margin-top:10px;padding:9px 11px;border-radius:8px;
      background:var(--yellow-soft);border:1px solid var(--border);
      font-size:11px;line-height:1.5;color:var(--ink)">
    <b>Dato desactualizado.</b> El último mes con información es <b>${ultimo}</b>,
    hace ${meses} meses. Las cifras de este reporte no reflejan la situación actual —
    el dataset no se está refrescando en Power BI.
  </div>`;
}

function dxpPanelSegmentos(tipo, s) {
  const cfg = DXP_SERIE_CFG[tipo];
  if (!cfg) return '';
  const grupos = dxpGrupoSeries(cfg.ds);
  const nombres = Object.keys(grupos);
  if (!nombres.length) return '';

  const per = (SERIES && SERIES.periodos) || [];
  const PAL = ['#0F2A4A', '#B23A2F', '#3D7A4B', '#966412', '#5F6B7A', '#7A4B8C'];

  const bloques = nombres.map(g => {
    const series = grupos[g].slice().sort((a, b) => {
      const ua = dxpUltimo(a.arr), ub = dxpUltimo(b.arr);
      return (ub ? ub.v : 0) - (ua ? ua.v : 0);
    });
    // Escala común a todo el grupo: es lo que permite comparar de un vistazo.
    let mn = Infinity, mx = -Infinity;
    series.forEach(x => x.arr.forEach(v => {
      if (v == null) return;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }));
    const rg = (mx - mn) || 1;
    const W = 560, H = 130, PADX = 4;
    const n = per.length - 1 || 1;
    const linea = arr => arr.map((v, i) => v == null ? null
        : `${PADX + i / n * (W - PADX * 2)},${H - 10 - (v - mn) / rg * (H - 26)}`)
      .filter(Boolean).join(' ');

    const esPct = /^%/.test(g);
    const fmt = v => esPct ? (v * 100).toFixed(2) + '%'
                           : (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + 'M'
                              : v.toLocaleString('es-PE', { maximumFractionDigits: 0 }));

    return `<div class="seg-bloque">
      <div class="seg-titulo">${g} — comparación por segmento</div>
      <svg viewBox="0 0 ${W} ${H}" class="seg-svg" preserveAspectRatio="none" role="img"
           aria-label="Evolución mensual de ${g} por segmento">
        ${series.map((x, i) => `<polyline points="${linea(x.arr)}" fill="none"
          stroke="${PAL[i % PAL.length]}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`).join('')}
      </svg>
      <div class="seg-leyenda">
        ${series.map((x, i) => {
          const u = dxpUltimo(x.arr);
          return `<span class="seg-item">
            <i style="background:${PAL[i % PAL.length]}"></i>${x.etq}
            <b>${u ? fmt(u.v) : '—'}</b></span>`;
        }).join('')}
      </div>
      <div class="seg-pie">Último mes con dato: ${(() => {
        const u = dxpUltimo(series[0].arr);
        return u ? per[u.i] : '—';
      })()} · escala común a todas las líneas del grupo</div>
    </div>`;
  }).join('');

  return `<div class="seg-panel">
    <div class="seg-cab">Desglose por segmento — de dónde viene el número</div>
    ${bloques}
  </div>`;
}

// Series del dataset que no aparecen ni en el panel principal ni agrupadas por
// segmento. Sin esto quedaban invisibles: se traían de Power BI y nadie las
// veía (producción en kg, planilla, cantidades de compra y consumo, etc.).
function dxpOtrasSeries(tipo) {
  const cfg = DXP_SERIE_CFG[tipo];
  if (!cfg) return '';
  const todas = (SERIES && SERIES.datasets && SERIES.datasets[cfg.ds]) || {};
  const grupos = dxpGrupoSeries(cfg.ds);
  const yaVistas = new Set([cfg.medida, cfg.extra].filter(Boolean));
  Object.values(grupos).forEach(g => g.forEach(x => yaVistas.add(x.clave)));

  const per = (SERIES && SERIES.periodos) || [];
  const restantes = Object.keys(todas)
    .filter(k => !yaVistas.has(k) && dxpSerieOk(todas[k]));
  if (!restantes.length) return '';

  const W = 240, H = 44;
  const spark = arr => {
    const v = arr.filter(x => x != null);
    const mn = Math.min(...v), mx = Math.max(...v), rg = (mx - mn) || 1;
    const n = arr.length - 1 || 1;
    return arr.map((x, i) => x == null ? null
        : `${i / n * W},${H - 4 - (x - mn) / rg * (H - 8)}`).filter(Boolean).join(' ');
  };
  const fmt = (k, v) => /^%/.test(k) ? (v * 100).toFixed(2) + '%'
      : (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + 'M'
         : v.toLocaleString('es-PE', { maximumFractionDigits: 0 }));

  return `<div class="seg-panel">
    <div class="seg-cab">Otras series de este reporte</div>
    <div class="otras-grid">
      ${restantes.map(k => {
        const u = dxpUltimo(todas[k]);
        return `<div class="otra-card">
          <div class="otra-t">${k}</div>
          <svg viewBox="0 0 ${W} ${H}" class="otra-svg" preserveAspectRatio="none" role="img"
               aria-label="Evolución mensual de ${k}">
            <polyline points="${spark(todas[k])}" fill="none" stroke="var(--navy)"
                      stroke-width="1.6" vector-effect="non-scaling-stroke"/>
          </svg>
          <div class="otra-v">${u ? fmt(k, u.v) : '—'}
            <span>${u ? per[u.i] : ''}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// Último valor no nulo de una serie, con su posición.
function dxpUltimo(arr) {
  if (!Array.isArray(arr)) return null;
  for (let i = arr.length - 1; i >= 0; i--)
    if (arr[i] != null) return { v: arr[i], i };
  return null;
}


function dxpTrendPanel(tipo, s) {
  const cfg = DXP_SERIE_CFG[tipo];
  const motivo = DXP_SIN_SERIE_MOTIVO[tipo];
  if (!cfg) return `<div class="no-trend-box"><span class="icon">⊗</span><span class="txt"><b>Sin gráfico de tendencia MoM / Acumulado / YoY.</b> ${motivo||'No hay serie mensual para este reporte.'}</span></div>`;
  const arr = dxpSerie(cfg.ds, cfg.medida);
  if (!arr) return `<div class="no-trend-box"><span class="icon">⊗</span><span class="txt"><b>Gráfico descartado por calidad de dato.</b> La medida <b>${cfg.medida}</b> devuelve casi el mismo valor en todos los meses del período — no filtra por fecha en el modelo de Power BI. Graficarla mostraría una tendencia falsa.</span></div>`;

  const ps = s.ps;
  const extra = cfg.extra ? dxpSerie(cfg.ds, cfg.extra) : null;
  const pts = a => {
    const v = a.map((x,i)=>({x,i})).filter(o=>o.x!=null);
    const mn = Math.min(...v.map(o=>o.x)), mx = Math.max(...v.map(o=>o.x)), rg = (mx-mn)||1;
    const n = a.length-1 || 1;
    return { d: v.map(o=>`${(o.i/n*700).toFixed(1)},${(176-(o.x-mn)/rg*168-4).toFixed(1)}`).join(' '), v, mn, mx };
  };
  const A = pts(arr), B = extra ? pts(extra) : null;
  const val = A.v, act = val[val.length-1], prev = val[val.length-2];
  const k = cfg.pct ? 100 : 1;
  const mom = prev ? (cfg.pct ? (act.x-prev.x)*100 : (act.x/prev.x-1)*100) : null;
  const iYoY = ps.indexOf((parseInt(ps[act.i].slice(0,4))-1) + ps[act.i].slice(4));
  const yoyV = iYoY >= 0 ? arr[iYoY] : null;
  const yoy = yoyV != null ? (cfg.pct ? (act.x-yoyV)*100 : (act.x/yoyV-1)*100) : null;
  const fmtv = v => cfg.pct ? (v*100).toFixed(2)+'%' : (Math.abs(v)>=1e6 ? fmtM(v) : 'S/'+v.toFixed(2));
  // Acumulado del año en curso vs mismo tramo del año anterior
  const aAct = ps[act.i].slice(0,4), aAnt = String(parseInt(aAct)-1);
  const comp = mesesComparables(arr, ps, aAnt, aAct);
  // Solo se suma cuando la métrica es aditiva (un flujo). Precios/costos unitarios,
  // porcentajes y saldos se promedian: "costo x kilo acumulado" no significa nada.
  const aditiva = cfg.acum === 'suma';
  const agg = (a2,ps2,an,cm) => aditiva ? sumaEn(a2,ps2,an,cm) : promEn(a2,ps2,an,cm);
  const acumB = comp.length ? agg(arr,ps,aAct,comp) : null;
  const acumA = comp.length ? agg(arr,ps,aAnt,comp) : null;
  const acumVar = (acumA && acumB) ? (cfg.pct ? (acumB-acumA)*100 : (acumB/acumA-1)*100) : null;
  const buenoMoM = cfg.metaArriba ? (mom<0) : (mom>0), buenoYoY = cfg.metaArriba ? (yoy<0) : (yoy>0), buenoAc = cfg.metaArriba ? (acumVar<0) : (acumVar>0);
  const metaY = cfg.meta != null ? (176 - ((cfg.meta/k) - A.mn)/((A.mx-A.mn)||1)*168 - 4) : null;

  return `
  <div class="trend-panel">
    <div class="trend-panel-h">
      <div class="roman-h"><span class="rn">II</span>Tendencia mensual — ${cfg.label}</div>
      <span class="src">Fuente: series.json · ${val.length} puntos (${fmtPeriodo(ps[val[0].i])} → ${fmtPeriodo(ps[act.i])})</span>
    </div>
    <div class="compare-cards">
      <div class="cc"><div class="cc-label">MoM · vs ${prev?fmtPeriodo(ps[prev.i]):'—'}</div>
        <div class="cc-val ${mom==null?'flat-c':buenoMoM?'up-c':'down-c'}">${mom==null?'—':(mom>=0?'▲ +':'▼ ')+Math.abs(mom).toFixed(2)+(cfg.pct?' pts':'%')}</div>
        <div class="cc-sub">${prev?fmtv(prev.x)+' → '+fmtv(act.x):'sin mes previo'}</div></div>
      <div class="cc"><div class="cc-label">Acumulado ${comp.length?comp.length+' meses '+aAct:'—'}</div>
        <div class="cc-val ${acumVar==null?'flat-c':buenoAc?'up-c':'down-c'}">${acumB==null?'—':fmtv(acumB)}</div>
        <div class="cc-sub">${aditiva?'suma':'promedio'} del tramo comparable${acumA!=null?` · ${aAnt}: ${fmtv(acumA)}`:''}</div></div>
      <div class="cc"><div class="cc-label">YoY · vs ${aAnt}</div>
        <div class="cc-val ${yoy==null?'flat-c':buenoYoY?'up-c':'down-c'}">${yoy==null?'—':(yoy>=0?'▲ +':'▼ ')+Math.abs(yoy).toFixed(2)+(cfg.pct?' pts':'%')}</div>
        <div class="cc-sub">${yoyV!=null?fmtv(yoyV)+' → '+fmtv(act.x):'sin dato del año anterior'}</div></div>
    </div>
    <div class="chart-legend">
      <span class="lg"><span class="sw" style="background:var(--red)"></span>${cfg.label} (${val.length} pts)</span>
      ${B?`<span class="lg"><span class="sw" style="background:var(--accent)"></span>${cfg.label2} (escala propia)</span>`:''}
      ${cfg.meta!=null?`<span class="lg"><span class="sw" style="background:var(--sub);opacity:.5"></span>Meta ${cfg.meta}%</span>`:''}
    </div>
    <div class="chart-big"><svg viewBox="0 0 700 180" preserveAspectRatio="none">
      <line x1="0" y1="4" x2="700" y2="4" stroke="var(--border)" stroke-dasharray="2,4"/>
      <line x1="0" y1="61" x2="700" y2="61" stroke="var(--border)" stroke-dasharray="2,4"/>
      <line x1="0" y1="119" x2="700" y2="119" stroke="var(--border)" stroke-dasharray="2,4"/>
      <line x1="0" y1="176" x2="700" y2="176" stroke="var(--border)"/>
      ${metaY!=null && metaY>=0 && metaY<=176 ? `<line x1="0" y1="${metaY.toFixed(1)}" x2="700" y2="${metaY.toFixed(1)}" stroke="var(--sub)" stroke-dasharray="4,3" opacity=".6"/>` : ''}
      ${B?`<polyline points="${B.d}" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".6" vector-effect="non-scaling-stroke"/>`:''}
      <polyline points="${A.d}" fill="none" stroke="var(--red)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    </svg></div>
    <div class="chart-axis-labels"><span>${fmtPeriodo(ps[val[0].i])}</span><span>${fmtPeriodo(ps[Math.floor((val[0].i+act.i)/2)])}</span><span>${fmtPeriodo(ps[act.i])} (actual)</span></div>
    <div class="chart-stats-row">
      <span class="item">Actual <b>${fmtv(act.x)}</b></span>
      <span class="item">Máximo <b>${fmtv(A.mx)}</b></span>
      <span class="item">Mínimo <b>${fmtv(A.mn)}</b></span>
      ${cfg.meta!=null?`<span class="item">Meta <b>${cfg.meta}%</b></span>`:''}
    </div>
  </div>`;
}

// ── Detalle completo de un reporte (I–V + tendencia) ──────────────────────
function showDetail(empresa, tipo, label, archivo, desc) {
  const screenEl = document.getElementById('screen-' + currentTab);
  navHistory.push({ screen: 'screen-' + currentTab, tab: currentTab, savedHtml: screenEl ? screenEl.innerHTML : '' });
  const rd = ((DATA.empresas || {})[empresa] || {}).reportes?.[tipo] || {};
  const s = dxpStats();
  const idx = DXP_ORDEN.indexOf(tipo);
  const est = rd.estado === 'red' ? 'crit' : rd.estado === 'yellow' ? 'warn' : 'ok';
  const estTxt = est === 'crit' ? 'Crítico' : est === 'warn' ? 'Atención' : 'Sin alerta';
  const stripe = est === 'crit' ? 'var(--red)' : est === 'warn' ? 'var(--yellow)' : 'var(--green)';
  const nombre = DXP_NOMBRE[tipo] || label || tipo;

  // Medidas que Power BI sí entrega en series.json pero que no vienen en
  // summaries.json — se agregan como KPI real (con su período de origen).
  const EXTRA_SERIE = {
    mermas:            [{ ds:'mermas',     medida:'Merma',           label:'Merma (medida absoluta)', pct:true }],
    cuentas_por_pagar: [{ ds:'cxp',        medida:'Refinanciamiento',label:'Refinanciamiento (serie)', money:true },
                        { ds:'cxp',        medida:'Proveedores',     label:'Proveedores (serie)' }],
    sop_inventario:    [{ ds:'inventario', medida:'Stock Total',     label:'Stock Total (kg)' }],
    margen_variable:   [{ ds:'margen',     medida:'Ventas (S/.)',     label:'Ventas (S/.)', money:true }],
    fill_rate:         [{ ds:'fill_rate',  medida:'ORDEN DE VENTA',  label:'Orden de Venta (serie)', money:true }],
  };
  const extras = (EXTRA_SERIE[tipo] || []).map(e => {
    const a = (SERIES?.datasets?.[e.ds] || {})[e.medida];
    if (!Array.isArray(a)) return null;
    const v = a.map((x,i)=>({x,i})).filter(o=>o.x!=null);
    if (!v.length) return null;
    const u = v[v.length-1];
    const val = e.pct ? (u.x*100).toFixed(2)+'%' : e.money ? fmtM(u.x) : u.x.toLocaleString('es-PE',{maximumFractionDigits:2});
    return { label: e.label, valor: val, periodo: s.ps[u.i] };
  }).filter(Boolean);

  const kpis = rd.kpis || [];
  const PREF = { margen_variable:'Margen variable', margen_variable_pag2:'Avance vs Ppto',
                 cuentas_por_pagar:'CxP Total', compras:'Stock Valorizado' };
  const hero = (PREF[tipo] && kpis.find(k => k.label === PREF[tipo])) || kpis[0] || {};
  const resto = kpis.filter(k => k !== hero);
  const cls = e => e === 'red' ? 'crit' : e === 'yellow' ? 'warn' : e === 'green' ? 'ok' : '';
  // Los KPI que llegan como número crudo ("1825611") se muestran con separador
  // de miles; el valor no cambia, solo su legibilidad.
  const fmtKpi = v => (typeof v === 'string' && /^\d{4,}(\.\d+)?$/.test(v.trim()))
    ? Number(v).toLocaleString('es-PE', { maximumFractionDigits: 2 }) : v;
  const brecha = (hero.meta && parseVal(hero.valor) != null && parseVal(hero.meta) != null)
    ? (parseVal(hero.valor) - parseVal(hero.meta)) : null;

  const cfgSerie = DXP_SERIE_CFG[tipo];
  const serieOk = cfgSerie ? !!dxpSerie(cfgSerie.ds, cfgSerie.medida) : false;
  const sub = `${hero.label || 'KPI principal'} · mes actual${serieOk ? ' + serie mensual confiable' : ' · sin serie mensual confiable'}`;

  const desg = dxpDesglose(tipo, s);
  const pal = dxpPalancas(tipo, s);
  const vac = dxpVacios(tipo, s);
  const chat = `Analiza el reporte "${nombre}" de ${empresa}: ${hero.label} ${hero.valor}${hero.meta?` (meta ${hero.meta})`:''}. ${rd.alerta||''} ¿Qué significa y qué debo hacer?`;

  screenEl.innerHTML = `
  <div class="dxp"><div class="wrap">
    <button class="back-link" onclick="goBack()">← Volver al resumen</button>
    <div class="detail-head" style="--stripe:${stripe}">
      <div>
        <div class="detail-title">${idx>=0?String(idx+1).padStart(2,'0')+' · ':''}${nombre}</div>
        <div class="detail-sub">${sub}</div>
      </div>
      <span class="pill ${est}">${estTxt}</span>
    </div>

    <div class="roman-grid">
      <div>
        <div class="roman-h"><span class="rn">I</span>KPIs</div>
        ${hero.valor ? `<div class="hero-l">${hero.label}</div><div class="hero-v" style="color:${stripe}">${fmtKpi(hero.valor)}</div>` : ''}
        ${hero.meta ? `<div class="kv"><span class="l">Meta</span><span class="v">${hero.meta}</span></div>` : ''}
        ${brecha != null ? `<div class="kv"><span class="l">Brecha</span><span class="v ${est}">${(brecha>=0?'+':'')+brecha.toFixed(2)} pts</span></div>` : ''}
        ${resto.map(k => `<div class="kv"><span class="l">${k.label}</span><span class="v ${cls(k.estado)}">${fmtKpi(k.valor)}${k.meta?` <small>meta ${k.meta}</small>`:''}</span></div>`).join('')}
        ${extras.map(e => `<div class="kv"><span class="l">${e.label}</span><span class="v">${e.valor}<small>${fmtPeriodo(e.periodo)}</small></span></div>`).join('')}
        ${rd.alerta ? `<div class="nd" style="margin-top:12px">${rd.alerta}</div>` : ''}
      </div>

      <div>
        <div class="roman-h"><span class="rn">II</span>Comparativo</div>
        ${dxpComparativo(tipo, s)}
      </div>

      <div>
        <div class="roman-h"><span class="rn">III</span>${desg.t}</div>
        ${desg.h}
      </div>

      <div>
        <div class="roman-h"><span class="rn">IV</span>Palancas</div>
        ${pal.length ? pal.map(p => `<div class="palanca">
          <div class="palanca-top"><span class="palanca-nombre">${p.n}</span><span class="pr ${p.pr}">${p.pr}</span></div>
          <div class="palanca-impacto">${p.imp}</div>
          <div class="nd" style="margin-top:4px">${p.acc}</div>
        </div>`).join('') : '<div class="nd">Sin palancas pendientes para este reporte.</div>'}
      </div>

      <div>
        <div class="roman-h"><span class="rn">V</span>Vacíos</div>
        ${vac.length ? vac.map(v => `<div class="vacio-item"><span class="mk">▸</span>${v}</div>`).join('') : '<div class="nd">Sin vacíos de información registrados.</div>'}
      </div>

      ${dxpTrendPanel(tipo, s)}
      ${dxpAvisoVigencia(tipo)}
      ${dxpPanelSegmentos(tipo, s)}
      ${dxpOtrasSeries(tipo)}
    </div>

    <div class="cta-ia"><button data-msg="${chat.replace(/"/g,'&quot;')}" onclick="openChatWithMsg(this.dataset.msg)">Preguntar a Juanito sobre este reporte</button></div>
    <div class="deck-footer"><span>PAUNO — Diagnóstico Ejecutivo</span><span class="conf">Confidencial · Uso interno</span><span>${idx>=0?String(idx+1).padStart(2,'0')+' · ':''}${nombre}</span></div>
  </div></div>`;

  const sc = document.getElementById('screens-container'); if (sc) sc.scrollTop = 0;
  const bb = document.getElementById('back-btn'); if (bb) bb.classList.add('visible');
}

function goBack() {
  if (!navHistory.length) { showTab(currentTab); return; }
  const prev = navHistory.pop();
  if (prev.savedHtml !== undefined) {
    const el = document.getElementById(prev.screen);
    if (el) el.innerHTML = prev.savedHtml;
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(prev.screen).classList.add('active');
  document.getElementById('top-title').textContent = prev.tab === 'home' ? 'Juanito Garcia' : prev.tab.toUpperCase();
  document.getElementById('top-badge').textContent = DATA.fecha || '';
  if (!navHistory.length) document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('screens-container').scrollTop = 0;
}

// Genera chips de seguimiento según la pregunta respondida
function chipsFollowUp(pregunta) {
  const p = pregunta.toLowerCase();
  if (p.includes('decid') || p.includes('hoy')) {
    return ['¿Cómo está la mora?', '¿Cómo van las compras?', 'Avance vs presupuesto'];
  }
  if (p.includes('mora') || p.includes('cobrar') || p.includes('cxc')) {
    return ['¿Cómo está la caja?', 'Avance vs presupuesto', '¿Cómo está el margen?'];
  }
  if (p.includes('compra') || p.includes('ratio') || p.includes('consumo')) {
    return ['¿Cómo está el inventario?', '¿Qué debo decidir hoy?', '¿Cómo está el margen?'];
  }
  if (p.includes('inventario') || p.includes('stock') || p.includes('s&op') || p.includes('dead')) {
    return ['¿Cómo van las compras?', '¿Qué debo decidir hoy?', 'Avance vs presupuesto'];
  }
  if (p.includes('presupuesto') || p.includes('avance') || p.includes('canal') || p.includes('ppto')) {
    return ['¿Cómo está la mora?', '¿Cómo está el margen?', '¿Qué debo decidir hoy?'];
  }
  if (p.includes('margen') || p.includes('venta') || p.includes('ingreso')) {
    return ['¿Cómo van las compras?', 'Avance vs presupuesto', '¿Cómo está la mora?'];
  }
  if (p.includes('caja') || p.includes('cash') || p.includes('flujo') || p.includes('liquidez')) {
    return ['¿Qué debo decidir hoy?', '¿Cómo está la mora?', '¿Cómo está el margen?'];
  }
  if (p.includes('merma') || p.includes('productividad') || p.includes('planilla')) {
    return ['¿Cómo está el margen?', '¿Cómo van las compras?', '¿Qué debo decidir hoy?'];
  }
  if (p.includes('fill') || p.includes('venta perdida') || p.includes('facturaci')) {
    return ['¿Cómo están las ventas?', '¿Cómo está el margen?', 'Avance vs presupuesto'];
  }
  if (p.includes('pauno')) {
    return ['¿Cómo está la mora?', '¿Cómo van las compras?', 'Avance vs presupuesto'];
  }
  return ['¿Qué debo decidir hoy?', '¿Cómo van las compras?', 'Avance vs presupuesto'];
}

// Un mismo nombre de desglose (por_uen) aparece en reportes distintos con
// campos distintos, así que el valor puede declararse como lista y se toma
// el primer campo que exista de verdad en la fila.
function localCampoValor(cfg, fila) {
  const cands = Array.isArray(cfg.valor) ? cfg.valor : [cfg.valor];
  return cands.find(c => fila[c] != null) || cands[0];
}


// Las metas vienen como texto libre y algunas son "<2%": sin escapar, el
// navegador se come todo desde el "<" creyendo que abre una etiqueta.
function localEsc(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function localNum(v) {
  if (v == null) return null;
  if (typeof v === 'number') return v;
  let t = String(v).replace(/S\//g, '').replace(/\s/g, '').replace(/%/g, '');
  const mult = /M$/i.test(t) ? 1e6 : (/K$/i.test(t) ? 1e3 : 1);
  t = t.replace(/[MK]$/i, '').replace(/,/g, '');
  const n = parseFloat(t);
  return isNaN(n) ? null : n * mult;
}

function localFmt(v, esPct) {
  if (v == null) return '—';
  if (esPct) return v.toFixed(1) + '%';
  if (Math.abs(v) >= 1e6) return 'S/' + (v / 1e6).toFixed(2) + 'M';
  if (Math.abs(v) >= 1000) return 'S/' + v.toLocaleString('es-PE', { maximumFractionDigits: 0 });
  return v.toLocaleString('es-PE', { maximumFractionDigits: 2 });
}

// Palabras de la pregunta que sirven para buscar, sin las vacías.
function localTokens(p) {
  const vacias = new Set(['que','qué','cual','cuál','como','cómo','donde','dónde','quien','quién',
    'cuanto','cuánto','cuanta','cuánta','del','de','la','el','los','las','un','una','en','y','o',
    'es','son','esta','está','mi','mis','me','se','por','para','con','mas','más','tengo','hay','viene']);
  return p.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9ñ&\s]/g, ' ')
    .split(/\s+/).filter(w => w.length > 2 && !vacias.has(w));
}

// Dos palabras cuentan como la misma si tienen la misma raíz: en español la
// terminación cambia mucho ("faltando" / "faltante") y comparar completo deja
// fuera la mitad de las preguntas escritas con naturalidad.
//
// Se quita la terminación en vez de cortar por un número fijo de letras.
// Cortando a 6, "producido" y "productividad" eran la misma palabra y las
// preguntas sobre producción caían en el reporte de Productividad.
const TERMINACIONES = ['aciones','acion','ciones','cion','antes','ante','entes',
  'ente','mente','ando','endo','ados','idos','adas','idas','ado','ido','ada',
  'ida','os','as','es','s'];

function localRaiz(w) {
  for (const t of TERMINACIONES) {
    if (w.length - t.length >= 4 && w.endsWith(t)) return w.slice(0, -t.length);
  }
  return w;
}

function localMismaRaiz(a, b) {
  if (a === b) return true;
  const ra = localRaiz(a), rb = localRaiz(b);
  return ra.length >= 4 && ra === rb;
}
